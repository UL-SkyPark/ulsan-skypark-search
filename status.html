<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌸 울산하늘공원 접수 현황</title>

  <link rel="icon" type="image/png" href="./images/symbol.png">
  <link rel="apple-touch-icon" href="./images/symbol.png">

  <style>
    :root{
      --bg-a:#f7f7ff;
      --bg-b:#f2fbf7;
      --bg-c:#fff6fb;

      --card: rgba(255,255,255,0.92);
      --text:#0f172a;
      --muted:#64748b;

      --shadow: 0 14px 40px rgba(15,23,42,0.10);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% 10%, rgba(165,180,252,.55), transparent 55%),
        radial-gradient(900px 520px at 85% 0%, rgba(249,168,212,.45), transparent 55%),
        radial-gradient(1000px 600px at 60% 100%, rgba(134,239,172,.38), transparent 60%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b), var(--bg-c));
      padding: 14px;
    }

    .app{
      max-width: 820px;
      margin: 0 auto;
      border-radius: 24px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .top{
      padding: 16px 16px 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.58);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(148,163,184,0.14);
    }

    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
    }
    .title h1{
      margin:0;
      font-size: 1.22rem;
      letter-spacing: -0.02em;
      font-weight: 950;
    }
    .title .mini{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .bar{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .seg{
      display:flex;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex: 1 1 240px;
      min-width: 240px;
    }
    .seg button{
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 9px 10px;
      font-weight: 950;
      font-size: .95rem;
      cursor:pointer;
      background: transparent;
      color: rgba(15,23,42,0.72);
      transition: background .15s ease;
      min-height: 40px;
    }
    .seg button.active{
      background: linear-gradient(135deg, rgba(165,180,252,.95), rgba(147,197,253,.85));
      color: #0b1020;
      box-shadow: 0 8px 20px rgba(165,180,252,.25);
    }

    .date-row{
      display:flex;
      gap: 14px;
      align-items:stretch;
      flex: 1 1 420px;
      min-width: 320px;
    }

    .pill2{
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 18px;
      padding: 12px 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      min-height: 72px;
      flex: 1 1 200px;
    }
    .pill2 .k{
      color: var(--muted);
      font-size: .88rem;
      font-weight: 950;
      line-height: 1.05;
      white-space: nowrap;
    }
    .pill2 .v{
      font-weight: 950;
      font-size: .98rem;
      letter-spacing: -0.01em;
      line-height: 1.12;
      color: rgba(15,23,42,.86);
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ✅ 안치현황(카운트) 라인: 아래로 + 살짝 키우기 + 한 줄 유지(모바일에서도) */
    #countPill .v{
      margin-top: 6px;
      font-size: 1.06rem;
      line-height: 1.2;
      white-space: nowrap;
      flex-wrap: nowrap;
    }

    .pill2 input[type="date"]{
      border: 0;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(148,163,184,0.20);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 950;
      color: var(--text);
      outline: none;
      font-size: .95rem;
      -webkit-appearance:none;
      width: 100%;
    }

    @media (max-width: 520px){
      .seg{ min-width: 0; flex: 1 1 100%; }
      .date-row{ flex: 1 1 100%; }
    }

    .content{ padding: 12px 12px 14px; }

    .list{
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(15,23,42,0.08);
    }

    .list-head{
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .list-head .hint{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .list-head .right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 8px;
      margin-left:auto;
      flex-wrap: wrap;
    }
    .list-head .badge{
      font-size: .86rem;
      font-weight: 950;
      background: rgba(249,168,212,.16);
      border: 1px solid rgba(249,168,212,.25);
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
      color: rgba(15,23,42,.72);
    }

    ul{ list-style:none; padding:0; margin:0; }

    .itemRow{
      padding: 12px 12px;
      display:flex;
      flex-direction:column; /* ✅ 화장정보를 토글 아래(전체폭)로 내리기 */
      gap: 8px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      position: relative;
      background: transparent;
    }
    .itemRow::before{
      content:"";
      position:absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }

    /* ✅ 색(바)로만 상태 구분 */
    .itemRow.recv::before{ background: rgba(249,168,212,.55); }
    .itemRow.done::before{ background: rgba(134,239,172,.65); }
    .itemRow.ret::before{ background: rgba(148,163,184,.55); }
    .itemRow.retDone::before{ background: rgba(165,180,252,.70); }

    .rowTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      min-width: 0;
    }

    .itemMainBtn{
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      text-align:left;
      cursor: pointer;
      padding: 0;
      margin: 0;
    }
    .itemMainBtn:active{ background: rgba(165,180,252,.08); }

    .main{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap: 4px;
      padding-left: 6px;
    }
    .id{
      font-weight: 950;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: #0b1020;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .name{
      font-weight: 850;
      font-size: .95rem;
      color: rgba(15,23,42,0.78);
      word-break: keep-all;
      line-height: 1.25;
    }

    /* ✅ 리스트의 화장정보: 말줄임(ellipsis) + 길게 누르면 전체보기(토스트) */
    .cremWrap{
      padding-left: 6px; /* 왼쪽 정렬감 유지 */
      display:flex;
      flex-direction:column;
      gap: 2px;
    }
    .cremLine{
      font-weight: 850;
      font-size: .86rem;
      color: rgba(15,23,42,0.62);
      line-height: 1.22;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      cursor: default;
    }

    /* 리스트 우측 토글 */
    .rowToggle{
      flex: 0 0 auto;
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
      margin-top: -2px;
    }
    .rowToggle span{
      font-size: .82rem;
      font-weight: 950;
      color: rgba(15,23,42,.72);
      line-height: 1;
      white-space: nowrap;
    }
    .rowSwitch{
      width: 38px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(148,163,184,0.18);
      position: relative;
      flex: 0 0 auto;
    }
    .rowSwitch::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.22);
      transition: left .14s ease;
    }
    .rowSwitch.on{
      background: rgba(134,239,172,.28);
      border-color: rgba(134,239,172,.38);
    }
    .rowSwitch.on::after{ left: 18px; }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(15,23,42,0.55);
      font-weight: 900;
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.30);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 12px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(520px, 92vw);
      max-width: 520px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 22px;
      box-shadow: 0 28px 90px rgba(15,23,42,.20);
      overflow:hidden;
      backdrop-filter: blur(14px);
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    @media (max-width: 360px){
      .sheet{ width: 94vw; }
    }

    .sheet-head{
      position: relative;
      padding: 14px 14px 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      background: rgba(255,255,255,0.78);
      border-bottom: 1px solid rgba(148,163,184,0.18);
      min-height: 64px;
    }

    .headLeft{
      min-width:0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 6px;
      align-items:flex-start;
      justify-content:center;
      text-align:left;
      padding: 2px 12px 2px 12px;
    }

    .headLine{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.06rem;
      line-height: 1.15;
      width: 100%;
      text-align: left;
      display:block;
    }

    .headMeta{ display:none; }

    .sheet-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 12px;
    }

    .kv{
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 10px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      gap: 12px;
    }
    .kv .k{
      color: var(--muted);
      font-weight: 950;
      font-size: .88rem;
      flex: 0 0 92px;
      padding-top: 2px;
      text-align:left;
    }
    .kv .v{
      font-weight: 900;
      color: rgba(15,23,42,0.82);
      font-size: .95rem;
      text-align:left;
      word-break: keep-all;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    @media (min-width: 720px){
      #mFields{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    }

    .sheet-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
    }
    .btnSmall{
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
    }
    .ok{
      background: linear-gradient(135deg, rgba(134,239,172,.80), rgba(165,180,252,.80));
      border: 1px solid rgba(165,180,252,.22);
      color: rgba(15,23,42,.88);
    }

    /* ✅ 토스트: 전체보기용(줄바꿈 허용) */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.86);
      color: white;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: .92rem;
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:left;
      white-space: normal;
      line-height: 1.25;
      word-break: keep-all;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <div class="top" id="topBar">
      <div class="title">
        <h1>🌸 울산하늘공원 접수 현황</h1>
        <div class="mini" id="todayLabel">-</div>
      </div>

      <div class="bar">
        <div class="seg" role="tablist" aria-label="시설 선택">
          <button id="tabHouse" class="active" onclick="switchSource('house')">추모의집</button>
          <button id="tabNature" onclick="switchSource('nature')">자연장지</button>
        </div>

        <div class="date-row">
          <div class="pill2" id="datePill">
            <div class="k">날짜선택</div>
            <div class="v">
              <input type="date" id="datePicker" />
            </div>
          </div>

          <div class="pill2" id="countPill">
            <div class="k" id="countTitle">안치현황</div>
            <div class="v" id="countText">안치0건, 반출0건</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="listArea"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="headLeft">
          <p class="headLine" id="mTitleLine">-</p>
          <div class="headMeta" id="mMetaLine"></div>
        </div>
      </div>

      <div class="sheet-body">
        <div id="mFields"></div>
      </div>

      <div class="sheet-actions">
        <button class="btnSmall ok" onclick="closeSheet()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    function getLocalISODate(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const STORAGE_KEYS = { source: "uic_source_selected" };

    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    function normalizeToISODate(v){
      if (v == null) return '';
      const s = String(v).trim();
      if (!s) return '';

      const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m1) {
        const y = m1[1];
        const m = String(m1[2]).padStart(2,'0');
        const d = String(m1[3]).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }

      const m2 = s.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
      if (m2) {
        const y = m2[1];
        const m = String(m2[2]).padStart(2,'0');
        const d = String(m2[3]).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }

      const m3 = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m3) return `${m3[1]}-${m3[2]}-${m3[3]}`;

      return '';
    }

    function pickRetDate(obj){
      return obj?.retDate ?? obj?.retdate ?? obj?.RETDATE ?? obj?.RetDate ?? '';
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function fetchJson(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    }

    function showToast(msg, ms = 2000){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove('show'), ms);
    }

    function formatEnsNo(val){
      if (val == null) return '-';
      const raw = String(val).trim();
      if (!raw) return '-';

      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));
        if (roomPart && numPart){
          const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
          const numDigits = numPart.replace(/\D/g,'').padStart(5,'0').slice(-5);
          return `${roomDigits}실 ${numDigits}`;
        }
        if (roomPart){
          const tailNum = parts.slice().reverse().find(p => p.replace(/\D/g,'').length >= 5);
          if (tailNum){
            const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
            const numDigits = tailNum.replace(/\D/g,'').slice(-5).padStart(5,'0');
            return `${roomDigits}실 ${numDigits}`;
          }
        }
      }

      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1){
        const room = String(m1[1]).padStart(2,'0');
        const num = String(m1[2]).padStart(5,'0');
        return `${room}실 ${num}`;
      }

      let digits = raw.replace(/\D/g,'');
      if (!digits) return raw;

      if (digits.length === 6) digits = digits.padStart(7,'0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7){
        const room = digits.slice(0,2);
        const num = digits.slice(-5);
        return `${room}실 ${num}`;
      }

      return raw;
    }

    function mergeEnsRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const ens2 = (r.ensNO ?? r.ensNo ?? r.ensno ?? '').toString().trim();
        const key = ens2 || '__NO_ENS__';

        if (!map.has(key)){
          map.set(key, {
            ensNO: ens2 || '-',
            strDate: (r.strDate ?? '-'),
            deadname: (r.deadname ?? r.deadName ?? r.deceasedName ?? '-'),
            applname: (r.applname ?? r.applName ?? '-'),
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);

          const dn = (r.deadname ?? r.deadName ?? r.deceasedName ?? '-').toString();
          const an = (r.applname ?? r.applName ?? '-').toString();

          const curDn = (cur.deadname ?? '-').toString();
          const curAn = (cur.applname ?? '-').toString();

          if (dn && dn !== '-' && !curDn.split(' / ').includes(dn)){
            cur.deadname = (curDn && curDn !== '-') ? `${curDn} / ${dn}` : dn;
          }
          if (an && an !== '-' && !curAn.split(' / ').includes(an)){
            cur.applname = (curAn && curAn !== '-') ? `${curAn} / ${an}` : an;
          }

          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;

          cur._raw.push(r);
        }
      }

      return order.map(key => map.get(key));
    }

    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];
      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString();
        const applName = (r.applName ?? '').toString();
        const key = `${natNo}||${applName}`;
        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: (r.deadName ?? r.deadname ?? '-').toString(),
            applName: r.applName ?? '-',
            natDate: (r.natDate ?? '-').toString(),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = (r.deadName ?? r.deadname ?? '-').toString();
          if (dn && dn !== '-' && !cur.deadName.split(' / ').includes(dn)){
            cur.deadName = (cur.deadName && cur.deadName !== '-') ? `${cur.deadName} / ${dn}` : dn;
          }
          const dt = (r.natDate ?? '-').toString();
          if (dt && dt !== '-' && !cur.natDate.split(', ').includes(dt)){
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${dt}` : dt;
          }
          cur._raw.push(r);
        }
      }
      return order.map(key => map.get(key));
    }

    function itemStatusId(sourceKey, item){
      if (sourceKey === 'house'){
        const ens = (item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-');
        return String(ens ?? '-');
      }
      return String(item?.natNo ?? '-');
    }

    function recvKey(sourceKey, id){ return `recv_${sourceKey}_${id}`; }

    function recvPendingText(sourceKey){ return (sourceKey === 'nature') ? '안장대기' : '안치대기'; }
    function recvDoneText(sourceKey){ return (sourceKey === 'nature') ? '안장완료' : '안치완료'; }

    function isRecvDone(sourceKey, statusText){
      return statusText === recvDoneText(sourceKey);
    }

    function getRecvStatus(sourceKey, id){
      const v = localStorage.getItem(recvKey(sourceKey, id));
      if (!v) return recvPendingText(sourceKey);

      if (sourceKey !== 'nature' && v === '접수') return '안치대기';
      if (sourceKey === 'nature' && v === '안치대기') return '안장대기';
      if (sourceKey === 'nature' && v === '안치완료') return '안장완료';

      return v;
    }
    function setRecvStatus(sourceKey, id, val){
      localStorage.setItem(recvKey(sourceKey, id), val);
    }

    function isRetOnDate(item, isoDate){
      return normalizeToISODate(pickRetDate(item)) === isoDate;
    }

    function leftClsForMode(sourceKey, mode, statusText){
      if (mode === 'ret'){
        return (statusText === '반출완료') ? 'retDone' : 'ret';
      }
      return isRecvDone(sourceKey, statusText) ? 'done' : 'recv';
    }

    function kvRow(k, v){
      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    function kvRowLines(k, lines){
      const safeLines = (Array.isArray(lines) ? lines : [])
        .map(x => escapeHtml(x))
        .filter(Boolean);

      if (safeLines.length === 0) return '';

      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${safeLines.join('<br>')}</div>
        </div>
      `;
    }

    function calcSelectedCounts(sourceKey, rawData, selectedISO){
      const source = SOURCES[sourceKey];
      const dateKey = source.dateKey;

      if (sourceKey === 'house'){
        const rows = (Array.isArray(rawData) ? rawData : []).filter(x => {
          const str = String(x?.[dateKey] ?? '');
          const ret = normalizeToISODate(pickRetDate(x));
          return (str === selectedISO) || (ret === selectedISO);
        });

        const merged = mergeEnsRows(rows);

        let recv = 0;
        let ret = 0;
        for (const it of merged){
          const isRet = isRetOnDate(it, selectedISO);
          const isRecv = String(it.strDate ?? '') === selectedISO;
          if (isRet) ret++;
          else if (isRecv) recv++;
        }
        return { recv, ret };
      }

      const todays = (Array.isArray(rawData) ? rawData : []).filter(x => String(x?.[dateKey] ?? '') === selectedISO);
      const mergedN = mergeCoupleRows(todays);
      return { recv: mergedN.length, ret: 0 };
    }

    // -----------------------------
    // 🔥 crem.json 연동
    // -----------------------------
    let CREM_MAP = null;
    let LAST_CREM_MAP = null;

    async function ensureCremMap(){
      if (CREM_MAP) return CREM_MAP;
      try{
        const raw = await fetchJson("./data/crem.json");
        const arr = Array.isArray(raw) ? raw : [];
        const map = new Map();
        for (const r of arr){
          const id = (r?.deadId ?? "").toString().trim();
          if (!id) continue;
          map.set(id, r);
        }
        CREM_MAP = map;
        return map;
      }catch(e){
        CREM_MAP = new Map();
        return CREM_MAP;
      }
    }

    function pad2(n){
      const s = (n == null) ? "" : String(n).trim();
      if (!s) return "00";
      return s.padStart(2, "0").slice(-2);
    }

    function fmtTime(v){
      if (v == null) return "";
      return String(v).trim();
    }

    function cremLineObjByDeadId(deadId, cremMap){
      const did = (deadId ?? "").toString().trim();
      const rec = did ? cremMap.get(did) : null;

      if (!rec){
        return { type: 'pay', chasu: 9999, start: '', end: '', text: '선결재' };
      }

      const chasu = parseInt(pad2(rec?.burnChasu), 10);
      const st = fmtTime(rec?.burnStrTime);
      const en = fmtTime(rec?.burnEndTime);

      if (!st){
        return { type: 'info', chasu: isNaN(chasu) ? 9999 : chasu, start: '접수', end: '-', text: `${pad2(rec?.burnChasu)}회차, 화장시작: 접수, 화장종료: -` };
      }
      if (st && !en){
        return { type: 'info', chasu: isNaN(chasu) ? 9999 : chasu, start: st, end: '화장중', text: `${pad2(rec?.burnChasu)}회차, 화장시작: ${st}, 화장종료: 화장중` };
      }
      return { type: 'info', chasu: isNaN(chasu) ? 9999 : chasu, start: st, end: en, text: `${pad2(rec?.burnChasu)}회차, 화장시작: ${st}, 화장종료: ${en}` };
    }

    function getUniqueDeadIds(item){
      const raws = Array.isArray(item?._raw) ? item._raw : [item];
      const seen = new Set();
      const ids = [];
      for (const r of raws){
        const did = (r?.deadId ?? "").toString().trim();
        if (!did || seen.has(did)) continue;
        seen.add(did);
        ids.push(did);
      }
      return ids;
    }

    /* ✅ 정렬키: (반출 최상단) > '00회차' 기준 오름차순
       완료/대기 토글은 정렬에 영향 없음(그자리 유지) */
    function itemChasuKey(item, cremMap){
      const ids = getUniqueDeadIds(item);
      if (ids.length === 0) return 9999;
      const objs = ids.map(id => cremLineObjByDeadId(id, cremMap));
      const minChasu = Math.min(...objs.map(o => (typeof o.chasu === 'number' ? o.chasu : 9999)));
      return isFinite(minChasu) ? minChasu : 9999;
    }

    // ✅ 리스트 표시용: 말줄임 텍스트 + data-full로 전체보기(길게누름)
    function buildCremLinesHTML(item, cremMap, mode){
      if (mode === 'ret') return ''; // 리스트에서는 반출행 화장정보 숨김(원하시면 여기 제거)

      const ids = getUniqueDeadIds(item);
      if (ids.length === 0){
        const t = '선결재';
        return `<div class="cremWrap"><div class="cremLine" data-full="${escapeHtml(t)}" title="${escapeHtml(t)}">${escapeHtml(t)}</div></div>`;
      }

      const lineObjs = ids.map(did => cremLineObjByDeadId(did, cremMap));

      if (lineObjs.length >= 2){
        const allPay = lineObjs.every(o => o.type === 'pay');
        if (allPay){
          const t = '선결재';
          return `<div class="cremWrap"><div class="cremLine" data-full="${escapeHtml(t)}" title="${escapeHtml(t)}">${escapeHtml(t)}</div></div>`;
        }
      }

      const htmlLines = lineObjs
        .map(o => `<div class="cremLine" data-full="${escapeHtml(o.text)}" title="${escapeHtml(o.text)}">${escapeHtml(o.text)}</div>`)
        .join("");

      return `<div class="cremWrap">${htmlLines}</div>`;
    }

    // ✅ 모달 표시용: '00회차' 제거 + (화장시작 1줄, 화장종료 1줄)
    // 여러 명이면 " / "로 합쳐서 2줄만 유지
    function buildCremTimesForModal(item, cremMap){
      const ids = getUniqueDeadIds(item);
      if (ids.length === 0) return { startLine: '화장시작: -', endLine: '화장종료: -' };

      const objs = ids.map(id => cremLineObjByDeadId(id, cremMap));
      const allPay = (objs.length >= 1) && objs.every(o => o.type === 'pay');

      if (allPay){
        return { startLine: '화장시작: 선결재', endLine: '화장종료: 선결재' };
      }

      const starts = objs.map(o => o.start || '-');
      const ends = objs.map(o => o.end || '-');

      const startText = starts.join(' / ');
      const endText = ends.join(' / ');

      return { startLine: `화장시작: ${startText}`, endLine: `화장종료: ${endText}` };
    }

    // -----------------------------

    const datePicker = document.getElementById('datePicker');
    const todayLabel = document.getElementById('todayLabel');
    const listArea = document.getElementById('listArea');

    const tabHouse = document.getElementById('tabHouse');
    const tabNature = document.getElementById('tabNature');

    const countTitle = document.getElementById('countTitle');
    const countText = document.getElementById('countText');

    const overlay = document.getElementById('overlay');

    const mTitleLine = document.getElementById('mTitleLine');
    const mMetaLine = document.getElementById('mMetaLine');
    const mFields = document.getElementById('mFields');

    let currentSource = 'house';
    let currentDisplayData = [];
    let currentModalItem = null;
    let currentSelectedDate = '';

    const TODAY = getLocalISODate(new Date());
    datePicker.value = TODAY;
    todayLabel.textContent = `${TODAY}`;

    datePicker.addEventListener('change', () => {
      todayLabel.textContent = `${datePicker.value || TODAY}`;
      load();
    });

    function switchSource(sourceKey){
      currentSource = sourceKey;
      localStorage.setItem(STORAGE_KEYS.source, sourceKey);

      tabHouse.classList.toggle('active', sourceKey === 'house');
      tabNature.classList.toggle('active', sourceKey === 'nature');
      load();
    }

    function renderListHead(shownCount, totalCount){
      return `
        <div class="list-head">
          <div class="hint">접수현황</div>
          <div class="right">
            <div class="badge">${shownCount.toLocaleString()} / ${totalCount.toLocaleString()}</div>
          </div>
        </div>
      `;
    }

    function buildFields(item){
      let fieldsHTML = '';

      if (currentSource === 'house'){
        fieldsHTML += kvRow('안치일자', item.strDate ?? '-');
        fieldsHTML += kvRow('고인명', item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
        fieldsHTML += kvRow('신청자', item.applname ?? item.applName ?? '-');

        const rdISO = normalizeToISODate(pickRetDate(item));
        const rdRaw = pickRetDate(item);
        if (rdISO){
          fieldsHTML += kvRow('반출일자', String(rdRaw ?? rdISO));
        }
      } else {
        fieldsHTML += kvRow('안치일자', item.natDate ?? '-');
        fieldsHTML += kvRow('고인명', item.deadName ?? '-');
        fieldsHTML += kvRow('신청자', item.applName ?? '-');
      }

      // ✅ 모달에도 화장시간(2줄) 표시
      const cremMap = LAST_CREM_MAP;
      if (cremMap){
        const t = buildCremTimesForModal(item, cremMap);
        fieldsHTML += kvRowLines('화장시간', [t.startLine, t.endLine]);
      }

      return fieldsHTML;
    }

    // ✅ 정렬: 반출 최상단 > '00회차'(burnChasu) 오름차순 > 원래순서(안정정렬)
    function sortByWorkPriorityStable(arr, selectedISO, cremMap){
      const clone = arr.slice();

      clone.forEach((it, i) => { it._pos = (it._pos ?? i); });

      clone.sort((a, b) => {
        const modeA = (currentSource === 'house' && isRetOnDate(a, selectedISO)) ? 'ret' : 'recv';
        const modeB = (currentSource === 'house' && isRetOnDate(b, selectedISO)) ? 'ret' : 'recv';

        const grpA = (modeA === 'ret') ? 0 : 1;
        const grpB = (modeB === 'ret') ? 0 : 1;
        if (grpA !== grpB) return grpA - grpB;

        const ca = itemChasuKey(a, cremMap);
        const cb = itemChasuKey(b, cremMap);
        if (ca !== cb) return ca - cb;

        // ✅ 완료/대기 상태는 정렬에 반영하지 않음(그자리 유지)
        return (a._pos ?? 0) - (b._pos ?? 0);
      });

      return clone;
    }

    // ✅ 추모의집 반출 상태 유지
    function retKeyHouse(id){ return `ret_house_${id}`; }
    function getRetStatusHouse(id){
      const v = localStorage.getItem(retKeyHouse(id));
      if (!v) return '반출대기';
      if (v === '반출') return '반출대기';
      return v;
    }
    function setRetStatusHouse(id, val){
      localStorage.setItem(retKeyHouse(id), val);
    }

    // ✅ 길게누르면 화장정보 전체보기(토스트)
    function attachLongPressForCremLines(){
      const els = listArea.querySelectorAll('.cremLine[data-full]');
      const HOLD_MS = 420;

      els.forEach(el => {
        let timer = null;
        let fired = false;

        const full = () => (el.getAttribute('data-full') || '').trim();
        const start = (e) => {
          fired = false;
          clearTimeout(timer);
          timer = setTimeout(() => {
            fired = true;
            const txt = full();
            if (txt) showToast(txt, 4500);
          }, HOLD_MS);
        };
        const end = () => {
          clearTimeout(timer);
          timer = null;
        };

        el.addEventListener('touchstart', start, { passive: true });
        el.addEventListener('touchend', end);
        el.addEventListener('touchcancel', end);

        el.addEventListener('mousedown', start);
        el.addEventListener('mouseup', end);
        el.addEventListener('mouseleave', end);

        // ✅ 클릭 시(짧게) 아무 동작 없음(상세보기는 위쪽 버튼에서만)
        el.addEventListener('click', (e) => {
          if (fired) {
            e.preventDefault();
            e.stopPropagation();
          }
        });
      });
    }

    async function load(){
      const source = SOURCES[currentSource];
      const selectedDate = datePicker.value || TODAY;
      currentSelectedDate = selectedDate;

      try{
        const cremMap = await ensureCremMap();
        LAST_CREM_MAP = cremMap;

        const raw = await fetchJson(source.url);
        const data = Array.isArray(raw) ? raw : [];

        const c = calcSelectedCounts(currentSource, data, selectedDate);
        countTitle.textContent = `안치현황`;

        if (currentSource === 'house'){
          countText.innerHTML = `안치${c.recv}건, 반출${c.ret}건`;
        } else {
          countText.innerHTML = `안장${c.recv}건`;
        }

        const dateKey = source.dateKey;
        let filtered = [];

        if (currentSource === 'house'){
          filtered = data.filter(x => {
            const str = String(x?.[dateKey] ?? '');
            const ret = normalizeToISODate(pickRetDate(x));
            return (str === selectedDate) || (ret === selectedDate);
          });
        } else {
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selectedDate);
        }

        let displayData = filtered;
        if (currentSource === 'house') displayData = mergeEnsRows(filtered);
        if (currentSource === 'nature') displayData = mergeCoupleRows(filtered);

        // ✅ 안정정렬 기준용 원래 위치 저장
        displayData.forEach((it, i) => { it._pos = i; });

        displayData = sortByWorkPriorityStable(displayData, selectedDate, cremMap);
        currentDisplayData = displayData;

        if (displayData.length === 0){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          return;
        }

        const limit = 80;
        const shown = displayData.slice(0, limit);

        let html = `<div class="list">`;
        html += renderListHead(Math.min(limit, displayData.length), displayData.length);
        html += `<ul>`;

        shown.forEach((item, idx) => {
          let displayId = '-';
          let displayName = '-';
          const sid = itemStatusId(currentSource, item);

          const mode = (currentSource === 'house' && isRetOnDate(item, selectedDate)) ? 'ret' : 'recv';

          let statusText = '';
          let isOn = false;
          let rowLabel = '';
          let rowSwitchCls = 'rowSwitch';

          if (mode === 'ret'){
            statusText = getRetStatusHouse(sid);
            isOn = (statusText === '반출완료');
            rowLabel = isOn ? '반출완료' : '반출대기';
            rowSwitchCls = isOn ? 'rowSwitch on' : 'rowSwitch';
          } else {
            statusText = getRecvStatus(currentSource, sid);
            isOn = isRecvDone(currentSource, statusText);
            rowLabel = isOn ? recvDoneText(currentSource) : recvPendingText(currentSource);
            rowSwitchCls = isOn ? 'rowSwitch on' : 'rowSwitch';
          }

          if (currentSource === 'house'){
            displayId = formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-');
            displayName = (item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
          } else {
            displayId = String(item.natNo ?? '-');
            displayName = String(item.deadName ?? '-');
          }

          const leftCls = leftClsForMode(currentSource, mode, statusText);
          const cremHTML = buildCremLinesHTML(item, cremMap, mode);

          html += `
            <li>
              <div class="itemRow ${leftCls}">
                <div class="rowTop">
                  <button class="itemMainBtn" onclick="openSheet(${idx})" aria-label="상세 보기">
                    <div class="main">
                      <div class="id">${escapeHtml(displayId)}</div>
                      <div class="name">${escapeHtml(displayName)}</div>
                    </div>
                  </button>

                  <div class="rowToggle" role="switch" aria-checked="${isOn ? 'true' : 'false'}" onclick="applyRowToggle(${idx}, event)">
                    <div class="${rowSwitchCls}"></div>
                    <span>${escapeHtml(rowLabel)}</span>
                  </div>
                </div>

                ${cremHTML}
              </div>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (displayData.length > limit){
          listArea.insertAdjacentHTML('beforeend', `<div class="no-data" style="padding:10px 0 0;">(상위 ${limit}건만 표시 중)</div>`);
        }

        // ✅ 길게 누르면 전체보기 연결
        attachLongPressForCremLines();

      }catch(err){
        listArea.innerHTML = `<div class="no-data">❌ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      currentModalItem = item;

      const sourceLabel = SOURCES[currentSource].label;
      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      mTitleLine.textContent = `${sourceLabel} · ${headerNo}`;
      mMetaLine.innerHTML = '';

      mFields.innerHTML = buildFields(item);

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
      currentModalItem = null;
    }

    function applyRowToggle(index, e){
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const item = currentDisplayData[index];
      if (!item) return;

      const sid = itemStatusId(currentSource, item);

      const mode = (currentSource === 'house' && isRetOnDate(item, currentSelectedDate)) ? 'ret' : 'recv';

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      if (mode === 'ret'){
        const cur = getRetStatusHouse(sid);
        const next = (cur === '반출완료') ? '반출대기' : '반출완료';
        setRetStatusHouse(sid, next);
        showToast(`✅ ${headerNo} : ${next}`, 2200);
      } else {
        const cur = getRecvStatus(currentSource, sid);
        const done = recvDoneText(currentSource);
        const pending = recvPendingText(currentSource);
        const next = (cur === done) ? pending : done;
        setRecvStatus(currentSource, sid, next);
        showToast(`✅ ${headerNo} : ${next}`, 2200);
      }

      // ✅ 정렬이 상태에 영향 없어서 위치 유지됨
      load();
    }

    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    window.addEventListener('load', () => {
      const saved = localStorage.getItem(STORAGE_KEYS.source);
      const initial = (saved === 'nature' || saved === 'house') ? saved : 'house';
      currentSource = initial;

      tabHouse.classList.toggle('active', initial === 'house');
      tabNature.classList.toggle('active', initial === 'nature');

      datePicker.value = getLocalISODate(new Date());
      todayLabel.textContent = `${datePicker.value}`;
      load();
    });

    window.switchSource = switchSource;
    window.openSheet = openSheet;
    window.closeSheet = closeSheet;
    window.applyRowToggle = applyRowToggle;
  </script>
</body>
</html>
