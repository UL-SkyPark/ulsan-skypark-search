<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌸 울산하늘공원 접수 현황</title>

  <style>
    :root{
      --bg-a:#f7f7ff;
      --bg-b:#f2fbf7;
      --bg-c:#fff6fb;

      --card: rgba(255,255,255,0.92);
      --text:#0f172a;
      --muted:#64748b;

      --st-recv-bg: rgba(249,168,212,.22);
      --st-recv-bd: rgba(249,168,212,.38);
      --st-recv-tx: rgba(131,24,67,.85);

      --st-done-bg: rgba(134,239,172,.26);
      --st-done-bd: rgba(134,239,172,.40);
      --st-done-tx: rgba(20,83,45,.86);

      --shadow: 0 14px 40px rgba(15,23,42,0.10);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% 10%, rgba(165,180,252,.55), transparent 55%),
        radial-gradient(900px 520px at 85% 0%, rgba(249,168,212,.45), transparent 55%),
        radial-gradient(1000px 600px at 60% 100%, rgba(134,239,172,.38), transparent 60%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b), var(--bg-c));
      padding: 14px;
    }

    .app{
      max-width: 820px;
      margin: 0 auto;
      border-radius: 24px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .top{
      padding: 16px 16px 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
    }
    .title h1{
      margin:0;
      font-size: 1.22rem;
      letter-spacing: -0.02em;
      font-weight: 950;
    }
    .title .mini{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .bar{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .seg{
      display:flex;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex: 1 1 240px;
      min-width: 240px;
    }
    .seg button{
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 9px 10px;
      font-weight: 950;
      font-size: .95rem;
      cursor:pointer;
      background: transparent;
      color: rgba(15,23,42,0.72);
      transition: background .15s ease;
      min-height: 40px;
    }
    .seg button.active{
      background: linear-gradient(135deg, rgba(165,180,252,.95), rgba(147,197,253,.85));
      color: #0b1020;
      box-shadow: 0 8px 20px rgba(165,180,252,.25);
    }

    /* ✅ 모바일에서 날짜 + 오늘접수 건수 나란히 */
    .date-row{
      display:flex;
      gap: 10px;
      align-items:center;
      flex: 1 1 320px;
      min-width: 280px;
    }

    .date-wrap{
      display:flex;
      align-items:center;
      gap: 8px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px;
      padding: 6px 10px;
      flex: 1 1 auto;
      min-width: 180px;
    }
    .date-wrap .label{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      padding-left: 6px;
      white-space: nowrap;
    }
    .date-wrap input[type="date"]{
      border: 0;
      background: transparent;
      padding: 6px 6px;
      font-weight: 950;
      color: var(--text);
      outline: none;
      font-size: .95rem;
      min-width: 150px;
      -webkit-appearance:none;
      flex: 1;
    }

    .todayCount{
      display:flex;
      align-items:center;
      gap: 8px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px;
      padding: 6px 10px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .todayCount .k{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
    }
    .todayCount .v{
      font-weight: 950;
      font-size: .98rem;
      letter-spacing: -0.01em;
    }

    @media (max-width: 520px){
      .seg{ min-width: 0; flex: 1 1 100%; }
      .date-row{ flex: 1 1 100%; }
      .date-wrap input[type="date"]{ min-width: 0; }
    }

    .filters{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      font-weight: 950;
      font-size: .9rem;
      cursor:pointer;
      user-select:none;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .chip:active{ transform: translateY(1px); }

    .chip input{
      width: 16px;
      height: 16px;
      accent-color: rgba(165,180,252,1);
    }

    .chip.recv.on{
      background: var(--st-recv-bg);
      border-color: var(--st-recv-bd);
      color: var(--st-recv-tx);
      box-shadow: 0 10px 24px rgba(249,168,212,.18);
    }
    .chip.done.on{
      background: var(--st-done-bg);
      border-color: var(--st-done-bd);
      color: var(--st-done-tx);
      box-shadow: 0 10px 24px rgba(134,239,172,.16);
    }

    .stats{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .stat{
      flex: 1 1 160px;
      background: rgba(255,255,255,0.70);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 10px 12px;
    }
    .stat .num{
      font-weight: 950;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .stat .txt{
      color: var(--muted);
      font-weight: 850;
      font-size: .88rem;
      margin-top: 2px;
    }

    .content{
      padding: 12px 12px 14px;
      border-top: 1px solid rgba(148,163,184,0.14);
    }

    .list{
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(15,23,42,0.08);
    }

    .list-head{
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .list-head .hint{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
    }
    .list-head .badge{
      font-size: .86rem;
      font-weight: 950;
      background: rgba(249,168,212,.16);
      border: 1px solid rgba(249,168,212,.25);
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
      color: rgba(15,23,42,.72);
    }

    ul{ list-style:none; padding:0; margin:0; }

    .item{
      width:100%;
      border:0;
      background: transparent;
      text-align:left;
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      cursor:pointer;
      position: relative;
    }
    .item::before{
      content:"";
      position:absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }
    .item.recv::before{ background: rgba(249,168,212,.55); }
    .item.done::before{ background: rgba(134,239,172,.65); }

    .item:active{ background: rgba(165,180,252,.08); }

    .main{
      min-width:0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 4px;
      padding-left: 6px;
    }
    .id{
      font-weight: 950;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: #0b1020;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .name{
      font-weight: 850;
      font-size: .95rem;
      color: rgba(15,23,42,0.78);
      word-break: keep-all;
      line-height: 1.25;
    }

    .badge-st{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 950;
      font-size: .82rem;
      border: 1px solid rgba(148,163,184,0.18);
    }
    .badge-recv{
      background: var(--st-recv-bg);
      border-color: var(--st-recv-bd);
      color: var(--st-recv-tx);
    }
    .badge-done{
      background: var(--st-done-bg);
      border-color: var(--st-done-bd);
      color: var(--st-done-tx);
    }

    .chev{
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(147,197,253,.18);
      border: 1px solid rgba(147,197,253,.24);
      display:grid;
      place-items:center;
      font-weight: 950;
      color: rgba(15,23,42,.55);
      flex: 0 0 auto;
    }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(15,23,42,0.55);
      font-weight: 900;
    }

    /* 모달 */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.30);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(760px, 100%);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 22px;
      box-shadow: 0 28px 90px rgba(15,23,42,.20);
      overflow:hidden;
      backdrop-filter: blur(14px);
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    .sheet-head{
      padding: 14px 14px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      background: rgba(255,255,255,0.78);
      border-bottom: 1px solid rgba(148,163,184,0.18);
    }
    .sheet-head .t{ min-width:0; }
    .sheet-head .t .line1{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.06rem;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ✅ 우측 상단: 닫힘 버튼 삭제, 상태 드랍박스 배치 */
    .headRight{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .headRight select{
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.30);
      padding: 9px 10px;
      font-weight: 950;
      background: rgba(255,255,255,0.90);
      outline: none;
      min-height: 42px;
    }

    .sheet-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 10px;
    }

    .kv{
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 10px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .kv .k{
      color: var(--muted);
      font-weight: 950;
      font-size: .88rem;
      flex: 0 0 auto;
      padding-top: 2px;
    }
    .kv .v{
      font-weight: 900;
      color: rgba(15,23,42,0.82);
      font-size: .95rem;
      text-align:right;
      word-break: keep-all;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    .sheet-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
    }
    .btnSmall{
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
    }
    .ok{
      background: linear-gradient(135deg, rgba(134,239,172,.80), rgba(165,180,252,.80));
      border: 1px solid rgba(165,180,252,.22);
      color: rgba(15,23,42,.88);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.80);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="title">
        <h1>🌸 울산하늘공원 접수 현황</h1>
        <div class="mini" id="todayLabel">오늘: -</div>
      </div>

      <div class="bar">
        <div class="seg" role="tablist" aria-label="시설 선택">
          <button id="tabHouse" class="active" onclick="switchSource('house')">추모의집</button>
          <button id="tabNature" onclick="switchSource('nature')">자연장지</button>
        </div>

        <!-- ✅ 날짜 + 오늘접수(접수상태, TODAY 기준) -->
        <div class="date-row">
          <div class="date-wrap">
            <span class="label">날짜</span>
            <input type="date" id="datePicker" />
          </div>
          <div class="todayCount" title="오늘(접수) 건수">
            <span class="k">오늘접수</span>
            <span class="v" id="todayRecvCount">0</span>
          </div>
        </div>
      </div>

      <div class="filters">
        <label class="chip recv" id="chipRecv" title="접수만 보기">
          <input type="radio" name="statusFilter" id="filterRecv" value="접수" />
          접수
        </label>
        <label class="chip done" id="chipDone" title="안치완료만 보기">
          <input type="radio" name="statusFilter" id="filterDone" value="안치완료" />
          안치완료
        </label>
      </div>

      <div class="stats" id="stats"></div>
    </div>

    <div class="content">
      <div id="listArea"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="t">
          <!-- ✅ 봉안/안치번호가 여기(상단)에 확실히 표기 -->
          <p class="line1" id="mTitle">-</p>
          <!-- ✅ 봉안번호 아래 고인명(라인2) 표기하지 않음 -->
        </div>

        <!-- ✅ 닫힘 버튼 삭제 + 상태 드랍박스 배치 -->
        <div class="headRight">
          <select id="mStatus" aria-label="상태 선택">
            <option value="접수">접수</option>
            <option value="안치완료">안치완료</option>
          </select>
        </div>
      </div>

      <div class="sheet-body">
        <!-- ✅ 현황칸(별도 kv) 삭제 -->
        <div id="mFields"></div>
      </div>

      <div class="sheet-actions">
        <!-- ✅ 번호 복사 기능 삭제 -->
        <button class="btnSmall ok" onclick="closeSheet()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    function getLocalISODate(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    const ID_CANDIDATES = ['natNo','deceasedNo','receiptNo','recNo','applyNo','no','id','번호','접수번호','관리번호'];
    const NAME_CANDIDATES = ['deadName','deadname','deceasedName','name','고인명','사망자명'];

    function pickField(obj, candidates){
      for (const k of candidates){
        if (obj && Object.prototype.hasOwnProperty.call(obj, k) && obj[k] != null && String(obj[k]).trim() !== '') return k;
      }
      return null;
    }
    function getId(obj){
      const k = pickField(obj, ID_CANDIDATES);
      return k ? String(obj[k]) : '-';
    }
    function getName(obj){
      const k = pickField(obj, NAME_CANDIDATES);
      return k ? String(obj[k]) : '-';
    }

    function statusCategory(status){
      const s = (status ?? '').toString().trim();
      if (s === '안치완료' || s === '안장완료') return 'done';
      return 'recv';
    }
    function statusBadgeHTML(status){
      const cat = statusCategory(status);
      return cat === 'done'
        ? `<span class="badge-st badge-done">안치완료</span>`
        : `<span class="badge-st badge-recv">접수</span>`;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function fetchJson(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    }

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* ✅ ensNO(안치번호) 포맷: '00실 00000' */
    function formatEnsNo(val){
      if (val == null) return '-';
      const s = String(val).trim();
      if (!s) return '-';
      if (s.includes('실')) return s; // 이미 포맷된 경우

      const digits = s.replace(/\D/g,'');
      if (!digits) return s;

      // 7자리 이상이면: 앞 2자리=실, 뒤 5자리=번호
      if (digits.length >= 7){
        const room = digits.slice(0,2);
        const num = digits.slice(-5);
        return `${room}실 ${num}`;
      }
      // 5자리면: 실 정보가 없으니 그대로(또는 "00실" 규칙이 있으면 여기서 보정 가능)
      if (digits.length === 5){
        return digits;
      }
      return s;
    }

    /* ✅ 추모의집: 동일 ensNO(안치번호) 묶기 */
    function mergeEnsRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const ens = (r.ensNO ?? r.ensNo ?? r.ensno ?? '').toString().trim();
        const key = ens || '__NO_ENS__';

        if (!map.has(key)){
          map.set(key, {
            ensNO: ens || '-',
            strDate: (r.strDate ?? '-'),
            deadNames: new Set([(r.deadname ?? r.deadName ?? r.deceasedName ?? '-').toString()]),
            applNames: new Set([(r.applname ?? r.applName ?? '-').toString()]),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          cur.deadNames.add((r.deadname ?? r.deadName ?? r.deceasedName ?? '-').toString());
          cur.applNames.add((r.applname ?? r.applName ?? '-').toString());
          cur._raw.push(r);
        }
      }

      return order.map(key => {
        const v = map.get(key);
        const deadJoined = Array.from(v.deadNames).filter(x => x && x !== '-').join(' / ') || '-';
        const applJoined = Array.from(v.applNames).filter(x => x && x !== '-').join(' / ') || '-';
        return {
          ensNO: v.ensNO,
          strDate: v.strDate,
          deadname: deadJoined,
          applname: applJoined,
          _raw: v._raw
        };
      });
    }

    /* ✅ 자연장지: 부부장 병합(기존 유지) */
    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];
      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString();
        const applName = (r.applName ?? '').toString();
        const key = `${natNo}||${applName}`;
        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            applName: r.applName ?? '-',
            deadNames: new Set([(r.deadName ?? r.deadname ?? '-').toString()]),
            dates: new Set([(r.natDate ?? '-').toString()]),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          cur.deadNames.add((r.deadName ?? r.deadname ?? '-').toString());
          cur.dates.add((r.natDate ?? '-').toString());
          cur._raw.push(r);
        }
      }
      return order.map(key => {
        const v = map.get(key);
        const deadNameJoined = Array.from(v.deadNames).filter(x => x && x !== '-').join(' / ') || '-';
        const dateJoined = Array.from(v.dates).filter(x => x && x !== '-').join(', ') || '-';
        return {
          natNo: v.natNo,
          deadName: deadNameJoined,
          applName: v.applName,
          natDate: dateJoined,
          _raw: v._raw
        };
      });
    }

    /* ✅ 상태 저장 키: 추모의집=ensNO 기준, 자연장지=natNo 기준 */
    function itemStatusId(sourceKey, item){
      if (sourceKey === 'house'){
        const ens = (item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-');
        return String(ens ?? '-');
      }
      // nature
      return String(item?.natNo ?? '-');
    }

    function statusKey(sourceKey, id){ return `status_${sourceKey}_${id}`; }
    function getStatus(sourceKey, id){ return localStorage.getItem(statusKey(sourceKey, id)) || '접수'; }
    function setStatus(sourceKey, id, val){ localStorage.setItem(statusKey(sourceKey, id), val); }

    // DOM
    const datePicker = document.getElementById('datePicker');
    const todayLabel = document.getElementById('todayLabel');
    const statsDiv = document.getElementById('stats');
    const listArea = document.getElementById('listArea');

    const tabHouse = document.getElementById('tabHouse');
    const tabNature = document.getElementById('tabNature');

    const filterRecv = document.getElementById('filterRecv');
    const filterDone = document.getElementById('filterDone');
    const chipRecv = document.getElementById('chipRecv');
    const chipDone = document.getElementById('chipDone');

    const todayRecvCountEl = document.getElementById('todayRecvCount');

    const overlay = document.getElementById('overlay');
    const mTitle = document.getElementById('mTitle');
    const mStatus = document.getElementById('mStatus');
    const mFields = document.getElementById('mFields');

    let currentSource = 'house';
    let currentDisplayData = [];

    const TODAY = getLocalISODate(new Date());
    todayLabel.textContent = `오늘: ${TODAY}`;
    datePicker.value = TODAY;

    filterRecv.checked = true;

    function syncChipStyles(){
      chipRecv.classList.toggle('on', filterRecv.checked);
      chipDone.classList.toggle('on', filterDone.checked);
    }
    syncChipStyles();

    datePicker.addEventListener('change', () => load());
    filterRecv.addEventListener('change', () => { syncChipStyles(); load(); });
    filterDone.addEventListener('change', () => { syncChipStyles(); load(); });

    function switchSource(sourceKey){
      currentSource = sourceKey;
      tabHouse.classList.toggle('active', sourceKey === 'house');
      tabNature.classList.toggle('active', sourceKey === 'nature');
      load();
    }

    function selectedFilterValue(){
      if (filterDone.checked) return '안치완료';
      return '접수';
    }

    function applyRadioFilter(rows){
      const want = selectedFilterValue(); // '접수' or '안치완료'
      return rows.filter(item => {
        const sid = itemStatusId(currentSource, item);
        const st = getStatus(currentSource, sid);
        const cat = statusCategory(st);
        const normalized = (cat === 'done') ? '안치완료' : '접수';
        return normalized === want;
      });
    }

    function kvRow(k, v){
      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    /* ✅ 오늘(접수) 건수: TODAY + '접수' 기준 */
    function calcTodayRecvCount(sourceKey, rawData){
      const source = SOURCES[sourceKey];
      const dateKey = source.dateKey;

      const todays = (Array.isArray(rawData) ? rawData : []).filter(x => String(x?.[dateKey] ?? '') === TODAY);

      let display = todays;
      if (sourceKey === 'house') display = mergeEnsRows(todays);
      if (sourceKey === 'nature') display = mergeCoupleRows(todays);

      // '접수'만 카운트(라디오와 무관)
      const count = display.filter(item => {
        const sid = itemStatusId(sourceKey, item);
        const st = getStatus(sourceKey, sid);
        const cat = statusCategory(st);
        return (cat !== 'done'); // 접수
      }).length;

      return count;
    }

    async function load(){
      const source = SOURCES[currentSource];
      const selectedDate = datePicker.value || TODAY;

      try{
        const raw = await fetchJson(source.url);
        const data = Array.isArray(raw) ? raw : [];

        // ✅ 오늘접수 건수(접수 고정, TODAY 기준)
        todayRecvCountEl.textContent = calcTodayRecvCount(currentSource, data).toLocaleString();

        // 날짜 필터(해당 날짜만)
        const dateKey = source.dateKey;
        let filtered = data.filter(x => String(x?.[dateKey] ?? '') === selectedDate);

        // 표시 데이터(병합)
        let displayData = filtered;
        if (currentSource === 'house') displayData = mergeEnsRows(filtered);
        if (currentSource === 'nature') displayData = mergeCoupleRows(filtered);

        // ✅ 라디오 필터 적용(접수/안치완료)
        displayData = applyRadioFilter(displayData);

        // ✅ 정렬: 접수 위, 안치완료 아래
        displayData = displayData
          .map((item, idx) => ({ item, idx }))
          .sort((a,b) => {
            const ida = itemStatusId(currentSource, a.item);
            const idb = itemStatusId(currentSource, b.item);
            const ra = statusCategory(getStatus(currentSource, ida)) === 'done' ? 1 : 0;
            const rb = statusCategory(getStatus(currentSource, idb)) === 'done' ? 1 : 0;
            if (ra !== rb) return ra - rb;
            return a.idx - b.idx;
          })
          .map(x => x.item);

        currentDisplayData = displayData;

        const filterLabel = selectedFilterValue();
        statsDiv.innerHTML = `
          <div class="stat">
            <div class="num">${displayData.length.toLocaleString()}</div>
            <div class="txt">${source.label} · ${selectedDate} · ${filterLabel}</div>
          </div>
          <div class="stat">
            <div class="num">${data.length.toLocaleString()}</div>
            <div class="txt">원본 전체 건수</div>
          </div>
        `;

        if (displayData.length === 0){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          return;
        }

        const limit = 80;
        const shown = displayData.slice(0, limit);

        let html = `
          <div class="list">
            <div class="list-head">
              <div class="hint">안치번호+고인명 · 눌러서 상세</div>
              <div class="badge">${Math.min(limit, displayData.length).toLocaleString()} / ${displayData.length.toLocaleString()}</div>
            </div>
            <ul>
        `;

        shown.forEach((item, idx) => {
          // ✅ 리스트 표시용 번호/고인명
          let displayId = '-';
          let displayName = '-';
          let statusId = itemStatusId(currentSource, item);

          if (currentSource === 'house'){
            displayId = formatEnsNo(item.ensNO ?? '-');
            displayName = item.deadname ?? '-';
          } else {
            displayId = String(item.natNo ?? '-');
            displayName = String(item.deadName ?? '-');
          }

          const stRaw = getStatus(currentSource, statusId);
          const cat = statusCategory(stRaw);
          const leftCls = (cat === 'done') ? 'done' : 'recv';
          const badge = (cat === 'done')
            ? `<span class="badge-st badge-done">안치완료</span>`
            : `<span class="badge-st badge-recv">접수</span>`;

          html += `
            <li>
              <button class="item ${leftCls}" onclick="openSheet(${idx})">
                <div class="main">
                  <div class="id">
                    ${escapeHtml(displayId)}
                    ${badge}
                  </div>
                  <div class="name">${escapeHtml(displayName)}</div>
                </div>
                <div class="chev">›</div>
              </button>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (displayData.length > limit){
          listArea.insertAdjacentHTML('beforeend', `<div class="no-data" style="padding:10px 0 0;">(상위 ${limit}건만 표시 중)</div>`);
        }

      }catch(err){
        listArea.innerHTML = `<div class="no-data">❌ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      const sourceLabel = SOURCES[currentSource].label;

      // ✅ 상태 키(추모의집=ensNO, 자연장지=natNo)
      const sid = itemStatusId(currentSource, item);

      const stRaw = getStatus(currentSource, sid);
      const cat = statusCategory(stRaw);
      const stShow = (cat === 'done') ? '안치완료' : '접수';

      // ✅ 모달 상단: 안치번호(추모의집=ensNO 포맷, 자연장지=natNo)
      let headerNo = '-';
      if (currentSource === 'house'){
        headerNo = formatEnsNo(item.ensNO ?? '-');
      } else {
        headerNo = String(item.natNo ?? '-');
      }
      mTitle.innerHTML = `${escapeHtml(sourceLabel)} · ${escapeHtml(headerNo)} ${statusBadgeHTML(stShow)}`;

      // ✅ 우측 상단 상태 드랍박스
      mStatus.value = stShow;
      mStatus.onchange = (e) => {
        setStatus(currentSource, sid, e.target.value);
        showToast(`✅ ${headerNo} : ${e.target.value}`);
        load();
      };

      // ✅ 상세 필드: 고정 구성
      let fieldsHTML = '';

      if (currentSource === 'house'){
        // 요청 필드: strDate=안치일자, ensNO=안치번호, deadname=고인명, applname=신청자
        // retdate 표기 금지
        fieldsHTML += kvRow('안치일자', item.strDate ?? '-');
        fieldsHTML += kvRow('안치번호', formatEnsNo(item.ensNO ?? '-'));
        fieldsHTML += kvRow('고인명', item.deadname ?? '-');
        fieldsHTML += kvRow('신청자', item.applname ?? '-');
      } else {
        // 자연장지: 안치일자, 안치번호, 고인명, 신청자 순
        fieldsHTML += kvRow('안치일자', item.natDate ?? '-');
        fieldsHTML += kvRow('안치번호', item.natNo ?? '-');
        fieldsHTML += kvRow('고인명', item.deadName ?? '-');
        fieldsHTML += kvRow('신청자', item.applName ?? '-');
      }

      mFields.innerHTML = fieldsHTML;

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
    }

    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    window.addEventListener('load', () => {
      datePicker.value = TODAY;
      switchSource('house');
    });
  </script>
</body>
</html>
