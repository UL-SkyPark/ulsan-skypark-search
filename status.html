<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌿 자연장지 안장현황</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#141a33;
      --card: rgba(255,255,255,0.92);
      --card2: rgba(255,255,255,0.78);
      --text:#0f172a;
      --muted:#64748b;
      --line: rgba(148,163,184,0.35);
      --brand1:#6d5efc;
      --brand2:#22c55e;
      --shadow: 0 14px 40px rgba(0,0,0,.24);
      --radius: 18px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(109,94,252,.45), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(34,197,94,.35), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      padding: 14px;
      overscroll-behavior: none;
    }

    .container{
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .header{
      padding: 18px 18px 14px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
    }

    .title-wrap{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 0;
    }

    h1{
      margin:0;
      font-size: clamp(1.2rem, 4.8vw, 1.7rem);
      letter-spacing: -0.02em;
      color: rgba(255,255,255,0.95);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle{
      color: rgba(255,255,255,0.72);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .panel{
      padding: 14px 14px 16px;
      background: rgba(255,255,255,0.08);
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .controls{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .date-pill{
      flex: 1 1 220px;
      background: linear-gradient(135deg, rgba(109,94,252,.95), rgba(109,94,252,.65));
      color:#fff;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 700;
      box-shadow: 0 10px 28px rgba(109,94,252,.32);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .date-pill small{
      opacity:.9;
      font-weight:700;
      font-size:.85rem;
      white-space:nowrap;
    }

    .date-picker{
      flex: 1 1 160px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.92);
      outline: none;
      font-size: 1rem;
      -webkit-appearance:none;
      backdrop-filter: blur(12px);
    }
    .date-picker:focus{
      border-color: rgba(109,94,252,0.75);
      box-shadow: 0 0 0 4px rgba(109,94,252,.22);
    }

    .btns{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width:100%;
    }
    button{
      border: 0;
      padding: 12px 12px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor:pointer;
      min-height: 48px;
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
      touch-action: manipulation;
    }
    button:active{ transform: translateY(1px); }

    .btn-query{
      background: linear-gradient(135deg, rgba(109,94,252,1), rgba(153,132,255,0.95));
      color:#fff;
      box-shadow: 0 12px 30px rgba(109,94,252,.28);
    }
    .btn-all{
      background: linear-gradient(135deg, rgba(34,197,94,1), rgba(16,185,129,0.95));
      color:#06210f;
      box-shadow: 0 12px 30px rgba(34,197,94,.20);
    }
    button:disabled{
      background: rgba(255,255,255,0.16) !important;
      color: rgba(255,255,255,0.45);
      cursor:not-allowed;
      box-shadow:none;
      transform:none;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .stat{
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 12px 12px;
      color: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
    }
    .stat .num{
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }
    .stat .label{
      font-size: .86rem;
      color: rgba(255,255,255,0.72);
      font-weight: 600;
    }

    /* ✅ 목록형 리스트 */
    .content{
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .list{
      background: var(--card2);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 44px rgba(0,0,0,.16);
    }

    .list-head{
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .list-head .hint{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .list-head .badge{
      font-size: .85rem;
      font-weight: 900;
      color: #2b2f3a;
      background: rgba(109,94,252,.12);
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(109,94,252,.18);
      white-space: nowrap;
    }

    ul{ list-style:none; padding:0; margin:0; }
    .item-btn{
      width:100%;
      text-align:left;
      background: transparent;
      border: 0;
      padding: 14px 14px;
      display:flex;
      gap: 12px;
      align-items:center;
      border-bottom: 1px solid var(--line);
      cursor:pointer;
    }
    .item-btn:hover{ background: rgba(109,94,252,.06); }
    .item-btn:active{ background: rgba(109,94,252,.10); }

    .left{
      min-width: 0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 4px;
    }
    .natno{
      font-weight: 950;
      letter-spacing: -0.01em;
      color: #111827;
      font-size: 1.02rem;
    }
    .deadname{
      color: #374151;
      font-weight: 750;
      font-size: .95rem;
      line-height: 1.25;
      word-break: keep-all;
    }
    .chev{
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      background: rgba(17,24,39,.06);
      color: rgba(17,24,39,.62);
      font-weight: 900;
      user-select:none;
    }

    .no-data{
      text-align:center;
      padding: 30px 16px;
      color: rgba(255,255,255,0.75);
      font-weight: 700;
    }

    .more-info{
      text-align:center;
      color: rgba(255,255,255,0.75);
      font-size: .9rem;
      margin-top: 10px;
      font-weight: 700;
    }

    /* 로딩 */
    .loading{
      display:inline-block;
      width:18px; height:18px;
      border: 3px solid rgba(255,255,255,0.35);
      border-top-color: rgba(255,255,255,0.95);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg);} }

    /* ✅ 모달(바텀시트) */
    .modal-overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.52);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px;
      z-index: 9999;
    }
    .modal{
      width: min(720px, 100%);
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 22px;
      box-shadow: 0 22px 80px rgba(0,0,0,.35);
      overflow:hidden;
      transform: translateY(10px);
      opacity: 0;
      transition: transform .18s ease, opacity .18s ease;
      backdrop-filter: blur(18px);
    }
    .modal-overlay.show { display:flex; }
    .modal-overlay.show .modal{ transform: translateY(0); opacity: 1; }

    .modal-header{
      padding: 14px 14px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(148,163,184,0.25);
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(10px);
    }
    .modal-title{
      min-width:0;
    }
    .modal-title .nat{
      font-weight: 950;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      margin: 0 0 4px 0;
      color:#0f172a;
    }
    .modal-title .dead{
      margin:0;
      font-weight: 800;
      color:#334155;
      word-break: keep-all;
      line-height: 1.25;
    }
    .close-btn{
      border:0;
      background: rgba(15,23,42,0.06);
      width: 42px;
      height: 42px;
      border-radius: 14px;
      cursor:pointer;
      font-weight: 950;
      color: rgba(15,23,42,0.75);
    }

    .modal-body{
      padding: 14px;
      display:grid;
      gap: 10px;
    }

    .field{
      background: rgba(2,6,23,0.04);
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 16px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .field .k{
      font-size: .9rem;
      color: #64748b;
      font-weight: 800;
      flex: 0 0 auto;
    }
    .field .v{
      font-size: .98rem;
      font-weight: 850;
      color:#0f172a;
      text-align:right;
      word-break: keep-all;
      flex: 1;
      min-width: 0;
    }

    .status-select{
      width: 160px;
      max-width: 100%;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,0.45);
      background: rgba(255,255,255,0.88);
      font-weight: 850;
      color:#0f172a;
      outline:none;
    }
    .status-select:focus{
      border-color: rgba(109,94,252,0.75);
      box-shadow: 0 0 0 4px rgba(109,94,252,.18);
    }

    .modal-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
    }
    .ghost{
      flex:1;
      background: rgba(15,23,42,0.06);
      color: rgba(15,23,42,0.8);
      box-shadow:none;
    }
    .primary{
      flex:1;
      background: linear-gradient(135deg, rgba(109,94,252,1), rgba(153,132,255,0.95));
      color:#fff;
      box-shadow: 0 12px 34px rgba(109,94,252,.25);
    }

    /* 토스트 */
    .toast{
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.82);
      color: white;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: .95rem;
      z-index: 10000;
      max-width: 92%;
      text-align:center;
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    @media (max-width: 420px){
      .btns{ grid-template-columns: 1fr; }
      .date-pill{ flex: 1 1 100%; }
      .date-picker{ flex: 1 1 100%; }
    }

    @supports (-webkit-touch-callout: none) {
      html { cursor: pointer; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="title-wrap">
        <h1>🌿 자연장지 안장현황</h1>
        <div class="subtitle">목록에서 항목을 누르면 상세(모달)로 확인</div>
      </div>
    </div>

    <div class="panel">
      <div class="controls">
        <div class="row">
          <div class="date-pill" id="selectedDate">
            <span>📅 오늘</span>
            <small id="selectedDateSub"></small>
          </div>
          <input type="date" id="datePicker" class="date-picker" />
        </div>

        <div class="btns">
          <button class="btn-query" id="btnQuery" onclick="loadStatus()">📅 날짜 조회</button>
          <button class="btn-all" id="btnAll" onclick="loadAllStatus()">👀 전체 보기</button>
        </div>

        <div class="stats" id="stats"></div>
      </div>
    </div>

    <div class="content">
      <div id="statusTable"></div>
    </div>
  </div>

  <!-- ✅ 모달(바텀시트) -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document" aria-label="상세 정보">
      <div class="modal-header">
        <div class="modal-title">
          <p class="nat" id="mNatNo">-</p>
          <p class="dead" id="mDeadName">-</p>
        </div>
        <button class="close-btn" onclick="closeModal()" aria-label="닫기">✕</button>
      </div>

      <div class="modal-body">
        <div class="field">
          <div class="k">신청자명</div>
          <div class="v" id="mApplName">-</div>
        </div>
        <div class="field">
          <div class="k">안장일자</div>
          <div class="v" id="mNatDate">-</div>
        </div>
        <div class="field">
          <div class="k">현황</div>
          <div class="v" style="display:flex; justify-content:flex-end;">
            <select class="status-select" id="mStatusSelect"></select>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="ghost" onclick="copyNatNo()">📋 안장번호 복사</button>
        <button class="primary" onclick="closeModal()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    const datePicker = document.getElementById('datePicker');
    const dateDisplay = document.getElementById('selectedDate');
    const dateDisplaySub = document.getElementById('selectedDateSub');
    const btnQuery = document.getElementById('btnQuery');
    const btnAll = document.getElementById('btnAll');
    const statsDiv = document.getElementById('stats');
    const tableDiv = document.getElementById('statusTable');

    // ✅ 모달 엘리먼트
    const modalOverlay = document.getElementById('modalOverlay');
    const mNatNo = document.getElementById('mNatNo');
    const mDeadName = document.getElementById('mDeadName');
    const mApplName = document.getElementById('mApplName');
    const mNatDate = document.getElementById('mNatDate');
    const mStatusSelect = document.getElementById('mStatusSelect');

    // ✅ 표시 데이터 캐시(모달에서 사용)
    let currentDisplayData = [];
    let currentSelectedItem = null;

    // ✅ "초기화면 기본값 = 오늘 날짜" (항상 로드 시 오늘로 세팅/표기)
    const today = new Date().toISOString().split('T')[0];
    function setTodayDefault() {
      datePicker.value = today;
      updateDateDisplay(today, true);
    }

    setTodayDefault();

    datePicker.addEventListener('change', () => {
      const value = datePicker.value;
      // 사용자가 날짜를 비우는 경우를 방지하고 싶으면 아래처럼 강제 복구 가능
      // if (!value) { setTodayDefault(); return; }
      updateDateDisplay(value || null, false);
    });

    function updateDateDisplay(dateStr, isInit = false) {
      if (dateStr) {
        dateDisplay.style.background = 'linear-gradient(135deg, rgba(109,94,252,.95), rgba(109,94,252,.65))';
        dateDisplay.querySelector('span').textContent = isInit ? '📅 오늘' : '📅 선택';
        dateDisplaySub.textContent = dateStr;
      } else {
        dateDisplay.style.background = 'linear-gradient(135deg, rgba(34,197,94,1), rgba(16,185,129,.95))';
        dateDisplay.querySelector('span').textContent = '👀 전체 보기';
        dateDisplaySub.textContent = '전체';
      }
    }

    async function loadStatus() {
      const selectedDate = datePicker.value;
      if (!selectedDate) {
        showToast('📅 날짜를 선택해주세요!');
        setTodayDefault();
        return;
      }
      await loadData(selectedDate);
    }

    async function loadAllStatus() {
      // 전체보기는 가능하되, "초기 기본"은 언제나 오늘로 유지됨(페이지 새로고침/진입 시 오늘)
      datePicker.value = '';
      updateDateDisplay(null, false);
      await loadData(null);
    }

    // ✅ 상태 저장/로드 (localStorage) : 자연장번호 단위로 관리 (부부장 2명도 동일 번호 공유)
    function getStatus(natNo) {
      return localStorage.getItem(`status_${natNo}`) || '접수';
    }
    function setStatus(natNo, value) {
      localStorage.setItem(`status_${natNo}`, value);
    }

    // ✅ 부부장(같은 자연장번호 + 같은 신청자) 병합
    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];

      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString();
        const applName = (r.applName ?? '').toString();
        const key = `${natNo}||${applName}`;

        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            applName: r.applName ?? '-',
            deadNames: new Set([(r.deadName ?? '-').toString()]),
            dates: new Set([(r.natDate ?? '-').toString()])
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          cur.deadNames.add((r.deadName ?? '-').toString());
          cur.dates.add((r.natDate ?? '-').toString());
        }
      }

      return order.map(key => {
        const v = map.get(key);
        const deadNameJoined = Array.from(v.deadNames).filter(x => x && x !== '-').join(' / ') || '-';
        const dateJoined = Array.from(v.dates).filter(x => x && x !== '-').join(', ') || '-';
        return {
          natNo: v.natNo,
          deadName: deadNameJoined,
          applName: v.applName,
          natDate: dateJoined
        };
      });
    }

    function setLoading(isLoading){
      btnQuery.disabled = btnAll.disabled = isLoading;
      if (isLoading){
        btnQuery.innerHTML = '<span class="loading"></span> 로드 중...';
        btnAll.textContent = '대기 중...';
      } else {
        btnQuery.innerHTML = '📅 날짜 조회';
        btnAll.textContent = '👀 전체 보기';
      }
    }

    async function loadData(selectedDate = null) {
      setLoading(true);
      try {
        const response = await fetch('./data/nature_data.json');
        if (!response.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
        const data = await response.json();

        let filteredData = data;
        if (selectedDate) filteredData = data.filter(item => item.natDate === selectedDate);

        // ✅ 병합 후 표시데이터
        const displayData = mergeCoupleRows(filteredData);
        currentDisplayData = displayData;

        // 통계
        const totalDisplay = displayData.length;
        const totalRawAll = data.length;

        statsDiv.innerHTML = `
          <div class="stat">
            <div class="num">${totalDisplay.toLocaleString()}</div>
            <div class="label">${selectedDate ? `${selectedDate} 표시건수` : '전체 표시건수'}</div>
          </div>
          <div class="stat">
            <div class="num">${totalRawAll.toLocaleString()}</div>
            <div class="label">총 자연장(원본)</div>
          </div>
        `;

        if (totalDisplay === 0) {
          tableDiv.innerHTML = `<div class="no-data">📭 ${selectedDate ? `${selectedDate}에 ` : ''}안장 기록이 없습니다.</div>`;
          return;
        }

        // ✅ 목록형 렌더링 (안장번호 + 고인명만)
        const limit = 60; // 필요시 조절
        const shown = displayData.slice(0, limit);

        let html = `
          <div class="list">
            <div class="list-head">
              <div class="hint">항목을 눌러 상세 보기</div>
              <div class="badge">표시 ${Math.min(limit, totalDisplay).toLocaleString()} / ${totalDisplay.toLocaleString()}</div>
            </div>
            <ul>
        `;

        shown.forEach((item, idx) => {
          const natNo = item.natNo || '-';
          const deadName = item.deadName || '-';
          html += `
            <li>
              <button class="item-btn" onclick="openModalByIndex(${idx})" aria-label="상세 보기">
                <div class="left">
                  <div class="natno">${escapeHtml(natNo)}</div>
                  <div class="deadname">${escapeHtml(deadName)}</div>
                </div>
                <div class="chev">›</div>
              </button>
            </li>
          `;
        });

        html += `
            </ul>
          </div>
        `;

        tableDiv.innerHTML = html;

        if (displayData.length > limit) {
          tableDiv.insertAdjacentHTML('beforeend',
            `<div class="more-info">📊 총 ${displayData.length.toLocaleString()}건 (상위 ${limit}건 표시)</div>`
          );
        }

      } catch (error) {
        tableDiv.innerHTML = `<div class="no-data">❌ 오류: ${escapeHtml(error.message)}</div>`;
      } finally {
        setLoading(false);
      }
    }

    // ✅ 모달 열기
    function openModalByIndex(index){
      const item = currentDisplayData[index];
      if (!item) return;

      currentSelectedItem = item;

      const natNo = item.natNo || '-';
      const deadName = item.deadName || '-';
      const applName = item.applName || '-';
      const natDate = item.natDate || '-';

      mNatNo.textContent = natNo;
      mDeadName.textContent = deadName;
      mApplName.textContent = applName;
      mNatDate.textContent = natDate;

      // 현황 셀렉트 구성 + 저장값 반영
      const curStatus = getStatus(natNo);
      mStatusSelect.innerHTML = `
        <option value="접수">접수</option>
        <option value="안치대기">안치대기</option>
        <option value="안장완료">안장완료</option>
      `;
      mStatusSelect.value = curStatus;

      mStatusSelect.onchange = (e) => {
        setStatus(natNo, e.target.value);
        showToast(`✅ ${natNo} : ${e.target.value}`);
      };

      modalOverlay.classList.add('show');
      modalOverlay.setAttribute('aria-hidden', 'false');
    }

    function closeModal(){
      modalOverlay.classList.remove('show');
      modalOverlay.setAttribute('aria-hidden', 'true');
      currentSelectedItem = null;
    }

    // 오버레이 클릭 닫기
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // ESC 닫기
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('show')) closeModal();
    });

    function copyNatNo(){
      const natNo = (currentSelectedItem?.natNo ?? '').toString();
      if (!natNo) return;
      navigator.clipboard.writeText(natNo);
      showToast(`📋 ${natNo} 복사됨`);
    }

    function showToast(message){
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    // ✅ 페이지 로드시 "항상 오늘" 기준으로 자동 로드
    window.addEventListener('load', () => {
      setTodayDefault();
      loadData(today);
    });
  </script>
</body>
</html>
