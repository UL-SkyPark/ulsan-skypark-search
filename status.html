<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌸 울산하늘공원 접수 현황</title>

  <style>
    :root{
      --bg-a:#f7f7ff;
      --bg-b:#f2fbf7;
      --bg-c:#fff6fb;

      --card: rgba(255,255,255,0.92);
      --text:#0f172a;
      --muted:#64748b;

      --st-recv-bg: rgba(249,168,212,.22);
      --st-recv-bd: rgba(249,168,212,.38);
      --st-recv-tx: rgba(131,24,67,.85);

      --st-done-bg: rgba(134,239,172,.26);
      --st-done-bd: rgba(134,239,172,.40);
      --st-done-tx: rgba(20,83,45,.86);

      --st-ret-bg: rgba(148,163,184,.18);
      --st-ret-bd: rgba(148,163,184,.28);
      --st-ret-tx: rgba(30,41,59,.78);

      --shadow: 0 14px 40px rgba(15,23,42,0.10);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% 10%, rgba(165,180,252,.55), transparent 55%),
        radial-gradient(900px 520px at 85% 0%, rgba(249,168,212,.45), transparent 55%),
        radial-gradient(1000px 600px at 60% 100%, rgba(134,239,172,.38), transparent 60%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b), var(--bg-c));
      padding: 14px;
    }

    .app{
      max-width: 820px;
      margin: 0 auto;
      border-radius: 24px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .top{
      padding: 16px 16px 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
    }
    .title h1{
      margin:0;
      font-size: 1.22rem;
      letter-spacing: -0.02em;
      font-weight: 950;
    }
    .title .mini{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .bar{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .seg{
      display:flex;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex: 1 1 240px;
      min-width: 240px;
    }
    .seg button{
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 9px 10px;
      font-weight: 950;
      font-size: .95rem;
      cursor:pointer;
      background: transparent;
      color: rgba(15,23,42,0.72);
      transition: background .15s ease;
      min-height: 40px;
    }
    .seg button.active{
      background: linear-gradient(135deg, rgba(165,180,252,.95), rgba(147,197,253,.85));
      color: #0b1020;
      box-shadow: 0 8px 20px rgba(165,180,252,.25);
    }

    /* ✅ 날짜 선택 + 금일건수 : 두 줄 카드 2개 나란히 */
    .date-row{
      display:flex;
      gap: 10px;
      align-items:stretch;
      flex: 1 1 420px;
      min-width: 320px;
    }

    .pill2{
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 18px;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-height: 64px;
      flex: 1 1 200px;
    }
    .pill2 .k{
      color: var(--muted);
      font-size: .88rem;
      font-weight: 950;
      line-height: 1.05;
      white-space: nowrap;
    }
    .pill2 .v{
      font-weight: 950;
      font-size: .98rem;
      letter-spacing: -0.01em;
      line-height: 1.12;
      color: rgba(15,23,42,.86);
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 날짜 인풋을 카드 안에서 자연스럽게 */
    .pill2 input[type="date"]{
      border: 0;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(148,163,184,0.20);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 950;
      color: var(--text);
      outline: none;
      font-size: .95rem;
      -webkit-appearance:none;
      width: 100%;
    }

    @media (max-width: 520px){
      .seg{ min-width: 0; flex: 1 1 100%; }
      .date-row{ flex: 1 1 100%; }
    }

    .content{
      padding: 12px 12px 14px;
      border-top: 1px solid rgba(148,163,184,0.14);
    }

    .list{
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(15,23,42,0.08);
    }

    .list-head{
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .list-head .hint{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
    }
    .list-head .badge{
      font-size: .86rem;
      font-weight: 950;
      background: rgba(249,168,212,.16);
      border: 1px solid rgba(249,168,212,.25);
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
      color: rgba(15,23,42,.72);
    }

    ul{ list-style:none; padding:0; margin:0; }

    .item{
      width:100%;
      border:0;
      background: transparent;
      text-align:left;
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      cursor:pointer;
      position: relative;
    }
    .item::before{
      content:"";
      position:absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }
    .item.recv::before{ background: rgba(249,168,212,.55); }
    .item.done::before{ background: rgba(134,239,172,.65); }
    .item.ret::before{ background: rgba(148,163,184,.55); }

    .item:active{ background: rgba(165,180,252,.08); }

    .main{
      min-width:0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 4px;
      padding-left: 6px;
    }
    .id{
      font-weight: 950;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: #0b1020;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .name{
      font-weight: 850;
      font-size: .95rem;
      color: rgba(15,23,42,0.78);
      word-break: keep-all;
      line-height: 1.25;
    }

    .badge-st{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 950;
      font-size: .82rem;
      border: 1px solid rgba(148,163,184,0.18);
    }
    .badge-recv{
      background: var(--st-recv-bg);
      border-color: var(--st-recv-bd);
      color: var(--st-recv-tx);
    }
    .badge-done{
      background: var(--st-done-bg);
      border-color: var(--st-done-bd);
      color: var(--st-done-tx);
    }
    .badge-ret{
      background: var(--st-ret-bg);
      border-color: var(--st-ret-bd);
      color: var(--st-ret-tx);
    }

    .chev{
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(147,197,253,.18);
      border: 1px solid rgba(147,197,253,.24);
      display:grid;
      place-items:center;
      font-weight: 950;
      color: rgba(15,23,42,.55);
      flex: 0 0 auto;
    }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(15,23,42,0.55);
      font-weight: 900;
    }

    /* 모달 */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.30);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(760px, 100%);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 22px;
      box-shadow: 0 28px 90px rgba(15,23,42,.20);
      overflow:hidden;
      backdrop-filter: blur(14px);
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    .sheet-head{
      padding: 14px 14px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      background: rgba(255,255,255,0.78);
      border-bottom: 1px solid rgba(148,163,184,0.18);
    }
    .sheet-head .t{ min-width:0; }
    .sheet-head .t .line1{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.06rem;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .headRight{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .headRight select{
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.30);
      padding: 9px 10px;
      font-weight: 950;
      background: rgba(255,255,255,0.90);
      outline: none;
      min-height: 42px;
    }

    .sheet-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 10px;
    }

    .kv{
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 10px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .kv .k{
      color: var(--muted);
      font-weight: 950;
      font-size: .88rem;
      flex: 0 0 auto;
      padding-top: 2px;
    }
    .kv .v{
      font-weight: 900;
      color: rgba(15,23,42,0.82);
      font-size: .95rem;
      text-align:right;
      word-break: keep-all;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    .sheet-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
    }
    .btnSmall{
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
    }
    .ok{
      background: linear-gradient(135deg, rgba(134,239,172,.80), rgba(165,180,252,.80));
      border: 1px solid rgba(165,180,252,.22);
      color: rgba(15,23,42,.88);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.80);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="title">
        <h1>🌸 울산하늘공원 접수 현황</h1>
        <div class="mini" id="todayLabel">오늘: -</div>
      </div>

      <div class="bar">
        <div class="seg" role="tablist" aria-label="시설 선택">
          <button id="tabHouse" class="active" onclick="switchSource('house')">추모의집</button>
          <button id="tabNature" onclick="switchSource('nature')">자연장지</button>
        </div>

        <!-- ✅ 날짜선택 / 금일건수 : 두줄 카드 2개 -->
        <div class="date-row">
          <div class="pill2" id="datePill">
            <div class="k">날짜선택</div>
            <div class="v">
              <input type="date" id="datePicker" />
              <span id="datePretty" style="display:none;"></span>
            </div>
          </div>

          <div class="pill2" id="countPill">
            <div class="k" id="countTitle">금일건수</div>
            <div class="v" id="countText">접수0건</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="listArea"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="t">
          <p class="line1" id="mTitle">-</p>
        </div>
        <div class="headRight">
          <select id="mStatus" aria-label="상태 선택">
            <option value="접수">접수</option>
            <option value="안치완료">안치완료</option>
            <option value="반출">반출</option>
          </select>
        </div>
      </div>

      <div class="sheet-body">
        <div id="mFields"></div>
      </div>

      <div class="sheet-actions">
        <button class="btnSmall ok" onclick="closeSheet()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    function getLocalISODate(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const STORAGE_KEYS = { source: "uic_source_selected" };

    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    /* ✅ 요일/표시 문자열: yyyy.mm.dd(ddd) */
    function getKoreanDowChar(isoDate){
      if (!isoDate) return '';
      const [y,m,d] = isoDate.split('-').map(Number);
      if (!y || !m || !d) return '';
      const dt = new Date(y, m-1, d);
      const days = ['일','월','화','수','목','금','토'];
      return days[dt.getDay()];
    }
    function prettyDate(isoDate){
      if (!isoDate) return '-';
      const [y,m,d] = isoDate.split('-');
      const dow = getKoreanDowChar(isoDate);
      return `${y}.${m}.${d}(${dow})`;
    }

    /* ✅ retDate 존재 + 오늘 retDate이면 "금일 반출"로 집계, 리스트도 반출 표시 */
    function pickRetDate(obj){
      return obj?.retDate ?? obj?.retdate ?? obj?.RETDATE ?? obj?.RetDate ?? '';
    }
    function hasAnyRetDate(obj){
      const v = pickRetDate(obj);
      return v != null && String(v).trim() !== '';
    }
    function isRetToday(obj, todayISO){
      const v = String(pickRetDate(obj) ?? '').trim();
      return v === todayISO;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function fetchJson(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    }

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* ✅ ensNO 포맷
       - "1추모의집-62실-개인단-21967" => "62실 21967"
       - 이미 "09실 01886" => "09실 01886"
       - 숫자만이면 "00실 00000" 로 보정
    */
    function formatEnsNo(val){
      if (val == null) return '-';
      const raw = String(val).trim();
      if (!raw) return '-';

      // 케이스: "1추모의집-62실-개인단-21967"
      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        // "62실" 포함 파트 찾기
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));
        if (roomPart && numPart){
          const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
          const numDigits = numPart.replace(/\D/g,'').padStart(5,'0').slice(-5);
          return `${roomDigits}실 ${numDigits}`;
        }
        // roomPart만 있으면 뒤에서 숫자 5자리 찾아보기
        if (roomPart){
          const tailNum = parts.slice().reverse().find(p => p.replace(/\D/g,'').length >= 5);
          if (tailNum){
            const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
            const numDigits = tailNum.replace(/\D/g,'').slice(-5).padStart(5,'0');
            return `${roomDigits}실 ${numDigits}`;
          }
        }
      }

      // 이미 "09실 01886" 형태면 정규화
      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1){
        const room = String(m1[1]).padStart(2,'0');
        const num = String(m1[2]).padStart(5,'0');
        return `${room}실 ${num}`;
      }

      // 숫자만 추출
      let digits = raw.replace(/\D/g,'');
      if (!digits) return raw;

      if (digits.length === 6) digits = digits.padStart(7,'0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7){
        const room = digits.slice(0,2);
        const num = digits.slice(-5);
        return `${room}실 ${num}`;
      }

      return raw;
    }

    /* ✅ 추모의집: 동일 ensNO 묶기 + retDate 대표값 유지(하나라도 있으면 유지) */
    function mergeEnsRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const ens = (r.ensNO ?? r.ensNo ?? r.ensno ?? '').toString().trim();
        const key = ens || '__NO_ENS__';

        if (!map.has(key)){
          map.set(key, {
            ensNO: ens || '-',
            strDate: (r.strDate ?? '-'),
            deadname: (r.deadname ?? r.deadName ?? r.deceasedName ?? '-'),
            applname: (r.applname ?? r.applName ?? '-'),
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);

          const dn = (r.deadname ?? r.deadName ?? r.deceasedName ?? '-').toString();
          const an = (r.applname ?? r.applName ?? '-').toString();

          const curDn = (cur.deadname ?? '-').toString();
          const curAn = (cur.applname ?? '-').toString();

          if (dn && dn !== '-' && !curDn.split(' / ').includes(dn)){
            cur.deadname = (curDn && curDn !== '-') ? `${curDn} / ${dn}` : dn;
          }
          if (an && an !== '-' && !curAn.split(' / ').includes(an)){
            cur.applname = (curAn && curAn !== '-') ? `${curAn} / ${an}` : an;
          }

          // retDate 대표값: 있으면 유지
          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;

          cur._raw.push(r);
        }
      }

      // ✅ 원본 등장 순서 유지 => 먼저 접수된 건 위
      return order.map(key => map.get(key));
    }

    /* ✅ 자연장지: 부부장 병합(원본 순서 유지) */
    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];
      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString();
        const applName = (r.applName ?? '').toString();
        const key = `${natNo}||${applName}`;
        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: (r.deadName ?? r.deadname ?? '-').toString(),
            applName: r.applName ?? '-',
            natDate: (r.natDate ?? '-').toString(),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = (r.deadName ?? r.deadname ?? '-').toString();
          if (dn && dn !== '-' && !cur.deadName.split(' / ').includes(dn)){
            cur.deadName = (cur.deadName && cur.deadName !== '-') ? `${cur.deadName} / ${dn}` : dn;
          }
          const dt = (r.natDate ?? '-').toString();
          if (dt && dt !== '-' && !cur.natDate.split(', ').includes(dt)){
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${dt}` : dt;
          }
          cur._raw.push(r);
        }
      }
      return order.map(key => map.get(key));
    }

    /* 상태 저장 키: 추모의집=ensNO, 자연장지=natNo */
    function itemStatusId(sourceKey, item){
      if (sourceKey === 'house'){
        const ens = (item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-');
        return String(ens ?? '-');
      }
      return String(item?.natNo ?? '-');
    }
    function statusKey(sourceKey, id){ return `status_${sourceKey}_${id}`; }
    function getStatus(sourceKey, id){ return localStorage.getItem(statusKey(sourceKey, id)) || '접수'; }
    function setStatus(sourceKey, id, val){ localStorage.setItem(statusKey(sourceKey, id), val); }

    /* ✅ 리스트 배지/색상: 추모의집은 retDate가 있으면 무조건 반출 표시(요청) */
    function catOfItem(sourceKey, item, savedStatus){
      if (sourceKey === 'house' && hasAnyRetDate(item)) return 'ret';
      const s = (savedStatus ?? '').toString().trim();
      if (s === '반출') return 'ret';
      if (s === '안치완료' || s === '안장완료') return 'done';
      return 'recv';
    }
    function badgeHTML(cat){
      if (cat === 'ret') return `<span class="badge-st badge-ret">반출</span>`;
      if (cat === 'done') return `<span class="badge-st badge-done">안치완료</span>`;
      return `<span class="badge-st badge-recv">접수</span>`;
    }
    function leftCls(cat){
      if (cat === 'ret') return 'ret';
      if (cat === 'done') return 'done';
      return 'recv';
    }

    function kvRow(k, v){
      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    /* ✅ 금일건수: 추모의집은 "접수x건, 반출y건" / 자연장지는 "접수x건" */
    function calcTodayCounts(sourceKey, rawData, todayISO){
      const source = SOURCES[sourceKey];
      const dateKey = source.dateKey;

      const todays = (Array.isArray(rawData) ? rawData : []).filter(x => String(x?.[dateKey] ?? '') === todayISO);

      if (sourceKey === 'house'){
        // 접수: 오늘 strDate 건(묶음 적용 후) 중 "retDate가 오늘이 아닌 것"
        // 반출: retDate가 오늘인 건(묶음 적용 후)
        const merged = mergeEnsRows(todays);

        let recv = 0;
        let ret = 0;
        for (const it of merged){
          if (isRetToday(it, todayISO)) ret++;
          else recv++;
        }
        return { recv, ret };
      }

      // 자연장지: 반출 없음, 그냥 접수 건수(묶음 적용 후)
      const mergedN = mergeCoupleRows(todays);
      return { recv: mergedN.length, ret: 0 };
    }

    // DOM
    const datePicker = document.getElementById('datePicker');
    const todayLabel = document.getElementById('todayLabel');
    const listArea = document.getElementById('listArea');

    const tabHouse = document.getElementById('tabHouse');
    const tabNature = document.getElementById('tabNature');

    const countTitle = document.getElementById('countTitle');
    const countText = document.getElementById('countText');

    const overlay = document.getElementById('overlay');
    const mTitle = document.getElementById('mTitle');
    const mStatus = document.getElementById('mStatus');
    const mFields = document.getElementById('mFields');

    let currentSource = 'house';
    let currentDisplayData = [];

    const TODAY = getLocalISODate(new Date());
    todayLabel.textContent = `오늘: ${TODAY}`;
    datePicker.value = TODAY;

    function syncDateLabel(){
      // ✅ 날짜선택 카드 2줄 요구: "날짜선택" + "yyyy.mm.dd(ddd)"
      // 브라우저 date input 자체는 yyyy-mm-dd로 보이므로, 옆/아래에 표시를 맞추려면 input 아래 텍스트를 붙이면 됨.
      // 요청은 "날짜선택<br>yyyy.mm.dd(ddd)" 2줄 => k / v로 이미 분리되어 있으니 v에 pretty를 같이 표시(텍스트 노출)
      // (여기서는 input만 둬도 되지만, PC에서 yyyy.mm.dd(ddd) 보여달라 하셔서 title에 반영)
      const v = datePicker.value || TODAY;
      datePicker.title = prettyDate(v);
    }

    datePicker.addEventListener('change', () => { syncDateLabel(); load(); });

    function switchSource(sourceKey){
      currentSource = sourceKey;
      localStorage.setItem(STORAGE_KEYS.source, sourceKey);

      tabHouse.classList.toggle('active', sourceKey === 'house');
      tabNature.classList.toggle('active', sourceKey === 'nature');
      load();
    }

    async function load(){
      const source = SOURCES[currentSource];
      const selectedDate = datePicker.value || TODAY;

      try{
        syncDateLabel();

        const raw = await fetchJson(source.url);
        const data = Array.isArray(raw) ? raw : [];

        // ✅ 금일건수 텍스트 적용
        const c = calcTodayCounts(currentSource, data, TODAY);

        if (currentSource === 'house'){
          countTitle.innerHTML = `금일건수`;
          countText.innerHTML = `접수${c.recv}건, 반출${c.ret}건`;
        } else {
          countTitle.innerHTML = `금일건수`;
          countText.innerHTML = `접수${c.recv}건`;
        }

        // ✅ 선택 날짜 필터
        const dateKey = source.dateKey;
        let filtered = data.filter(x => String(x?.[dateKey] ?? '') === selectedDate);

        // ✅ 병합(순서 유지)
        let displayData = filtered;
        if (currentSource === 'house') displayData = mergeEnsRows(filtered);
        if (currentSource === 'nature') displayData = mergeCoupleRows(filtered);

        // ✅ 정렬 요구: "먼저 접수된 건 위 / 나중 접수된 건 아래"
        // -> 병합 함수가 원본 등장 순서(order)대로 반환하므로 추가 정렬 없음
        currentDisplayData = displayData;

        if (displayData.length === 0){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          return;
        }

        const limit = 80;
        const shown = displayData.slice(0, limit);

        let html = `
          <div class="list">
            <div class="list-head">
              <div class="hint">접수현황</div>
              <div class="badge">${Math.min(limit, displayData.length).toLocaleString()} / ${displayData.length.toLocaleString()}</div>
            </div>
            <ul>
        `;

        shown.forEach((item, idx) => {
          let displayId = '-';
          let displayName = '-';
          const sid = itemStatusId(currentSource, item);

          const saved = getStatus(currentSource, sid);
          const cat = catOfItem(currentSource, item, saved);

          if (currentSource === 'house'){
            displayId = formatEnsNo(item.ensNO ?? '-');
            displayName = (item.deadname ?? '-');
          } else {
            displayId = String(item.natNo ?? '-');
            displayName = String(item.deadName ?? '-');
          }

          html += `
            <li>
              <button class="item ${leftCls(cat)}" onclick="openSheet(${idx})">
                <div class="main">
                  <div class="id">
                    ${escapeHtml(displayId)}
                    ${badgeHTML(cat)}
                  </div>
                  <div class="name">${escapeHtml(displayName)}</div>
                </div>
                <div class="chev">›</div>
              </button>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (displayData.length > limit){
          listArea.insertAdjacentHTML('beforeend', `<div class="no-data" style="padding:10px 0 0;">(상위 ${limit}건만 표시 중)</div>`);
        }

      }catch(err){
        listArea.innerHTML = `<div class="no-data">❌ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      const sourceLabel = SOURCES[currentSource].label;
      const sid = itemStatusId(currentSource, item);

      const saved = getStatus(currentSource, sid);
      const cat = catOfItem(currentSource, item, saved);

      const stShow = (cat === 'ret') ? '반출' : (cat === 'done' ? '안치완료' : '접수');

      let headerNo = '-';
      if (currentSource === 'house'){
        headerNo = formatEnsNo(item.ensNO ?? '-');
      } else {
        headerNo = String(item.natNo ?? '-');
      }
      mTitle.innerHTML = `${escapeHtml(sourceLabel)} · ${escapeHtml(headerNo)} ${badgeHTML(cat)}`;

      mStatus.value = stShow;
      mStatus.onchange = (e) => {
        setStatus(currentSource, sid, e.target.value);
        showToast(`✅ ${headerNo} : ${e.target.value}`);
        load();
      };

      let fieldsHTML = '';
      if (currentSource === 'house'){
        fieldsHTML += kvRow('안치일자', item.strDate ?? '-');
        fieldsHTML += kvRow('봉안번호', formatEnsNo(item.ensNO ?? '-'));
        fieldsHTML += kvRow('고인명', item.deadname ?? '-');
        fieldsHTML += kvRow('신청자', item.applname ?? '-');

        const rd = pickRetDate(item);
        if (rd != null && String(rd).trim() !== ''){
          fieldsHTML += kvRow('반출', String(rd));
        }
      } else {
        fieldsHTML += kvRow('안치일자', item.natDate ?? '-');
        fieldsHTML += kvRow('안장번호', item.natNo ?? '-');
        fieldsHTML += kvRow('고인명', item.deadName ?? '-');
        fieldsHTML += kvRow('신청자', item.applName ?? '-');
      }

      mFields.innerHTML = fieldsHTML;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
    }

    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    window.addEventListener('load', () => {
      // ✅ 새로고침 시 선택 유지
      const saved = localStorage.getItem(STORAGE_KEYS.source);
      const initial = (saved === 'nature' || saved === 'house') ? saved : 'house';
      currentSource = initial;

      tabHouse.classList.toggle('active', initial === 'house');
      tabNature.classList.toggle('active', initial === 'nature');

      datePicker.value = getLocalISODate(new Date());
      syncDateLabel();
      load();
    });
  </script>
</body>
</html>
