<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>울산하늘공원 접수 현황</title>

  <link rel="icon" type="image/png" href="./images/symbol.png">
  <link rel="apple-touch-icon" href="./images/symbol.png">

  <style>
    :root{
      --bg:#f4f6f9;
      --panel:#ffffff;
      --line:#d9e0ea;
      --line2:#c9d2df;
      --text:#1f2a37;
      --muted:#6b7280;
      --primary:#1f4e79;
      --shadow: 0 8px 24px rgba(15,23,42,0.08);
      --shadow2: 0 14px 40px rgba(15,23,42,0.10);
      --radius: 14px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    /* ✅ 페이지(바깥) 스크롤 제거 + iOS 100vh 튐 완화 */
    html, body { height:100%; overflow:hidden; }
    body{ height: 100dvh; }

    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
    }

    /* ✅ iOS 구형 fallback(필요시) */
    @supports (-webkit-touch-callout: none){
      body{ height: -webkit-fill-available; }
      .pullable-content{ height: calc(-webkit-fill-available - 24px); }
    }

    /* PTR */
    .pull-to-refresh{
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transform: translateY(-100%);
      transition: transform 0.22s ease;
      z-index: 10001;
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top);
    }
    .pull-to-refresh.visible{ transform: translateY(0); }
    .loader{
      width: 20px; height: 20px;
      border: 2px solid #cbd5e1;
      border-top: 2px solid #0f172a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      opacity: 0;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }

    /* 당김 대상 래퍼 */
    .pullable-content{
      /* ✅ 100vh 대신 100dvh 사용(주소창 변화 대응) */
      height: calc(100dvh - 24px);
      transition: transform 0.22s ease;
      will-change: transform;
    }

    .app{
      max-width: 980px;
      height: 100%;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ✅ (변경 1) 내용이 적어도 카드 높이는 유지(100%), 스크롤만 비활성화 */
    .app.fit{ height: 100%; }
    .app.fit .content{
      overflow: hidden;
      -webkit-overflow-scrolling: auto;
    }

    .top{
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      border-bottom: 1px solid var(--line);
    }

    .header{
      padding: 14px 16px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand h1{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.03em;
      color: #0f172a;
      word-break: keep-all;
      font-size: 1.40rem;
      line-height: 1.15;
    }
    @media (max-width: 560px){
      .brand h1{ font-size: 1.55rem; line-height: 1.18; }
    }

    .rightInfo{
      display:flex;
      align-items:flex-start;
      justify-content:flex-end;
      gap: 10px;
      flex: 0 0 auto;
      margin-left: auto;
    }

    /* 우측상단 새로고침 버튼 (스프링/스핀) */
    .iconBtn{
      width: 42px; height: 42px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(15,23,42,0.08);
      user-select: none;
      -webkit-user-select: none;
      transform: translateZ(0);
      transition: transform 140ms cubic-bezier(.2,.8,.2,1), opacity 140ms ease;
    }
    .iconBtn:active{ transform: scale(0.94); }
    .iconBtn svg{
      width: 22px; height: 22px;
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 50% 50%;
    }
    @keyframes iconSpin{ to{ transform: rotate(360deg); } }
    @keyframes iconSpringPulse{
      0%{ transform: scale(1); }
      35%{ transform: scale(1.08); }
      70%{ transform: scale(0.98); }
      100%{ transform: scale(1); }
    }
    .iconBtn.refreshing{
      cursor: default;
      opacity: .88;
      transform: scale(1.02);
      animation: iconSpringPulse 520ms cubic-bezier(.2, 1.1, .2, 1) infinite;
    }
    .iconBtn.refreshing svg{ animation: iconSpin 0.9s linear infinite; }

    .toolbar{
      padding: 10px 16px 14px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: stretch;
    }

    .seg{
      display:flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      min-width: 260px;
      flex: 0 0 auto;
    }
    .seg button{
      border:0;
      background: transparent;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 950;
      color: rgba(31,42,55,.75);
      cursor: pointer;
      min-height: 44px;
      flex: 1;
      white-space: nowrap;
      font-size: 1.02rem;
    }
    .seg button.active{
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(31,78,121,.25);
    }
    @media (max-width: 560px){
      .seg{ flex: 1 1 100%; min-width: 0; }
      .seg button{ font-size: 1.12rem; padding: 12px 12px; min-height: 48px; }
    }

    .group{
      flex: 1 1 520px;
      min-width: 320px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: stretch;
    }
    @media (max-width: 560px){
      .group{ min-width: 0; grid-template-columns: 1fr 1fr; }
    }

    .field{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      min-height: 64px;
      min-width: 0;
    }
    .field .k{
      color: var(--muted);
      font-weight: 900;
      font-size: .82rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .field .v{
      display:flex;
      align-items:center;
      gap: 8px;
      font-weight: 950;
      color: rgba(31,42,55,.92);
      min-width: 0;
    }
    .field input[type="date"]{
      width: 100%;
      border: 1px solid var(--line2);
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      font-weight: 950;
      outline: none;
      color: var(--text);
      font-size: .95rem;
      -webkit-appearance:none;
      min-height: 40px;
    }

    .countCenter{
      width: 100%;
      text-align: center;
      font-weight: 950;
      color: #0f172a;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      padding: 2px 0;
      font-size: 1.02rem;
    }
    @media (max-width: 560px){
      .countCenter{ font-size: .92rem; }
    }

    /* 내부 스크롤 구조 */
    .content{
      padding: 12px 16px 16px;
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
      flex: 1 1 auto;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
      overscroll-behavior: contain;
    }

    .list{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .list-head{
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      flex-wrap: wrap;
    }
    .list-head .hint{
      font-weight: 950;
      color: #0f172a;
      display:flex;
      align-items:center;
      gap: 10px;
      white-space: nowrap;
    }
    .badge{
      font-size: .86rem;
      font-weight: 950;
      background: #fff;
      border: 1px solid var(--line);
      padding: 7px 10px;
      border-radius: 999px;
      color: rgba(31,42,55,.78);
      white-space: nowrap;
    }

    ul{ list-style:none; padding:0; margin:0; }

    .row{
      display:grid;
      grid-template-columns: 10px 1fr;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      align-items: stretch;
      background: #fff;
    }
    .row:last-child{ border-bottom:0; }

    .barL{
      width: 10px;
      border-radius: 6px;
      background: #e2e8f0;
      height: 100%;
      align-self: stretch;
    }
    .row.recv .barL{ background: rgba(31,78,121,.35); }
    .row.done .barL{ background: rgba(46,125,50,.45); }
    .row.ret .barL{ background: rgba(180,83,9,.40); }
    .row.retDone .barL{ background: rgba(126,34,206,.48); }

    .rowR{
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap: 8px;
    }

    .rowTop{
      display:flex;
      gap: 10px;
      align-items:flex-start;
      justify-content:space-between;
      min-width: 0;
    }

    .mainBtn{
      border:0;
      background: transparent;
      text-align:left;
      padding: 0;
      margin: 0;
      cursor: pointer;
      min-width: 0;
      flex: 1;
    }
    .mainBtn:active{ background: rgba(31,78,121,.06); }

    .main{ display:flex; flex-direction:column; gap: 6px; min-width: 0; }

    .no{ font-weight: 950; color: #0f172a; font-size: 1.02rem; white-space: nowrap; }

    .name{
      font-weight: 950;
      color: rgba(15,23,42,.92);
      font-size: 1.05rem;
      line-height: 1.28;
      word-break: keep-all;
      letter-spacing: -0.01em;
    }
    @media (max-width: 560px){ .name{ font-size: 1.10rem; } }

    .toggle{
      display:flex;
      align-items:center;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
      user-select:none;
      margin-top: 2px;
      flex: 0 0 auto;
    }
    .toggle span{
      font-size: .82rem;
      font-weight: 950;
      color: rgba(31,42,55,.74);
    }
    .sw{
      width: 38px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: #eef2f7;
      position: relative;
      flex: 0 0 auto;
    }
    .sw::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line2);
      transition: left .14s ease;
    }
    .sw.on{
      background: rgba(46,125,50,.14);
      border-color: rgba(46,125,50,.22);
    }
    .sw.on::after{ left: 18px; }

    .cremWrap{ display:flex; flex-direction:column; gap: 4px; }
    .cremLine{
      font-weight: 900;
      font-size: .90rem;
      color: rgba(31,42,55,.72);
      line-height: 1.35;
      word-break: keep-all;
    }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(31,42,55,0.56);
      font-weight: 900;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(560px, 94vw);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 30px 90px rgba(15,23,42,.25);
      overflow:hidden;
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    .sheet-head{
      padding: 12px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      min-height: 58px;
    }
    .sheet-title{
      font-weight: 950;
      color: #0f172a;
      letter-spacing: -0.02em;
      font-size: 1.02rem;
      line-height: 1.2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sheet-body{ padding: 12px 14px 14px; display:grid; gap: 10px; background: #fff; }

    .kv{
      display:flex;
      gap: 12px;
      align-items:flex-start;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .kv .k{
      flex: 0 0 92px;
      color: var(--muted);
      font-weight: 950;
      font-size: .86rem;
      padding-top: 2px;
    }
    .kv .v{
      flex: 1;
      min-width: 0;
      color: rgba(31,42,55,.86);
      font-weight: 900;
      font-size: .94rem;
      line-height: 1.28;
      word-break: keep-all;
    }

    @media (min-width: 720px){
      #mFields{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    }

    .sheet-actions{ padding: 0 14px 14px; display:flex; gap: 10px; background: #fff; }

    .btn{
      flex: 1;
      border: 1px solid var(--line2);
      border-radius: 12px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
      background: #fff;
      color: rgba(31,42,55,.9);
    }
    .btn.primary{
      border-color: rgba(31,78,121,.30);
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: var(--primary);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.92);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: .92rem;
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:left;
      white-space: normal;
      line-height: 1.25;
      word-break: keep-all;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    @media (prefers-reduced-motion: reduce){
      .pull-to-refresh, .pullable-content, .iconBtn{ transition: none !important; }
      .loader, .iconBtn.refreshing, .iconBtn.refreshing svg{ animation: none !important; }
    }
  </style>
</head>

<body>
  <div id="pull-to-refresh" class="pull-to-refresh" aria-hidden="true">
    <div id="ptr-loader" class="loader" aria-hidden="true"></div>
    <div id="ptr-status">당겨서 새로고침</div>
  </div>

  <div id="content" class="pullable-content">
    <div class="app" id="app">
      <div class="top" id="topBar">
        <div class="header">
          <div class="brand">
            <h1>울산하늘공원 접수 현황</h1>
          </div>

          <div class="rightInfo">
            <button id="refreshBtn" class="iconBtn" type="button" aria-label="새로고침">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
                <path d="M20 4v6h-6"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="toolbar">
          <div class="seg" role="tablist" aria-label="시설 선택">
            <button id="tabHouse" class="active" type="button">추모의집</button>
            <button id="tabNature" type="button">자연장지</button>
          </div>

          <div class="group">
            <div class="field" id="datePill">
              <div class="k">날짜 선택</div>
              <div class="v">
                <input type="date" id="datePicker" />
              </div>
            </div>

            <div class="field" id="countPill">
              <div class="k" id="countTitle">현황</div>
              <div class="v" style="width:100%;">
                <div class="countCenter" id="countText">-</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="content" id="scrollArea">
        <div id="listArea"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="sheet-title" id="mTitleLine">-</div>
      </div>
      <div class="sheet-body">
        <div id="mFields"></div>
      </div>
      <div class="sheet-actions">
        <button class="btn primary" type="button" id="sheetOkBtn">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    /* =========
       DOM
       ========= */
    const $ = (s) => document.querySelector(s);

    const datePicker = $('#datePicker');
    const listArea   = $('#listArea');
    const scrollArea = $('#scrollArea');

    const tabHouse   = $('#tabHouse');
    const tabNature  = $('#tabNature');

    const countText  = $('#countText');

    const overlay    = $('#overlay');
    const mTitleLine = $('#mTitleLine');
    const mFields    = $('#mFields');
    const sheetOkBtn = $('#sheetOkBtn');

    const refreshBtn = $('#refreshBtn');

    const ptrEl      = $('#pull-to-refresh');
    const statusEl   = $('#ptr-status');
    const loaderEl   = $('#ptr-loader');
    const contentEl  = $('#content');

    /* =========
       Utils
       ========= */
    const STORAGE_KEYS = { source: "uic_source_selected" };
    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    const TODAY = (() => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    })();

    const esc = (v) => String(v ?? '')
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'","&#039;");

    const normISO = (v) => {
      if (v == null) return '';
      const s = String(v).trim();
      if (!s) return '';
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
      m = s.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
      m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      return '';
    };

    const pickRetDate = (o) => o?.retDate ?? o?.retdate ?? o?.RETDATE ?? o?.RetDate ?? '';

    const toast = (msg, ms=1600) => {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), ms);
    };

    const fetchJson = async (url, bust=false) => {
      const u = bust ? `${url}${url.includes('?')?'&':'?'}_=${Date.now()}` : url;
      const res = await fetch(u, { cache: bust ? 'no-store' : 'default' });
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    };

    const setSpin = (on) => {
      refreshBtn?.classList.toggle('refreshing', !!on);
      if (refreshBtn) refreshBtn.disabled = !!on;
    };

    /* =========
       ✅ (변경 2) 내용이 적을 때: fit(스크롤 잠금)만 하고 카드 높이는 유지
       ========= */
    function adjustFit(){
      requestAnimationFrame(() => {
        const app = $('#app');
        if (!app || !scrollArea) return;

        const needsScroll = scrollArea.scrollHeight > scrollArea.clientHeight + 2;

        // 내용이 적으면 fit(스크롤 잠금), 많으면 normal(스크롤 허용)
        app.classList.toggle('fit', !needsScroll);

        // fit일 때 스크롤 위치도 0으로 고정(미세 스크롤 방지)
        if (!needsScroll) scrollArea.scrollTop = 0;
      });
    }

    /* =========
       Data cache
       ========= */
    const dataCache = { house: null, nature: null };
    let cremMapCache = null;

    const ensureData = async (key, force=false) => {
      if (dataCache[key] && !force) return dataCache[key];
      const raw = await fetchJson(SOURCES[key].url, force);
      dataCache[key] = Array.isArray(raw) ? raw : [];
      return dataCache[key];
    };

    const ensureCrem = async (force=false) => {
      if (cremMapCache && !force) return cremMapCache;
      const raw = await fetchJson("./data/crem.json", force);
      const arr = Array.isArray(raw) ? raw : [];
      const map = new Map();
      for (const r of arr){
        const id = String(r?.deadId ?? '').trim();
        if (id) map.set(id, r);
      }
      cremMapCache = map;
      return map;
    };

    /* =========
       Domain helpers
       ========= */
    function formatEnsNo(val){
      if (val == null) return '-';
      const raw = String(val).trim();
      if (!raw) return '-';

      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart  = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));
        if (roomPart && numPart){
          const room = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
          const num  = numPart.replace(/\D/g,'').padStart(5,'0').slice(-5);
          return `${room}실 ${num}`;
        }
        if (roomPart){
          const tail = parts.slice().reverse().find(p => p.replace(/\D/g,'').length >= 5);
          if (tail){
            const room = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
            const num  = tail.replace(/\D/g,'').slice(-5).padStart(5,'0');
            return `${room}실 ${num}`;
          }
        }
      }

      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1) return `${String(m1[1]).padStart(2,'0')}실 ${String(m1[2]).padStart(5,'0')}`;

      let digits = raw.replace(/\D/g,'');
      if (!digits) return raw;
      if (digits.length === 6) digits = digits.padStart(7,'0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7) return `${digits.slice(0,2)}실 ${digits.slice(-5)}`;
      return raw;
    }

    const safeKey = (v) => String(v ?? '').trim();
    const ensMergeKey = (r) => {
      const ens = safeKey(r.ensNO ?? r.ensNo ?? r.ensno);
      if (ens) return `ENS:${ens}`;
      return `ALT:${safeKey(r.deadId)}|${safeKey(r.strDate)}|${safeKey(r.applname ?? r.applName)}|${safeKey(r.deadname ?? r.deadName ?? r.deceasedName)}`;
    };

    const mergeEnsRows = (rows) => {
      const map = new Map(), order = [];
      for (const r of rows){
        const key = ensMergeKey(r);
        if (!map.has(key)){
          map.set(key, {
            ensNO: safeKey(r.ensNO ?? r.ensNo ?? r.ensno) || '-',
            strDate: r.strDate ?? '-',
            deadname: r.deadname ?? r.deadName ?? r.deceasedName ?? '-',
            applname: r.applname ?? r.applName ?? '-',
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = String(r.deadname ?? r.deadName ?? r.deceasedName ?? '-');
          const an = String(r.applname ?? r.applName ?? '-');
          if (dn && dn !== '-' && !String(cur.deadname).split(' / ').includes(dn))
            cur.deadname = (cur.deadname && cur.deadname !== '-') ? `${cur.deadname} / ${dn}` : dn;
          if (an && an !== '-' && !String(cur.applname).split(' / ').includes(an))
            cur.applname = (cur.applname && cur.applname !== '-') ? `${cur.applname} / ${an}` : an;
          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;
          cur._raw.push(r);
        }
      }
      return order.map(k => map.get(k));
    };

    const mergeCoupleRows = (rows) => {
      const map = new Map(), order = [];
      for (const r of rows){
        const natNo = safeKey(r.natNo);
        const appl  = safeKey(r.applName);
        const key = `${natNo}||${appl}`;
        if (!map.has(key)){
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: String(r.deadName ?? r.deadname ?? '-'),
            applName: r.applName ?? '-',
            natDate: String(r.natDate ?? '-'),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = String(r.deadName ?? r.deadname ?? '-');
          if (dn && dn !== '-' && !cur.deadName.split(' / ').includes(dn))
            cur.deadName = (cur.deadName && cur.deadName !== '-') ? `${cur.deadName} / ${dn}` : dn;
          const dt = String(r.natDate ?? '-');
          if (dt && dt !== '-' && !cur.natDate.split(', ').includes(dt))
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${dt}` : dt;
          cur._raw.push(r);
        }
      }
      return order.map(k => map.get(k));
    };

    const itemId = (src, item) => src === 'house'
      ? String(item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-')
      : String(item?.natNo ?? '-');

    const recvKey = (src, id) => `recv_${src}_${id}`;
    const recvPending = (src) => (src === 'nature') ? '안장대기' : '안치대기';
    const recvDone    = (src) => (src === 'nature') ? '안장완료' : '안치완료';

    const getRecv = (src, id) => {
      const v = localStorage.getItem(recvKey(src, id));
      if (!v) return recvPending(src);
      if (src !== 'nature' && v === '접수') return '안치대기';
      if (src === 'nature' && v === '안치대기') return '안장대기';
      if (src === 'nature' && v === '안치완료') return '안장완료';
      return v;
    };
    const setRecv = (src, id, v) => localStorage.setItem(recvKey(src, id), v);

    const isRetOn = (item, iso) => normISO(pickRetDate(item)) === iso;

    const retKey = (id) => `ret_house_${id}`;
    const getRet = (id) => {
      const v = localStorage.getItem(retKey(id));
      if (!v) return '반출대기';
      if (v === '반출') return '반출대기';
      return v;
    };
    const setRet = (id, v) => localStorage.setItem(retKey(id), v);

    const leftCls = (src, mode, status) => {
      if (mode === 'ret') return (status === '반출완료') ? 'retDone' : 'ret';
      return (status === recvDone(src)) ? 'done' : 'recv';
    };

    const pad2 = (n) => String(n ?? '').trim().padStart(2,'0').slice(-2) || '00';
    const fmtTime = (v) => String(v ?? '').trim();

    const cremObj = (deadId, cremMap) => {
      const did = String(deadId ?? '').trim();
      const rec = did ? cremMap.get(did) : null;
      if (!rec) return { type:'pay', chasu:0, start:'선결제', end:'선결제', text:'선결제' };

      const st = fmtTime(rec?.burnStrTime);
      const en = fmtTime(rec?.burnEndTime);
      if (!st) return { type:'recv', chasu:0, start:'화장접수', end:'화장접수', text:'00회차, 화장접수' };

      const chasu = parseInt(pad2(rec?.burnChasu), 10);
      const safe = isNaN(chasu) ? 0 : chasu;

      if (st && !en) return { type:'info', chasu:safe, start:st, end:'화장중', text:`${pad2(rec?.burnChasu)}회차, 화장시작: ${st}, 화장종료: 화장중` };
      return { type:'info', chasu:safe, start:st, end:en, text:`${pad2(rec?.burnChasu)}회차, 화장시작: ${st}, 화장종료: ${en}` };
    };

    const uniqDeadIds = (item) => {
      const raws = Array.isArray(item?._raw) ? item._raw : [item];
      const seen = new Set(), ids = [];
      for (const r of raws){
        const did = String(r?.deadId ?? '').trim();
        if (!did || seen.has(did)) continue;
        seen.add(did); ids.push(did);
      }
      return ids;
    };

    const chasuKey = (item, cremMap) => {
      const ids = uniqDeadIds(item);
      if (!ids.length) return 0;
      const nums = ids.map(id => cremObj(id, cremMap).chasu).filter(n => Number.isFinite(n));
      const pos = nums.filter(n => n > 0);
      return pos.length ? Math.min(...pos) : 0;
    };

    const cremLinesHTML = (item, cremMap, mode) => {
      if (mode === 'ret' || !cremMap) return '';
      const ids = uniqDeadIds(item);
      if (!ids.length) return `<div class="cremWrap"><div class="cremLine">선결제</div></div>`;
      const objs = ids.map(id => cremObj(id, cremMap));
      const allPay = objs.length && objs.every(o => o.type === 'pay');
      if (allPay) return `<div class="cremWrap"><div class="cremLine">선결제</div></div>`;
      return `<div class="cremWrap">${objs.map(o => `<div class="cremLine">${esc(o.text)}</div>`).join('')}</div>`;
    };

    const cremTimes = (item, cremMap) => {
      if (!cremMap) return null;
      const ids = uniqDeadIds(item);
      if (!ids.length) return { a:'화장시작: 선결제', b:'화장종료: 선결제' };
      const objs = ids.map(id => cremObj(id, cremMap));
      const starts = objs.map(o => o.start || '선결제');
      const ends   = objs.map(o => o.end   || '선결제');
      return { a:`화장시작: ${starts.join(' / ')}`, b:`화장종료: ${ends.join(' / ')}` };
    };

    const kv = (k, v) => `
      <div class="kv">
        <div class="k">${esc(k)}</div>
        <div class="v">${esc(v)}</div>
      </div>
    `;

    const kvLines = (k, lines) => {
      const arr = (Array.isArray(lines) ? lines : []).map(esc).filter(Boolean);
      if (!arr.length) return '';
      return `
        <div class="kv">
          <div class="k">${esc(k)}</div>
          <div class="v">${arr.join('<br>')}</div>
        </div>
      `;
    };

    /* =========
       App state
       ========= */
    let currentSource = 'house';
    let currentSelectedDate = TODAY;
    let currentDisplayData = [];
    let loadToken = 0;
    let isRefreshing = false;

    /* =========
       Rendering
       ========= */
    const renderHead = (shown, total) => `
      <div class="list-head">
        <div class="hint">${esc(SOURCES[currentSource].label)} 접수목록</div>
        <div class="badge">${shown.toLocaleString()} / ${total.toLocaleString()}</div>
      </div>
    `;

    const calcCounts = (src, data, iso) => {
      const dateKey = SOURCES[src].dateKey;
      if (src === 'house'){
        const rows = (Array.isArray(data)?data:[]).filter(x => {
          const s = String(x?.[dateKey] ?? '');
          const r = normISO(pickRetDate(x));
          return (s === iso) || (r === iso);
        });
        const merged = mergeEnsRows(rows);
        let recv = 0, ret = 0;
        for (const it of merged){
          const isR = isRetOn(it, iso);
          const isS = String(it.strDate ?? '') === iso;
          if (isR) ret++;
          else if (isS) recv++;
        }
        return { recv, ret };
      }
      const todays = (Array.isArray(data)?data:[]).filter(x => String(x?.[dateKey] ?? '') === iso);
      return { recv: mergeCoupleRows(todays).length, ret: 0 };
    };

    const sortStable = (arr, iso, cremMap) => {
      const clone = arr.slice();
      clone.forEach((it, i) => { it._pos = (it._pos ?? i); });

      clone.sort((a, b) => {
        const isHouse = (currentSource === 'house');
        const retA = isHouse && isRetOn(a, iso);
        const retB = isHouse && isRetOn(b, iso);

        const aId = itemId(currentSource, a);
        const bId = itemId(currentSource, b);

        const aRetDone = retA ? (getRet(aId) === '반출완료') : false;
        const bRetDone = retB ? (getRet(bId) === '반출완료') : false;

        const grpA = retA ? (aRetDone ? 2 : 0) : 1;
        const grpB = retB ? (bRetDone ? 2 : 0) : 1;
        if (grpA !== grpB) return grpA - grpB;

        if (grpA === 1 && grpB === 1 && cremMap){
          const ca = chasuKey(a, cremMap);
          const cb = chasuKey(b, cremMap);
          if (ca !== cb) return ca - cb;
        }

        return (a._pos ?? 0) - (b._pos ?? 0);
      });

      return clone;
    };

    async function load(force=false){
      const myToken = ++loadToken;

      const selected = datePicker.value || TODAY;
      currentSelectedDate = selected;

      const showCrem = (selected === TODAY);
      let cremMap = null;

      try{
        if (showCrem){
          cremMap = await ensureCrem(force);
          if (myToken !== loadToken) return;
        }

        const data = await ensureData(currentSource, force);
        if (myToken !== loadToken) return;

        const c = calcCounts(currentSource, data, selected);
        countText.textContent = (currentSource === 'house')
          ? `안치 ${c.recv}건 · 반출 ${c.ret}건`
          : `안장 ${c.recv}건`;

        const dateKey = SOURCES[currentSource].dateKey;
        let filtered = [];

        if (currentSource === 'house'){
          filtered = data.filter(x => {
            const s = String(x?.[dateKey] ?? '');
            const r = normISO(pickRetDate(x));
            return (s === selected) || (r === selected);
          });
        } else {
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selected);
        }

        let display = filtered;
        if (currentSource === 'house') display = mergeEnsRows(filtered);
        if (currentSource === 'nature') display = mergeCoupleRows(filtered);

        display.forEach((it, i) => it._pos = i);
        display = sortStable(display, selected, cremMap);
        currentDisplayData = display;

        if (!display.length){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          adjustFit();
          return;
        }

        const limit = 80;
        const shown = display.slice(0, limit);

        let html = `<div class="list">${renderHead(Math.min(limit, display.length), display.length)}<ul>`;

        shown.forEach((item, idx) => {
          const sid = itemId(currentSource, item);
          const mode = (currentSource === 'house' && isRetOn(item, selected)) ? 'ret' : 'recv';

          let status = '';
          let isOn = false;
          let label = '';
          let swCls = 'sw';

          if (mode === 'ret'){
            status = getRet(sid);
            isOn = (status === '반출완료');
            label = isOn ? '반출완료' : '반출대기';
            swCls = isOn ? 'sw on' : 'sw';
          } else {
            status = getRecv(currentSource, sid);
            const done = recvDone(currentSource);
            const pending = recvPending(currentSource);
            isOn = (status === done);
            label = isOn ? done : pending;
            swCls = isOn ? 'sw on' : 'sw';
          }

          const displayId = (currentSource === 'house')
            ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
            : String(item.natNo ?? '-');

          const displayName = (currentSource === 'house')
            ? String(item.deadname ?? item.deadName ?? item.deceasedName ?? '-')
            : String(item.deadName ?? '-');

          html += `
            <li>
              <div class="row ${leftCls(currentSource, mode, status)}">
                <div class="barL"></div>
                <div class="rowR">
                  <div class="rowTop">
                    <button class="mainBtn" type="button" data-open="${idx}" aria-label="상세 보기">
                      <div class="main">
                        <div class="no">${esc(displayId)}</div>
                        <div class="name">${esc(displayName)}</div>
                      </div>
                    </button>
                    <div class="toggle" role="switch" aria-checked="${isOn ? 'true' : 'false'}" data-toggle="${idx}">
                      <div class="${swCls}"></div>
                      <span>${esc(label)}</span>
                    </div>
                  </div>
                  ${cremLinesHTML(item, cremMap, mode)}
                </div>
              </div>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (display.length > limit){
          listArea.insertAdjacentHTML(
            'beforeend',
            `<div class="no-data" style="margin-top:10px; padding:10px 12px;">상위 ${limit}건만 표시 중</div>`
          );
        }

        adjustFit();

      } catch (err){
        listArea.innerHTML = `<div class="no-data">오류: ${esc(err.message)}</div>`;
        adjustFit();
      }
    }

    /* =========
       Modal
       ========= */
    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      const selected = datePicker.value || TODAY;
      const showCrem = (selected === TODAY);
      const cremMap = showCrem ? cremMapCache : null;

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      mTitleLine.textContent = `${SOURCES[currentSource].label} · ${headerNo}`;

      let html = '';
      const isRetModal = (currentSource === 'house' && isRetOn(item, currentSelectedDate));

      if (currentSource === 'house'){
        html += kv('안치일자', item.strDate ?? '-');
        html += kv('고인명', item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
        html += kv('신청자', item.applname ?? item.applName ?? '-');
        const rdISO = normISO(pickRetDate(item));
        const rdRaw = pickRetDate(item);
        if (rdISO) html += kv('반출일자', String(rdRaw ?? rdISO));
      } else {
        html += kv('안치일자', item.natDate ?? '-');
        html += kv('고인명', item.deadName ?? '-');
        html += kv('신청자', item.applName ?? '-');
      }

      if (!isRetModal){
        const t = cremTimes(item, cremMap);
        if (t) html += kvLines('화장시간', [t.a, t.b]);
      }

      mFields.innerHTML = html;

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
    }

    /* =========
       Refresh (button + PTR common)
       ========= */
    async function doRefresh(){
      if (isRefreshing) return;
      isRefreshing = true;
      setSpin(true);

      try{
        dataCache.house = null;
        dataCache.nature = null;
        cremMapCache = null;

        await load(true);
        toast('새로고침 완료', 1400);
      } finally {
        setSpin(false);
        isRefreshing = false;
      }
    }

    /* =========
       PTR (scroll container 기반)
       ========= */
    let startY = 0, pulling = false, pullDist = 0;
    const PTR_MAX = 60, PTR_TH = 60, DAMP = 0.5;

    const canPTR = () => scrollArea && scrollArea.scrollTop === 0 && !isRefreshing;

    const setPullUI = (dist) => {
      const d = Math.max(0, Math.min(dist, PTR_MAX));
      pullDist = d;

      if (d > 0){
        ptrEl.classList.add('visible');
        ptrEl.setAttribute('aria-hidden', 'false');
      }
      contentEl.style.transform = `translateY(${d}px)`;
      if (d >= PTR_TH){
        statusEl.textContent = '놓아서 새로고침';
        loaderEl.style.opacity = '1';
      } else {
        statusEl.textContent = '당겨서 새로고침';
        loaderEl.style.opacity = '0';
      }
    };

    const resetPullUI = () => {
      ptrEl.classList.remove('visible');
      ptrEl.setAttribute('aria-hidden', 'true');
      contentEl.style.transform = '';
      pullDist = 0;
    };

    /* =========
       Events
       ========= */
    function setSource(src){
      currentSource = src;
      localStorage.setItem(STORAGE_KEYS.source, src);
      tabHouse.classList.toggle('active', src === 'house');
      tabNature.classList.toggle('active', src === 'nature');
      load();
    }

    tabHouse.addEventListener('click', () => setSource('house'));
    tabNature.addEventListener('click', () => setSource('nature'));

    datePicker.addEventListener('change', load);

    refreshBtn.addEventListener('click', doRefresh);

    sheetOkBtn.addEventListener('click', closeSheet);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    /* 리스트 이벤트 위임 (길이/성능) */
    listArea.addEventListener('click', (e) => {
      const openBtn = e.target.closest('[data-open]');
      if (openBtn){
        openSheet(parseInt(openBtn.getAttribute('data-open'), 10));
        return;
      }
      const tg = e.target.closest('[data-toggle]');
      if (!tg) return;

      e.preventDefault();
      e.stopPropagation();

      const idx = parseInt(tg.getAttribute('data-toggle'), 10);
      const item = currentDisplayData[idx];
      if (!item) return;

      const sid = itemId(currentSource, item);
      const mode = (currentSource === 'house' && isRetOn(item, currentSelectedDate)) ? 'ret' : 'recv';

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      if (mode === 'ret'){
        const cur = getRet(sid);
        const next = (cur === '반출완료') ? '반출대기' : '반출완료';
        setRet(sid, next);
        toast(`${headerNo} : ${next}`, 2200);
      } else {
        const done = recvDone(currentSource);
        const pending = recvPending(currentSource);
        const cur = getRecv(currentSource, sid);
        const next = (cur === done) ? pending : done;
        setRecv(currentSource, sid, next);
        toast(`${headerNo} : ${next}`, 2200);
      }

      load();
    });

    /* PTR touch */
    scrollArea.addEventListener('touchstart', (e) => {
      if (!canPTR()) return;
      if (e.touches.length !== 1) return;
      startY = e.touches[0].clientY;
      pulling = true;
    }, { passive: true });

    scrollArea.addEventListener('touchmove', (e) => {
      if (!pulling || !canPTR()) return;
      if (e.touches.length !== 1) return;

      const diff = (e.touches[0].clientY - startY) * DAMP;
      if (diff <= 0) return;

      e.preventDefault();
      setPullUI(diff);
    }, { passive: false });

    scrollArea.addEventListener('touchend', async () => {
      if (!pulling) return;
      pulling = false;

      if (pullDist >= PTR_TH){
        statusEl.textContent = '새로고침 중...';
        loaderEl.style.opacity = '1';
        contentEl.style.transform = `translateY(${PTR_MAX}px)`;
        ptrEl.classList.add('visible');
        ptrEl.setAttribute('aria-hidden', 'false');

        try{
          await doRefresh();
        } finally {
          resetPullUI();
          startY = 0;
        }
      } else {
        resetPullUI();
        startY = 0;
      }
    }, { passive: true });

    window.addEventListener('load', () => {
      const saved = localStorage.getItem(STORAGE_KEYS.source);
      setSource((saved === 'nature' || saved === 'house') ? saved : 'house');
      datePicker.value = TODAY;
      load();
    });
  </script>
</body>
</html>
