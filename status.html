<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌸 울산하늘공원 접수 현황</title>

  <style>
    :root{
      --bg-a:#f7f7ff;
      --bg-b:#f2fbf7;
      --bg-c:#fff6fb;

      --card: rgba(255,255,255,0.92);
      --text:#0f172a;
      --muted:#64748b;

      --st-recv-bg: rgba(249,168,212,.22);
      --st-recv-bd: rgba(249,168,212,.38);
      --st-recv-tx: rgba(131,24,67,.85);

      --st-done-bg: rgba(134,239,172,.26);
      --st-done-bd: rgba(134,239,172,.40);
      --st-done-tx: rgba(20,83,45,.86);

      --st-ret-bg: rgba(148,163,184,.18);
      --st-ret-bd: rgba(148,163,184,.28);
      --st-ret-tx: rgba(30,41,59,.78);

      --st-retdone-bg: rgba(165,180,252,.22);
      --st-retdone-bd: rgba(165,180,252,.40);
      --st-retdone-tx: rgba(30,41,59,.86);

      --shadow: 0 14px 40px rgba(15,23,42,0.10);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% 10%, rgba(165,180,252,.55), transparent 55%),
        radial-gradient(900px 520px at 85% 0%, rgba(249,168,212,.45), transparent 55%),
        radial-gradient(1000px 600px at 60% 100%, rgba(134,239,172,.38), transparent 60%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b), var(--bg-c));
      padding: 14px;
    }

    .app{
      max-width: 820px;
      margin: 0 auto;
      border-radius: 24px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .top{
      padding: 16px 16px 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.58);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(148,163,184,0.14);
    }

    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
    }
    .title h1{
      margin:0;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      font-weight: 950;
    }
    .title .mini{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .bar{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .seg{
      display:flex;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex: 1 1 240px;
      min-width: 240px;
    }
    .seg button{
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 9px 10px;
      font-weight: 950;
      font-size: .95rem;
      cursor:pointer;
      background: transparent;
      color: rgba(15,23,42,0.72);
      transition: background .15s ease;
      min-height: 40px;
    }
    .seg button.active{
      background: linear-gradient(135deg, rgba(165,180,252,.95), rgba(147,197,253,.85));
      color: #0b1020;
      box-shadow: 0 8px 20px rgba(165,180,252,.25);
    }

    .date-row{
      display:flex;
      gap: 14px;
      align-items:stretch;
      flex: 1 1 420px;
      min-width: 320px;
    }

    .pill2{
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 18px;
      padding: 12px 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      min-height: 72px;
      flex: 1 1 200px;
    }
    .pill2 .k{
      color: var(--muted);
      font-size: .88rem;
      font-weight: 950;
      line-height: 1.05;
      white-space: nowrap;
    }
    .pill2 .v{
      font-weight: 950;
      font-size: .98rem;
      letter-spacing: -0.01em;
      line-height: 1.12;
      color: rgba(15,23,42,.86);
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill2 input[type="date"]{
      border: 0;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(148,163,184,0.20);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 950;
      color: var(--text);
      outline: none;
      font-size: .95rem;
      -webkit-appearance:none;
      width: 100%;
    }

    @media (max-width: 520px){
      .seg{ min-width: 0; flex: 1 1 100%; }
      .date-row{ flex: 1 1 100%; }
    }

    .content{
      padding: 12px 12px 14px;
    }

    .list{
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(15,23,42,0.08);
    }

    .list-head{
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .list-head .hint{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .list-head .right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 8px;
      margin-left:auto;
      flex-wrap: wrap;
    }
    .list-head .badge{
      font-size: .86rem;
      font-weight: 950;
      background: rgba(249,168,212,.16);
      border: 1px solid rgba(249,168,212,.25);
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
      color: rgba(15,23,42,.72);
    }

    .toggle{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      user-select: none;
      cursor: pointer;
    }
    .toggle span{
      font-size: .86rem;
      font-weight: 950;
      color: rgba(15,23,42,.72);
      white-space: nowrap;
    }
    .switch{
      width: 44px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(148,163,184,0.18);
      position: relative;
      flex: 0 0 auto;
    }
    .switch::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.22);
      transition: left .14s ease;
    }
    .switch.on{
      background: rgba(134,239,172,.28);
      border-color: rgba(134,239,172,.38);
    }
    .switch.on::after{ left: 21px; }

    ul{ list-style:none; padding:0; margin:0; }

    .itemRow{
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      position: relative;
      background: transparent;
    }
    .itemRow::before{
      content:"";
      position:absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }
    .itemRow.recv::before{ background: rgba(249,168,212,.55); }
    .itemRow.done::before{ background: rgba(134,239,172,.65); }
    .itemRow.ret::before{ background: rgba(148,163,184,.55); }
    .itemRow.retDone::before{ background: rgba(165,180,252,.70); }

    .itemMainBtn{
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      text-align:left;
      cursor: pointer;
      padding: 0;
      margin: 0;
    }
    .itemMainBtn:active{ background: rgba(165,180,252,.08); }

    .main{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap: 4px;
      padding-left: 6px;
    }
    .id{
      font-weight: 950;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: #0b1020;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .name{
      font-weight: 850;
      font-size: .95rem;
      color: rgba(15,23,42,0.78);
      word-break: keep-all;
      line-height: 1.25;
    }

    .badge-st{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 950;
      font-size: .82rem;
      border: 1px solid rgba(148,163,184,0.18);
      white-space: nowrap;
    }
    .badge-recv{
      background: var(--st-recv-bg);
      border-color: var(--st-recv-bd);
      color: var(--st-recv-tx);
    }
    .badge-done{
      background: var(--st-done-bg);
      border-color: var(--st-done-bd);
      color: var(--st-done-tx);
    }
    .badge-ret{
      background: var(--st-ret-bg);
      border-color: var(--st-ret-bd);
      color: var(--st-ret-tx);
    }
    .badge-retDone{
      background: var(--st-retdone-bg);
      border-color: var(--st-retdone-bd);
      color: var(--st-retdone-tx);
    }

    .rowToggle{
      flex: 0 0 auto;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .rowToggle span{
      font-size: .86rem;
      font-weight: 950;
      color: rgba(15,23,42,.72);
    }
    .rowSwitch{
      width: 44px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(148,163,184,0.18);
      position: relative;
      flex: 0 0 auto;
    }
    .rowSwitch::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.22);
      transition: left .14s ease;
    }
    .rowSwitch.on{
      background: rgba(134,239,172,.28);
      border-color: rgba(134,239,172,.38);
    }
    .rowSwitch.on::after{ left: 21px; }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(15,23,42,0.55);
      font-weight: 900;
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.30);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 12px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(760px, 100%);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 22px;
      box-shadow: 0 28px 90px rgba(15,23,42,.20);
      overflow:hidden;
      backdrop-filter: blur(14px);
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    .sheet-head{
      padding: 12px 14px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      background: rgba(255,255,255,0.78);
      border-bottom: 1px solid rgba(148,163,184,0.18);
    }

    .headLeft{
      min-width:0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 6px;
    }
    .headLine{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.02rem;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content:flex-start;
    }
    .headMeta{ display:none; }

    .headRight{
      flex: 0 0 auto;
      display:flex;
      flex-direction:column;
      gap: 8px;
      align-items:flex-end;
    }

    .modeToggle{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .modeToggle span{
      font-size: .86rem;
      font-weight: 950;
      color: rgba(15,23,42,.72);
    }
    .modeSwitch{
      width: 44px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(148,163,184,0.18);
      position: relative;
      flex: 0 0 auto;
    }
    .modeSwitch::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.22);
      transition: left .14s ease;
    }
    .modeSwitch.on{
      background: rgba(165,180,252,.28);
      border-color: rgba(165,180,252,.38);
    }
    .modeSwitch.on::after{ left: 21px; }

    .sheet-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 12px;
    }

    .kv{
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 10px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .kv .k{
      color: var(--muted);
      font-weight: 950;
      font-size: .88rem;
      flex: 0 0 auto;
      padding-top: 2px;
    }
    .kv .v{
      font-weight: 900;
      color: rgba(15,23,42,0.82);
      font-size: .95rem;
      text-align:right;
      word-break: keep-all;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    .sheet-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
    }
    .btnSmall{
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
    }
    .ok{
      background: linear-gradient(135deg, rgba(134,239,172,.80), rgba(165,180,252,.80));
      border: 1px solid rgba(165,180,252,.22);
      color: rgba(15,23,42,.88);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.80);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <div class="top" id="topBar">
      <div class="title">
        <h1>🌸 울산하늘공원 접수 현황</h1>
        <div class="mini" id="todayLabel">-</div>
      </div>

      <div class="bar">
        <div class="seg" role="tablist" aria-label="시설 선택">
          <button id="tabHouse" class="active" onclick="switchSource('house')">추모의집</button>
          <button id="tabNature" onclick="switchSource('nature')">자연장지</button>
        </div>

        <div class="date-row">
          <div class="pill2" id="datePill">
            <div class="k">날짜선택</div>
            <div class="v">
              <input type="date" id="datePicker" />
            </div>
          </div>

          <div class="pill2" id="countPill">
            <div class="k" id="countTitle">안치현황</div>
            <div class="v" id="countText">안치0건, 반출0건</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="listArea"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="headLeft">
          <p class="headLine" id="mTitleLine">-</p>
          <div class="headMeta" id="mMetaLine"></div>
        </div>

        <div class="headRight">
          <div class="modeToggle" id="modeToggle" role="switch" aria-checked="false">
            <div class="modeSwitch" id="modeSwitch"></div>
            <span id="modeToggleText">-</span>
          </div>
        </div>
      </div>

      <div class="sheet-body">
        <div id="mFields"></div>
      </div>

      <div class="sheet-actions">
        <button class="btnSmall ok" onclick="closeSheet()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    function getLocalISODate(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const STORAGE_KEYS = {
      source: "uic_source_selected",
      hideDone: "uic_hide_done"
    };

    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    function normalizeToISODate(v){
      if (v == null) return '';
      const s = String(v).trim();
      if (!s) return '';

      const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m1) {
        const y = m1[1];
        const m = String(m1[2]).padStart(2,'0');
        const d = String(m1[3]).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }

      const m2 = s.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
      if (m2) {
        const y = m2[1];
        const m = String(m2[2]).padStart(2,'0');
        const d = String(m2[3]).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }

      const m3 = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m3) return `${m3[1]}-${m3[2]}-${m3[3]}`;

      return '';
    }

    function pickRetDate(obj){
      return obj?.retDate ?? obj?.retdate ?? obj?.RETDATE ?? obj?.RetDate ?? '';
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function fetchJson(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    }

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function formatEnsNo(val){
      if (val == null) return '-';
      const raw = String(val).trim();
      if (!raw) return '-';

      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));
        if (roomPart && numPart){
          const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
          const numDigits = numPart.replace(/\D/g,'').padStart(5,'0').slice(-5);
          return `${roomDigits}실 ${numDigits}`;
        }
        if (roomPart){
          const tailNum = parts.slice().reverse().find(p => p.replace(/\D/g,'').length >= 5);
          if (tailNum){
            const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
            const numDigits = tailNum.replace(/\D/g,'').slice(-5).padStart(5,'0');
            return `${roomDigits}실 ${numDigits}`;
          }
        }
      }

      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1){
        const room = String(m1[1]).padStart(2,'0');
        const num = String(m1[2]).padStart(5,'0');
        return `${room}실 ${num}`;
      }

      let digits = raw.replace(/\D/g,'');
      if (!digits) return raw;

      if (digits.length === 6) digits = digits.padStart(7,'0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7){
        const room = digits.slice(0,2);
        const num = digits.slice(-5);
        return `${room}실 ${num}`;
      }

      return raw;
    }

    function mergeEnsRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const ens2 = (r.ensNO ?? r.ensNo ?? r.ensno ?? '').toString().trim();
        const key = ens2 || '__NO_ENS__';

        if (!map.has(key)){
          map.set(key, {
            ensNO: ens2 || '-',
            strDate: (r.strDate ?? '-'),
            deadname: (r.deadname ?? r.deadName ?? r.deceasedName ?? '-'),
            applname: (r.applname ?? r.applName ?? '-'),
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);

          const dn = (r.deadname ?? r.deadName ?? r.deceasedName ?? '-').toString();
          const an = (r.applname ?? r.applName ?? '-').toString();

          const curDn = (cur.deadname ?? '-').toString();
          const curAn = (cur.applname ?? '-').toString();

          if (dn && dn !== '-' && !curDn.split(' / ').includes(dn)){
            cur.deadname = (curDn && curDn !== '-') ? `${curDn} / ${dn}` : dn;
          }
          if (an && an !== '-' && !curAn.split(' / ').includes(an)){
            cur.applname = (curAn && curAn !== '-') ? `${curAn} / ${an}` : an;
          }

          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;

          cur._raw.push(r);
        }
      }

      return order.map(key => map.get(key));
    }

    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];
      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString();
        const applName = (r.applName ?? '').toString();
        const key = `${natNo}||${applName}`;
        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: (r.deadName ?? r.deadname ?? '-').toString(),
            applName: r.applName ?? '-',
            natDate: (r.natDate ?? '-').toString(),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = (r.deadName ?? r.deadname ?? '-').toString();
          if (dn && dn !== '-' && !cur.deadName.split(' / ').includes(dn)){
            cur.deadName = (cur.deadName && cur.deadName !== '-') ? `${cur.deadName} / ${dn}` : dn;
          }
          const dt = (r.natDate ?? '-').toString();
          if (dt && dt !== '-' && !cur.natDate.split(', ').includes(dt)){
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${dt}` : dt;
          }
          cur._raw.push(r);
        }
      }
      return order.map(key => map.get(key));
    }

    function itemStatusId(sourceKey, item){
      if (sourceKey === 'house'){
        const ens = (item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-');
        return String(ens ?? '-');
      }
      return String(item?.natNo ?? '-');
    }

    function recvKey(sourceKey, id){ return `recv_${sourceKey}_${id}`; }
    function retKey(sourceKey, id){ return `ret_${sourceKey}_${id}`; }

    // ---- 상태 라벨(시설별) ----
    function recvPendingText(sourceKey){ return (sourceKey === 'nature') ? '안장대기' : '안치대기'; }
    function recvDoneText(sourceKey){ return (sourceKey === 'nature') ? '안장완료' : '안치완료'; }
    function recvShortText(sourceKey){ return (sourceKey === 'nature') ? '안장' : '안치'; }

    function isRecvDone(sourceKey, statusText){
      return statusText === recvDoneText(sourceKey);
    }

    function getRecvStatus(sourceKey, id){
      const v = localStorage.getItem(recvKey(sourceKey, id));
      if (!v) return recvPendingText(sourceKey);

      // 과거 값 호환(추모의집)
      if (sourceKey !== 'nature' && v === '접수') return '안치대기';

      // 자연장지 과거 값 호환(혹시 안치대기 저장돼 있던 경우)
      if (sourceKey === 'nature' && v === '안치대기') return '안장대기';
      if (sourceKey === 'nature' && v === '안치완료') return '안장완료';

      return v;
    }
    function setRecvStatus(sourceKey, id, val){
      localStorage.setItem(recvKey(sourceKey, id), val);
    }

    function getRetStatus(sourceKey, id){
      const v = localStorage.getItem(retKey(sourceKey, id));
      if (!v) return '반출대기';
      if (v === '반출') return '반출대기';
      return v;
    }
    function setRetStatus(sourceKey, id, val){
      localStorage.setItem(retKey(sourceKey, id), val);
    }

    function isRetOnDate(item, isoDate){
      return normalizeToISODate(pickRetDate(item)) === isoDate;
    }

    // ---- 배지: 대기는 "반출/안치/안장"만 ----
    function badgeForMode(sourceKey, mode, statusText){
      if (mode === 'ret'){
        return (statusText === '반출완료')
          ? `<span class="badge-st badge-retDone">반출완료</span>`
          : `<span class="badge-st badge-ret">반출</span>`;
      }
      return isRecvDone(sourceKey, statusText)
        ? `<span class="badge-st badge-done">${escapeHtml(recvDoneText(sourceKey))}</span>`
        : `<span class="badge-st badge-recv">${escapeHtml(recvShortText(sourceKey))}</span>`;
    }

    function leftClsForMode(sourceKey, mode, statusText){
      if (mode === 'ret'){
        return (statusText === '반출완료') ? 'retDone' : 'ret';
      }
      return isRecvDone(sourceKey, statusText) ? 'done' : 'recv';
    }

    function kvRow(k, v){
      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    function calcSelectedCounts(sourceKey, rawData, selectedISO){
      const source = SOURCES[sourceKey];
      const dateKey = source.dateKey;

      if (sourceKey === 'house'){
        const rows = (Array.isArray(rawData) ? rawData : []).filter(x => {
          const str = String(x?.[dateKey] ?? '');
          const ret = normalizeToISODate(pickRetDate(x));
          return (str === selectedISO) || (ret === selectedISO);
        });

        const merged = mergeEnsRows(rows);

        let recv = 0;
        let ret = 0;
        for (const it of merged){
          const isRet = isRetOnDate(it, selectedISO);
          const isRecv = String(it.strDate ?? '') === selectedISO;
          if (isRet) ret++;
          else if (isRecv) recv++;
        }
        return { recv, ret };
      }

      const todays = (Array.isArray(rawData) ? rawData : []).filter(x => String(x?.[dateKey] ?? '') === selectedISO);
      const mergedN = mergeCoupleRows(todays);
      return { recv: mergedN.length, ret: 0 };
    }

    function isOnlyUndoneOn(){
      return localStorage.getItem(STORAGE_KEYS.hideDone) === '1';
    }
    function setOnlyUndone(on){
      localStorage.setItem(STORAGE_KEYS.hideDone, on ? '1' : '0');
    }
    function toggleOnlyUndone(){
      setOnlyUndone(!isOnlyUndoneOn());
      load();
    }

    const datePicker = document.getElementById('datePicker');
    const todayLabel = document.getElementById('todayLabel');
    const listArea = document.getElementById('listArea');

    const tabHouse = document.getElementById('tabHouse');
    const tabNature = document.getElementById('tabNature');

    const countTitle = document.getElementById('countTitle');
    const countText = document.getElementById('countText');

    const overlay = document.getElementById('overlay');

    const mTitleLine = document.getElementById('mTitleLine');
    const mMetaLine = document.getElementById('mMetaLine');
    const modeToggle = document.getElementById('modeToggle');
    const modeSwitch = document.getElementById('modeSwitch');
    const modeToggleText = document.getElementById('modeToggleText');
    const mFields = document.getElementById('mFields');

    let currentSource = 'house';
    let currentDisplayData = [];
    let currentModalItem = null;
    let currentModalMode = 'recv';
    let currentSelectedDate = '';

    const TODAY = getLocalISODate(new Date());
    datePicker.value = TODAY;
    todayLabel.textContent = `${TODAY}`;

    datePicker.addEventListener('change', () => {
      todayLabel.textContent = `${datePicker.value || TODAY}`;
      load();
    });

    function switchSource(sourceKey){
      currentSource = sourceKey;
      localStorage.setItem(STORAGE_KEYS.source, sourceKey);

      tabHouse.classList.toggle('active', sourceKey === 'house');
      tabNature.classList.toggle('active', sourceKey === 'nature');
      load();
    }

    function renderListHead(shownCount, totalCount){
      const on = isOnlyUndoneOn();
      const switchCls = on ? 'switch on' : 'switch';
      const txt = on ? '미완료' : '전체';

      return `
        <div class="list-head">
          <div class="hint">접수현황</div>
          <div class="right">
            <div class="toggle" onclick="toggleOnlyUndone()">
              <div class="${switchCls}" role="switch" aria-checked="${on ? 'true' : 'false'}"></div>
              <span>${escapeHtml(txt)}</span>
            </div>
            <div class="badge">${shownCount.toLocaleString()} / ${totalCount.toLocaleString()}</div>
          </div>
        </div>
      `;
    }

    function setModeToggleUI(sourceKey, mode, on){
      modeSwitch.classList.toggle('on', !!on);
      modeToggle.setAttribute('aria-checked', on ? 'true' : 'false');

      if (mode === 'ret'){
        modeToggleText.textContent = on ? '반출완료' : '반출';
        return;
      }
      // 자연장지: 안장 / 안장완료, 추모의집: 안치 / 안치완료
      modeToggleText.textContent = on ? recvDoneText(sourceKey) : recvShortText(sourceKey);
    }

    function refreshModal(){
      const item = currentModalItem;
      if (!item) return;

      const sourceLabel = SOURCES[currentSource].label;
      const sid = itemStatusId(currentSource, item);

      const recv = getRecvStatus(currentSource, sid);
      const ret  = getRetStatus(currentSource, sid);

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      const statusText = (currentModalMode === 'ret') ? ret : recv;
      const badge = badgeForMode(currentSource, currentModalMode, statusText);

      mTitleLine.innerHTML = `${escapeHtml(sourceLabel)} · ${escapeHtml(headerNo)} ${badge}`;
      mMetaLine.innerHTML = '';

      if (currentModalMode === 'ret'){
        setModeToggleUI(currentSource, 'ret', ret === '반출완료');
      } else {
        setModeToggleUI(currentSource, 'recv', isRecvDone(currentSource, recv));
      }
    }

    function applyModeToggle(){
      const item = currentModalItem;
      if (!item) return;

      const sid = itemStatusId(currentSource, item);

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      if (currentModalMode === 'ret'){
        const cur = getRetStatus(currentSource, sid);
        const next = (cur === '반출완료') ? '반출대기' : '반출완료';
        setRetStatus(currentSource, sid, next);
        showToast(`✅ ${headerNo} : ${next}`);
      } else {
        const cur = getRecvStatus(currentSource, sid);
        const done = recvDoneText(currentSource);
        const pending = recvPendingText(currentSource);
        const next = (cur === done) ? pending : done;
        setRecvStatus(currentSource, sid, next);
        showToast(`✅ ${headerNo} : ${next}`);
      }

      refreshModal();
      load();
    }

    function applyRowToggle(index, e){
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const item = currentDisplayData[index];
      if (!item) return;

      const sid = itemStatusId(currentSource, item);
      const mode = (currentSource === 'house' && isRetOnDate(item, currentSelectedDate)) ? 'ret' : 'recv';

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      if (mode === 'ret'){
        const cur = getRetStatus(currentSource, sid);
        const next = (cur === '반출완료') ? '반출대기' : '반출완료';
        setRetStatus(currentSource, sid, next);
        showToast(`✅ ${headerNo} : ${next}`);
      } else {
        const cur = getRecvStatus(currentSource, sid);
        const done = recvDoneText(currentSource);
        const pending = recvPendingText(currentSource);
        const next = (cur === done) ? pending : done;
        setRecvStatus(currentSource, sid, next);
        showToast(`✅ ${headerNo} : ${next}`);
      }

      load();
    }

    function buildFields(item){
      let fieldsHTML = '';
      if (currentSource === 'house'){
        fieldsHTML += kvRow('안치일자', item.strDate ?? '-');
        fieldsHTML += kvRow('봉안번호', formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-'));
        fieldsHTML += kvRow('고인명', item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
        fieldsHTML += kvRow('신청자', item.applname ?? item.applName ?? '-');

        const rdISO = normalizeToISODate(pickRetDate(item));
        const rdRaw = pickRetDate(item);
        if (rdISO){
          fieldsHTML += kvRow('반출일자', String(rdRaw ?? rdISO));
        }
      } else {
        fieldsHTML += kvRow('안치일자', item.natDate ?? '-');
        fieldsHTML += kvRow('안장번호', item.natNo ?? '-');
        fieldsHTML += kvRow('고인명', item.deadName ?? '-');
        fieldsHTML += kvRow('신청자', item.applName ?? '-');
      }
      return fieldsHTML;
    }

    // ✅ 완료/미완료 토글해도 순서가 바뀌지 않도록: "완료 여부"를 정렬에 반영하지 않음
    function sortByWorkPriorityStable(arr, selectedISO){
      const clone = arr.slice();

      function displayIdOf(item){
        if (currentSource === 'house'){
          return formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-');
        }
        return String(item.natNo ?? '-');
      }

      clone.sort((a, b) => {
        const modeA = (currentSource === 'house' && isRetOnDate(a, selectedISO)) ? 'ret' : 'recv';
        const modeB = (currentSource === 'house' && isRetOnDate(b, selectedISO)) ? 'ret' : 'recv';

        // 그룹: 0=반출(상단) -> 1=안치/안장
        const grpA = (modeA === 'ret') ? 0 : 1;
        const grpB = (modeB === 'ret') ? 0 : 1;
        if (grpA !== grpB) return grpA - grpB;

        // 완료여부는 무시(순서 고정), 표시번호 기준 정렬만 유지
        const da = displayIdOf(a);
        const db = displayIdOf(b);
        return da.localeCompare(db, 'ko');
      });

      return clone;
    }

    async function load(){
      const source = SOURCES[currentSource];
      const selectedDate = datePicker.value || TODAY;
      currentSelectedDate = selectedDate;

      try{
        const raw = await fetchJson(source.url);
        const data = Array.isArray(raw) ? raw : [];

        const c = calcSelectedCounts(currentSource, data, selectedDate);
        countTitle.textContent = `안치현황`;

        // ✅ 안치현황 상자: "안치대기/반출대기" -> "안치/반출"
        if (currentSource === 'house'){
          countText.innerHTML = `안치${c.recv}건, 반출${c.ret}건`;
        } else {
          // 자연장지: 표시 문구는 동일 포맷(반출은 0)
          countText.innerHTML = `${recvShortText(currentSource)}${c.recv}건, 반출0건`;
        }

        const dateKey = source.dateKey;
        let filtered = [];

        if (currentSource === 'house'){
          filtered = data.filter(x => {
            const str = String(x?.[dateKey] ?? '');
            const ret = normalizeToISODate(pickRetDate(x));
            return (str === selectedDate) || (ret === selectedDate);
          });
        } else {
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selectedDate);
        }

        let displayData = filtered;
        if (currentSource === 'house') displayData = mergeEnsRows(filtered);
        if (currentSource === 'nature') displayData = mergeCoupleRows(filtered);

        const onlyUndone = isOnlyUndoneOn();
        if (onlyUndone){
          displayData = displayData.filter(item => {
            const sid = itemStatusId(currentSource, item);
            const mode = (currentSource === 'house' && isRetOnDate(item, selectedDate)) ? 'ret' : 'recv';
            if (mode === 'ret'){
              return getRetStatus(currentSource, sid) !== '반출완료';
            }
            const r = getRecvStatus(currentSource, sid);
            return !isRecvDone(currentSource, r);
          });
        }

        // ✅ 정렬(완료여부 무시) 적용
        displayData = sortByWorkPriorityStable(displayData, selectedDate);
        currentDisplayData = displayData;

        if (displayData.length === 0){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          return;
        }

        const limit = 80;
        const shown = displayData.slice(0, limit);

        let html = `<div class="list">`;
        html += renderListHead(Math.min(limit, displayData.length), displayData.length);
        html += `<ul>`;

        shown.forEach((item, idx) => {
          let displayId = '-';
          let displayName = '-';
          const sid = itemStatusId(currentSource, item);

          const mode = (currentSource === 'house' && isRetOnDate(item, selectedDate)) ? 'ret' : 'recv';
          const recv = getRecvStatus(currentSource, sid);
          const ret  = getRetStatus(currentSource, sid);
          const statusText = (mode === 'ret') ? ret : recv;

          const isOn = (mode === 'ret')
            ? (statusText === '반출완료')
            : isRecvDone(currentSource, statusText);

          // ✅ 우측 토글 라벨도 "대기" 제거(배지와 동일 기준)
          const rowLabel = (mode === 'ret')
            ? (isOn ? '반출완료' : '반출')
            : (isOn ? recvDoneText(currentSource) : recvShortText(currentSource));

          const rowSwitchCls = isOn ? 'rowSwitch on' : 'rowSwitch';

          if (currentSource === 'house'){
            displayId = formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-');
            displayName = (item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
          } else {
            displayId = String(item.natNo ?? '-');
            displayName = String(item.deadName ?? '-');
          }

          html += `
            <li>
              <div class="itemRow ${leftClsForMode(currentSource, mode, statusText)}">
                <button class="itemMainBtn" onclick="openSheet(${idx})" aria-label="상세 보기">
                  <div class="main">
                    <div class="id">
                      ${escapeHtml(displayId)}
                      ${badgeForMode(currentSource, mode, statusText)}
                    </div>
                    <div class="name">${escapeHtml(displayName)}</div>
                  </div>
                </button>

                <div class="rowToggle" role="switch" aria-checked="${isOn ? 'true' : 'false'}" onclick="applyRowToggle(${idx}, event)">
                  <div class="${rowSwitchCls}"></div>
                  <span>${escapeHtml(rowLabel)}</span>
                </div>
              </div>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (displayData.length > limit){
          listArea.insertAdjacentHTML('beforeend', `<div class="no-data" style="padding:10px 0 0;">(상위 ${limit}건만 표시 중)</div>`);
        }

      }catch(err){
        listArea.innerHTML = `<div class="no-data">❌ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      currentModalItem = item;

      if (currentSource === 'house' && isRetOnDate(item, currentSelectedDate)){
        currentModalMode = 'ret';
      } else {
        currentModalMode = 'recv';
      }

      mFields.innerHTML = buildFields(item);
      refreshModal();

      modeToggle.onclick = applyModeToggle;

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
      currentModalItem = null;
    }

    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    window.addEventListener('load', () => {
      const saved = localStorage.getItem(STORAGE_KEYS.source);
      const initial = (saved === 'nature' || saved === 'house') ? saved : 'house';
      currentSource = initial;

      tabHouse.classList.toggle('active', initial === 'house');
      tabNature.classList.toggle('active', initial === 'nature');

      if (localStorage.getItem(STORAGE_KEYS.hideDone) == null){
        setOnlyUndone(false);
      }

      datePicker.value = getLocalISODate(new Date());
      todayLabel.textContent = `${datePicker.value}`;
      load();
    });

    window.switchSource = switchSource;
    window.toggleOnlyUndone = toggleOnlyUndone;
    window.openSheet = openSheet;
    window.closeSheet = closeSheet;
    window.applyRowToggle = applyRowToggle;
  </script>
</body>
</html>
