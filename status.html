<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>울산하늘공원 접수 현황</title>

  <link rel="icon" type="image/png" href="./images/symbol.png">
  <link rel="apple-touch-icon" href="./images/symbol.png">

  <style>
    :root{
      --bg:#f4f6f9;
      --panel:#ffffff;
      --line:#d9e0ea;
      --line2:#c9d2df;
      --text:#1f2a37;
      --muted:#6b7280;
      --primary:#1f4e79;
      --shadow: 0 8px 24px rgba(15,23,42,0.08);
      --shadow2: 0 14px 40px rgba(15,23,42,0.10);
      --radius: 14px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }

    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
    }

    /* ✅ PTR */
    .pull-to-refresh{
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transform: translateY(-100%);
      transition: transform 0.22s ease;
      z-index: 10001;
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top);
    }
    .pull-to-refresh.visible{ transform: translateY(0); }

    .loader{
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-top: 2px solid #0f172a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      opacity: 0;
    }
    @keyframes spin{
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ✅ 스크롤/당김 대상 래퍼 */
    .pullable-content{
      height: calc(100vh - 24px);
      transition: transform 0.22s ease;
      will-change: transform;
    }

    .app{
      max-width: 980px;
      height: 100%;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top{
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      border-bottom: 1px solid var(--line);
    }

    .header{
      padding: 14px 16px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand h1{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.03em;
      color: #0f172a;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: keep-all;
      font-size: 1.40rem;
      line-height: 1.15;
    }

    @media (max-width: 560px){
      .brand h1{
        font-size: 1.55rem;
        line-height: 1.18;
      }
    }

    .rightInfo{
      display:flex;
      align-items:flex-start;
      justify-content:flex-end;
      gap: 10px;
      flex: 0 0 auto;
      margin-left: auto;
    }

    /* ✅ 우측상단 새로고침 아이콘 버튼 */
    .iconBtn{
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(15,23,42,0.08);
      user-select: none;
    }
    .iconBtn:active{ transform: translateY(1px); }
    .iconBtn svg{
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toolbar{
      padding: 10px 16px 14px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: stretch;
    }

    .seg{
      display:flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      min-width: 260px;
      flex: 0 0 auto;
    }
    .seg button{
      border:0;
      background: transparent;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 950;
      color: rgba(31,42,55,.75);
      cursor: pointer;
      min-height: 44px;
      flex: 1;
      white-space: nowrap;
      font-size: 1.02rem;
    }
    .seg button.active{
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(31,78,121,.25);
    }

    @media (max-width: 560px){
      .seg button{
        font-size: 1.12rem;
        padding: 12px 12px;
        min-height: 48px;
      }
    }

    .group{
      flex: 1 1 520px;
      min-width: 320px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: stretch;
    }

    .field{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      min-height: 64px;
      min-width: 0;
    }
    .field .k{
      color: var(--muted);
      font-weight: 900;
      font-size: .82rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .field .v{
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: nowrap;
      font-weight: 950;
      color: rgba(31,42,55,.92);
      min-width: 0;
    }
    .field input[type="date"]{
      width: 100%;
      border: 1px solid var(--line2);
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      font-weight: 950;
      outline: none;
      color: var(--text);
      font-size: .95rem;
      -webkit-appearance:none;
      min-height: 40px;
    }

    .countCenter{
      width: 100%;
      text-align: center;
      font-weight: 950;
      color: #0f172a;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      padding: 2px 0;
      font-size: 1.02rem;
    }
    @media (max-width: 560px){
      .countCenter{ font-size: .92rem; }
    }

    @media (max-width: 560px){
      .seg{ flex: 1 1 100%; min-width: 0; }
      .group{ min-width: 0; grid-template-columns: 1fr 1fr; }
    }

    /* ✅ .content 내부 스크롤(overflow) */
    .content{
      padding: 12px 16px 16px;
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
      flex: 1 1 auto;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
    }

    .list{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .list-head{
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      flex-wrap: wrap;
    }
    .list-head .hint{
      font-weight: 950;
      color: #0f172a;
      display:flex;
      align-items:center;
      gap: 10px;
      white-space: nowrap;
    }
    .badge{
      font-size: .86rem;
      font-weight: 950;
      background: #fff;
      border: 1px solid var(--line);
      padding: 7px 10px;
      border-radius: 999px;
      color: rgba(31,42,55,.78);
      white-space: nowrap;
    }

    ul{ list-style:none; padding:0; margin:0; }

    .row{
      display:grid;
      grid-template-columns: 10px 1fr;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      align-items: stretch;
      background: #fff;
    }
    .row:last-child{ border-bottom:0; }

    .barL{
      width: 10px;
      border-radius: 6px;
      background: #e2e8f0;
      height: 100%;
      align-self: stretch;
    }
    .row.recv .barL{ background: rgba(31,78,121,.35); }
    .row.done .barL{ background: rgba(46,125,50,.45); }
    .row.ret .barL{ background: rgba(180,83,9,.40); }
    .row.retDone .barL{ background: rgba(126,34,206,.48); }

    .rowR{
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap: 8px;
    }

    .rowTop{
      display:flex;
      gap: 10px;
      align-items:flex-start;
      justify-content:space-between;
      min-width: 0;
    }

    .mainBtn{
      border:0;
      background: transparent;
      text-align:left;
      padding: 0;
      margin: 0;
      cursor: pointer;
      min-width: 0;
      flex: 1;
    }
    .mainBtn:active{ background: rgba(31,78,121,.06); }

    .main{
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-width: 0;
    }

    .no{
      font-weight: 950;
      color: #0f172a;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .name{
      font-weight: 950;
      color: rgba(15,23,42,.92);
      font-size: 1.05rem;
      line-height: 1.28;
      word-break: keep-all;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      letter-spacing: -0.01em;
    }
    @media (max-width: 560px){
      .name{ font-size: 1.10rem; }
    }

    .toggle{
      display:flex;
      align-items:center;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
      user-select:none;
      margin-top: 2px;
      flex: 0 0 auto;
    }
    .toggle span{
      font-size: .82rem;
      font-weight: 950;
      color: rgba(31,42,55,.74);
    }
    .sw{
      width: 38px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: #eef2f7;
      position: relative;
      flex: 0 0 auto;
    }
    .sw::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line2);
      transition: left .14s ease;
    }
    .sw.on{
      background: rgba(46,125,50,.14);
      border-color: rgba(46,125,50,.22);
    }
    .sw.on::after{ left: 18px; }

    .cremWrap{
      display:flex;
      flex-direction:column;
      gap: 4px;
    }
    .cremLine{
      font-weight: 900;
      font-size: .90rem;
      color: rgba(31,42,55,.72);
      line-height: 1.35;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: keep-all;
    }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(31,42,55,0.56);
      font-weight: 900;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 14px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(560px, 94vw);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 30px 90px rgba(15,23,42,.25);
      overflow:hidden;
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    .sheet-head{
      padding: 12px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      min-height: 58px;
    }

    .sheet-title{
      font-weight: 950;
      color: #0f172a;
      letter-spacing: -0.02em;
      font-size: 1.02rem;
      line-height: 1.2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sheet-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 10px;
      background: #fff;
    }

    .kv{
      display:flex;
      gap: 12px;
      align-items:flex-start;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .kv .k{
      flex: 0 0 92px;
      color: var(--muted);
      font-weight: 950;
      font-size: .86rem;
      padding-top: 2px;
    }
    .kv .v{
      flex: 1;
      min-width: 0;
      color: rgba(31,42,55,.86);
      font-weight: 900;
      font-size: .94rem;
      line-height: 1.28;
      word-break: keep-all;
    }

    @media (min-width: 720px){
      #mFields{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    }

    .sheet-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
      background: #fff;
    }

    .btn{
      flex: 1;
      border: 1px solid var(--line2);
      border-radius: 12px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
      background: #fff;
      color: rgba(31,42,55,.9);
    }
    .btn.primary{
      border-color: rgba(31,78,121,.30);
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: var(--primary);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.92);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: .92rem;
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:left;
      white-space: normal;
      line-height: 1.25;
      word-break: keep-all;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>
  <!-- ✅ Pull to Refresh 영역 -->
  <div id="pull-to-refresh" class="pull-to-refresh" aria-hidden="true">
    <div id="ptr-loader" class="loader" aria-hidden="true"></div>
    <div id="ptr-status">당겨서 새로고침</div>
  </div>

  <!-- ✅ PTR 당김 대상(콘텐츠 래퍼) -->
  <div id="content" class="pullable-content">
    <div class="app" id="app">
      <div class="top" id="topBar">
        <div class="header">
          <div class="brand">
            <h1>울산하늘공원 접수 현황</h1>
          </div>

          <!-- ✅ 우측상단 날짜 대신 새로고침 아이콘 -->
          <div class="rightInfo">
            <button class="iconBtn" type="button" aria-label="새로고침" onclick="manualRefresh()">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
                <path d="M20 4v6h-6"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="toolbar">
          <div class="seg" role="tablist" aria-label="시설 선택">
            <button id="tabHouse" class="active" onclick="switchSource('house')">추모의집</button>
            <button id="tabNature" onclick="switchSource('nature')">자연장지</button>
          </div>

          <div class="group">
            <div class="field" id="datePill">
              <div class="k">날짜 선택</div>
              <div class="v">
                <input type="date" id="datePicker" />
              </div>
            </div>

            <div class="field" id="countPill">
              <div class="k" id="countTitle">현황</div>
              <div class="v" style="width:100%;">
                <div class="countCenter" id="countText">-</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ✅ 내부 스크롤 영역(.content overflow) -->
      <div class="content" id="scrollArea">
        <div id="listArea"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="sheet-title" id="mTitleLine">-</div>
      </div>
      <div class="sheet-body">
        <div id="mFields"></div>
      </div>
      <div class="sheet-actions">
        <button class="btn primary" onclick="closeSheet()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    function getLocalISODate(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const STORAGE_KEYS = { source: "uic_source_selected" };
    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    function normalizeToISODate(v){
      if (v == null) return '';
      const s = String(v).trim();
      if (!s) return '';

      const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m1) return `${m1[1]}-${String(m1[2]).padStart(2,'0')}-${String(m1[3]).padStart(2,'0')}`;

      const m2 = s.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
      if (m2) return `${m2[1]}-${String(m2[2]).padStart(2,'0')}-${String(m2[3]).padStart(2,'0')}`;

      const m3 = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m3) return `${m3[1]}-${m3[2]}-${m3[3]}`;

      return '';
    }

    function pickRetDate(obj){
      return obj?.retDate ?? obj?.retdate ?? obj?.RETDATE ?? obj?.RetDate ?? '';
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    /* ✅ 캐시 무효화 옵션(bust) 추가 */
    async function fetchJson(url, bust = false){
      const u = bust ? `${url}${url.includes('?') ? '&' : '?'}_=${Date.now()}` : url;
      const res = await fetch(u, { cache: bust ? 'no-store' : 'default' });
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    }

    function showToast(msg, ms = 2000){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove('show'), ms);
    }

    function formatEnsNo(val){
      if (val == null) return '-';
      const raw = String(val).trim();
      if (!raw) return '-';

      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));
        if (roomPart && numPart){
          const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
          const numDigits = numPart.replace(/\D/g,'').padStart(5,'0').slice(-5);
          return `${roomDigits}실 ${numDigits}`;
        }
        if (roomPart){
          const tailNum = parts.slice().reverse().find(p => p.replace(/\D/g,'').length >= 5);
          if (tailNum){
            const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
            const numDigits = tailNum.replace(/\D/g,'').slice(-5).padStart(5,'0');
            return `${roomDigits}실 ${numDigits}`;
          }
        }
      }

      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1){
        const room = String(m1[1]).padStart(2,'0');
        const num = String(m1[2]).padStart(5,'0');
        return `${room}실 ${num}`;
      }

      let digits = raw.replace(/\D/g,'');
      if (!digits) return raw;

      if (digits.length === 6) digits = digits.padStart(7,'0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7){
        const room = digits.slice(0,2);
        const num = digits.slice(-5);
        return `${room}실 ${num}`;
      }
      return raw;
    }

    function safeKeyPart(v){ return (v == null) ? '' : String(v).trim(); }

    function ensMergeKey(r){
      const ens = safeKeyPart(r.ensNO ?? r.ensNo ?? r.ensno);
      if (ens) return `ENS:${ens}`;

      const deadId = safeKeyPart(r.deadId);
      const strDate = safeKeyPart(r.strDate);
      const appl = safeKeyPart(r.applname ?? r.applName);
      const dead = safeKeyPart(r.deadname ?? r.deadName ?? r.deceasedName);
      return `ALT:${deadId}|${strDate}|${appl}|${dead}`;
    }

    function mergeEnsRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const key = ensMergeKey(r);

        if (!map.has(key)){
          map.set(key, {
            ensNO: safeKeyPart(r.ensNO ?? r.ensNo ?? r.ensno) || '-',
            strDate: (r.strDate ?? '-'),
            deadname: (r.deadname ?? r.deadName ?? r.deceasedName ?? '-'),
            applname: (r.applname ?? r.applName ?? '-'),
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);

          const dn = (r.deadname ?? r.deadName ?? r.deceasedName ?? '-').toString();
          const an = (r.applname ?? r.applName ?? '-').toString();

          const curDn = (cur.deadname ?? '-').toString();
          const curAn = (cur.applname ?? '-').toString();

          if (dn && dn !== '-' && !curDn.split(' / ').includes(dn)){
            cur.deadname = (curDn && curDn !== '-') ? `${curDn} / ${dn}` : dn;
          }
          if (an && an !== '-' && !curAn.split(' / ').includes(an)){
            cur.applname = (curAn && curAn !== '-') ? `${curAn} / ${an}` : an;
          }

          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;

          cur._raw.push(r);
        }
      }

      return order.map(key => map.get(key));
    }

    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];
      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString().trim();
        const applName = (r.applName ?? '').toString().trim();
        const key = `${natNo}||${applName}`;

        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: (r.deadName ?? r.deadname ?? '-').toString(),
            applName: r.applName ?? '-',
            natDate: (r.natDate ?? '-').toString(),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = (r.deadName ?? r.deadname ?? '-').toString();
          if (dn && dn !== '-' && !cur.deadName.split(' / ').includes(dn)){
            cur.deadName = (cur.deadName && cur.deadName !== '-') ? `${cur.deadName} / ${dn}` : dn;
          }
          const dt = (r.natDate ?? '-').toString();
          if (dt && dt !== '-' && !cur.natDate.split(', ').includes(dt)){
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${dt}` : dt;
          }
          cur._raw.push(r);
        }
      }
      return order.map(key => map.get(key));
    }

    function itemStatusId(sourceKey, item){
      if (sourceKey === 'house'){
        const ens = (item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-');
        return String(ens ?? '-');
      }
      return String(item?.natNo ?? '-');
    }

    function recvKey(sourceKey, id){ return `recv_${sourceKey}_${id}`; }
    function recvPendingText(sourceKey){ return (sourceKey === 'nature') ? '안장대기' : '안치대기'; }
    function recvDoneText(sourceKey){ return (sourceKey === 'nature') ? '안장완료' : '안치완료'; }
    function isRecvDone(sourceKey, statusText){ return statusText === recvDoneText(sourceKey); }

    function getRecvStatus(sourceKey, id){
      const v = localStorage.getItem(recvKey(sourceKey, id));
      if (!v) return recvPendingText(sourceKey);

      if (sourceKey !== 'nature' && v === '접수') return '안치대기';
      if (sourceKey === 'nature' && v === '안치대기') return '안장대기';
      if (sourceKey === 'nature' && v === '안치완료') return '안장완료';

      return v;
    }
    function setRecvStatus(sourceKey, id, val){ localStorage.setItem(recvKey(sourceKey, id), val); }

    function isRetOnDate(item, isoDate){
      return normalizeToISODate(pickRetDate(item)) === isoDate;
    }

    function leftClsForMode(sourceKey, mode, statusText){
      if (mode === 'ret'){
        return (statusText === '반출완료') ? 'retDone' : 'ret';
      }
      return isRecvDone(sourceKey, statusText) ? 'done' : 'recv';
    }

    function kvRow(k, v){
      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    function kvRowLines(k, lines){
      const safeLines = (Array.isArray(lines) ? lines : [])
        .map(x => escapeHtml(x))
        .filter(Boolean);

      if (safeLines.length === 0) return '';

      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${safeLines.join('<br>')}</div>
        </div>
      `;
    }

    function calcSelectedCounts(sourceKey, rawData, selectedISO){
      const source = SOURCES[sourceKey];
      const dateKey = source.dateKey;

      if (sourceKey === 'house'){
        const rows = (Array.isArray(rawData) ? rawData : []).filter(x => {
          const str = String(x?.[dateKey] ?? '');
          const ret = normalizeToISODate(pickRetDate(x));
          return (str === selectedISO) || (ret === selectedISO);
        });

        const merged = mergeEnsRows(rows);

        let recv = 0;
        let ret = 0;
        for (const it of merged){
          const isRet = isRetOnDate(it, selectedISO);
          const isRecv = String(it.strDate ?? '') === selectedISO;
          if (isRet) ret++;
          else if (isRecv) recv++;
        }
        return { recv, ret };
      }

      const todays = (Array.isArray(rawData) ? rawData : []).filter(x => String(x?.[dateKey] ?? '') === selectedISO);
      const mergedN = mergeCoupleRows(todays);
      return { recv: mergedN.length, ret: 0 };
    }

    function pad2(n){
      const s = (n == null) ? "" : String(n).trim();
      if (!s) return "00";
      return s.padStart(2, "0").slice(-2);
    }
    function fmtTime(v){ return (v == null) ? "" : String(v).trim(); }

    function cremLineObjByDeadId(deadId, cremMap){
      const did = (deadId ?? "").toString().trim();
      const rec = did ? cremMap.get(did) : null;

      if (!rec){
        return { type:'pay', chasu:0, start:'선결제', end:'선결제', text:'선결제' };
      }

      const st = fmtTime(rec?.burnStrTime);
      const en = fmtTime(rec?.burnEndTime);

      if (!st){
        return { type:'recv', chasu:0, start:'화장접수', end:'화장접수', text:'00회차, 화장접수' };
      }

      const chasu = parseInt(pad2(rec?.burnChasu), 10);
      const safeChasu = isNaN(chasu) ? 0 : chasu;

      if (st && !en){
        return { type:'info', chasu:safeChasu, start:st, end:'화장중', text:`${pad2(rec?.burnChasu)}회차, 화장시작: ${st}, 화장종료: 화장중` };
      }

      return { type:'info', chasu:safeChasu, start:st, end:en, text:`${pad2(rec?.burnChasu)}회차, 화장시작: ${st}, 화장종료: ${en}` };
    }

    function getUniqueDeadIds(item){
      const raws = Array.isArray(item?._raw) ? item._raw : [item];
      const seen = new Set();
      const ids = [];
      for (const r of raws){
        const did = (r?.deadId ?? "").toString().trim();
        if (!did || seen.has(did)) continue;
        seen.add(did);
        ids.push(did);
      }
      return ids;
    }

    function itemChasuKeyForSort(item, cremMap){
      const ids = getUniqueDeadIds(item);
      if (ids.length === 0) return 0;

      const chasus = ids
        .map(id => cremLineObjByDeadId(id, cremMap).chasu)
        .filter(n => typeof n === 'number' && isFinite(n));

      if (chasus.length === 0) return 0;

      const positives = chasus.filter(n => n > 0);
      if (positives.length > 0) return Math.min(...positives);

      return 0;
    }

    function buildCremLinesHTML(item, cremMap, mode){
      if (mode === 'ret') return '';
      if (!cremMap) return '';

      const ids = getUniqueDeadIds(item);

      if (ids.length === 0){
        return `<div class="cremWrap"><div class="cremLine">선결제</div></div>`;
      }

      const lineObjs = ids.map(did => cremLineObjByDeadId(did, cremMap));

      const allPay = lineObjs.length > 0 && lineObjs.every(o => o && o.type === 'pay');
      if (allPay){
        return `<div class="cremWrap"><div class="cremLine">선결제</div></div>`;
      }

      const htmlLines = lineObjs.map(o => `<div class="cremLine">${escapeHtml(o.text)}</div>`).join("");
      return `<div class="cremWrap">${htmlLines}</div>`;
    }

    function buildCremTimesForModal(item, cremMap){
      if (!cremMap) return null;

      const ids = getUniqueDeadIds(item);
      if (ids.length === 0) {
        return { startLine: '화장시작: 선결제', endLine: '화장종료: 선결제' };
      }

      const objs = ids.map(id => cremLineObjByDeadId(id, cremMap));
      const starts = objs.map(o => o.start || '선결제');
      const ends = objs.map(o => o.end || '선결제');

      return {
        startLine: `화장시작: ${starts.join(' / ')}`,
        endLine: `화장종료: ${ends.join(' / ')}`
      };
    }

    function retKeyHouse(id){ return `ret_house_${id}`; }
    function getRetStatusHouse(id){
      const v = localStorage.getItem(retKeyHouse(id));
      if (!v) return '반출대기';
      if (v === '반출') return '반출대기';
      return v;
    }
    function setRetStatusHouse(id, val){ localStorage.setItem(retKeyHouse(id), val); }

    function sortByWorkPriorityStable(arr, selectedISO, cremMap){
      const clone = arr.slice();
      clone.forEach((it, i) => { it._pos = (it._pos ?? i); });

      clone.sort((a, b) => {
        const isHouse = (currentSource === 'house');
        const isRetA = isHouse && isRetOnDate(a, selectedISO);
        const isRetB = isHouse && isRetOnDate(b, selectedISO);

        const aId = itemStatusId(currentSource, a);
        const bId = itemStatusId(currentSource, b);

        const aRetDone = isRetA ? (getRetStatusHouse(aId) === '반출완료') : false;
        const bRetDone = isRetB ? (getRetStatusHouse(bId) === '반출완료') : false;

        const grpA = isRetA ? (aRetDone ? 2 : 0) : 1;
        const grpB = isRetB ? (bRetDone ? 2 : 0) : 1;
        if (grpA !== grpB) return grpA - grpB;

        if (grpA === 1 && grpB === 1 && cremMap){
          const ca = itemChasuKeyForSort(a, cremMap);
          const cb = itemChasuKeyForSort(b, cremMap);
          if (ca !== cb) return ca - cb;
        }

        return (a._pos ?? 0) - (b._pos ?? 0);
      });

      return clone;
    }

    const datePicker = document.getElementById('datePicker');
    const listArea = document.getElementById('listArea');

    const tabHouse = document.getElementById('tabHouse');
    const tabNature = document.getElementById('tabNature');

    const countTitle = document.getElementById('countTitle');
    const countText = document.getElementById('countText');

    const overlay = document.getElementById('overlay');
    const mTitleLine = document.getElementById('mTitleLine');
    const mFields = document.getElementById('mFields');

    /* ✅ 내부 스크롤 컨테이너(overflow) */
    const scrollArea = document.getElementById('scrollArea');

    const TODAY = getLocalISODate(new Date());

    let currentSource = 'house';
    let currentDisplayData = [];
    let currentSelectedDate = TODAY;

    let cremMapCache = null;
    const dataCache = { house: null, nature: null };
    let loadToken = 0;

    function renderListHead(shownCount, totalCount){
      const sLabel = SOURCES[currentSource].label;
      return `
        <div class="list-head">
          <div class="hint">${escapeHtml(sLabel)} 접수목록</div>
          <div class="badge">${shownCount.toLocaleString()} / ${totalCount.toLocaleString()}</div>
        </div>
      `;
    }

    async function ensureCremMap(force = false){
      if (cremMapCache && !force) return cremMapCache;
      const raw = await fetchJson("./data/crem.json", force);
      const arr = Array.isArray(raw) ? raw : [];
      const map = new Map();
      for (const r of arr){
        const id = (r?.deadId ?? "").toString().trim();
        if (!id) continue;
        map.set(id, r);
      }
      cremMapCache = map;
      return cremMapCache;
    }

    async function ensureData(sourceKey, force = false){
      if (dataCache[sourceKey] && !force) return dataCache[sourceKey];
      const raw = await fetchJson(SOURCES[sourceKey].url, force);
      dataCache[sourceKey] = Array.isArray(raw) ? raw : [];
      return dataCache[sourceKey];
    }

    function buildFields(item, cremMap){
      let fieldsHTML = '';
      const isRetModal = (currentSource === 'house' && isRetOnDate(item, currentSelectedDate));

      if (currentSource === 'house'){
        fieldsHTML += kvRow('안치일자', item.strDate ?? '-');
        fieldsHTML += kvRow('고인명', item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
        fieldsHTML += kvRow('신청자', item.applname ?? item.applName ?? '-');

        const rdISO = normalizeToISODate(pickRetDate(item));
        const rdRaw = pickRetDate(item);
        if (rdISO) fieldsHTML += kvRow('반출일자', String(rdRaw ?? rdISO));
      } else {
        fieldsHTML += kvRow('안치일자', item.natDate ?? '-');
        fieldsHTML += kvRow('고인명', item.deadName ?? '-');
        fieldsHTML += kvRow('신청자', item.applName ?? '-');
      }

      if (!isRetModal){
        const t = buildCremTimesForModal(item, cremMap);
        if (t) fieldsHTML += kvRowLines('화장시간', [t.startLine, t.endLine]);
      }

      return fieldsHTML;
    }

    /* ✅ force=true면 캐시 무효화 + 데이터 강제 갱신 */
    async function load(force = false){
      const myToken = ++loadToken;

      const source = SOURCES[currentSource];
      const selectedDate = datePicker.value || TODAY;
      currentSelectedDate = selectedDate;

      const showCrem = (selectedDate === TODAY);

      try{
        let cremMap = null;
        if (showCrem){
          cremMap = await ensureCremMap(force);
          if (myToken !== loadToken) return;
        }

        const data = await ensureData(currentSource, force);
        if (myToken !== loadToken) return;

        const c = calcSelectedCounts(currentSource, data, selectedDate);

        countTitle.textContent = '현황';
        if (currentSource === 'house'){
          countText.textContent = `안치 ${c.recv}건 · 반출 ${c.ret}건`;
        } else {
          countText.textContent = `안장 ${c.recv}건`;
        }

        const dateKey = source.dateKey;
        let filtered = [];

        if (currentSource === 'house'){
          filtered = data.filter(x => {
            const str = String(x?.[dateKey] ?? '');
            const ret = normalizeToISODate(pickRetDate(x));
            return (str === selectedDate) || (ret === selectedDate);
          });
        } else {
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selectedDate);
        }

        let displayData = filtered;
        if (currentSource === 'house') displayData = mergeEnsRows(filtered);
        if (currentSource === 'nature') displayData = mergeCoupleRows(filtered);

        displayData.forEach((it, i) => { it._pos = i; });
        displayData = sortByWorkPriorityStable(displayData, selectedDate, cremMap);
        currentDisplayData = displayData;

        if (displayData.length === 0){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          return;
        }

        const limit = 80;
        const shown = displayData.slice(0, limit);

        let html = `<div class="list">`;
        html += renderListHead(Math.min(limit, displayData.length), displayData.length);
        html += `<ul>`;

        shown.forEach((item, idx) => {
          const sid = itemStatusId(currentSource, item);
          const mode = (currentSource === 'house' && isRetOnDate(item, selectedDate)) ? 'ret' : 'recv';

          let statusText = '';
          let isOn = false;
          let rowLabel = '';
          let swCls = 'sw';

          if (mode === 'ret'){
            statusText = getRetStatusHouse(sid);
            isOn = (statusText === '반출완료');
            rowLabel = isOn ? '반출완료' : '반출대기';
            swCls = isOn ? 'sw on' : 'sw';
          } else {
            statusText = getRecvStatus(currentSource, sid);
            isOn = isRecvDone(currentSource, statusText);
            rowLabel = isOn ? recvDoneText(currentSource) : recvPendingText(currentSource);
            swCls = isOn ? 'sw on' : 'sw';
          }

          let displayId = '-';
          let displayName = '-';

          if (currentSource === 'house'){
            displayId = formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-');
            displayName = (item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
          } else {
            displayId = String(item.natNo ?? '-');
            displayName = String(item.deadName ?? '-');
          }

          const leftCls = leftClsForMode(currentSource, mode, statusText);
          const cremHTML = buildCremLinesHTML(item, cremMap, mode);

          html += `
            <li>
              <div class="row ${leftCls}">
                <div class="barL"></div>
                <div class="rowR">
                  <div class="rowTop">
                    <button class="mainBtn" onclick="openSheet(${idx})" aria-label="상세 보기">
                      <div class="main">
                        <div class="no">${escapeHtml(displayId)}</div>
                        <div class="name">${escapeHtml(displayName)}</div>
                      </div>
                    </button>
                    <div class="toggle" role="switch" aria-checked="${isOn ? 'true' : 'false'}" onclick="applyRowToggle(${idx}, event)">
                      <div class="${swCls}"></div>
                      <span>${escapeHtml(rowLabel)}</span>
                    </div>
                  </div>
                  ${cremHTML}
                </div>
              </div>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (displayData.length > limit){
          listArea.insertAdjacentHTML(
            'beforeend',
            `<div class="no-data" style="margin-top:10px; padding:10px 12px;">상위 ${limit}건만 표시 중</div>`
          );
        }

      }catch(err){
        listArea.innerHTML = `<div class="no-data">오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    function switchSource(sourceKey){
      currentSource = sourceKey;
      localStorage.setItem(STORAGE_KEYS.source, sourceKey);
      tabHouse.classList.toggle('active', sourceKey === 'house');
      tabNature.classList.toggle('active', sourceKey === 'nature');
      load();
    }

    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      const selectedDate = datePicker.value || TODAY;
      const showCrem = (selectedDate === TODAY);
      const cremMap = showCrem ? cremMapCache : null;

      const sourceLabelText = SOURCES[currentSource].label;
      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      mTitleLine.textContent = `${sourceLabelText} · ${headerNo}`;
      mFields.innerHTML = buildFields(item, cremMap);

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
    }

    function applyRowToggle(index, e){
      if (e) { e.preventDefault(); e.stopPropagation(); }

      const item = currentDisplayData[index];
      if (!item) return;

      const sid = itemStatusId(currentSource, item);
      const mode = (currentSource === 'house' && isRetOnDate(item, currentSelectedDate)) ? 'ret' : 'recv';

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      if (mode === 'ret'){
        const cur = getRetStatusHouse(sid);
        const next = (cur === '반출완료') ? '반출대기' : '반출완료';
        setRetStatusHouse(sid, next);
        showToast(`${headerNo} : ${next}`, 2200);
      } else {
        const cur = getRecvStatus(currentSource, sid);
        const done = recvDoneText(currentSource);
        const pending = recvPendingText(currentSource);
        const next = (cur === done) ? pending : done;
        setRecvStatus(currentSource, sid, next);
        showToast(`${headerNo} : ${next}`, 2200);
      }

      load();
    }

    datePicker.addEventListener('change', () => {
      load();
    });

    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    window.switchSource = switchSource;
    window.openSheet = openSheet;
    window.closeSheet = closeSheet;
    window.applyRowToggle = applyRowToggle;

    /* =========================
       ✅ 새로고침(아이콘/PTR 공용)
       ========================= */
    async function doRefresh(){
      dataCache.house = null;
      dataCache.nature = null;
      cremMapCache = null;

      await load(true);
      showToast('새로고침 완료', 1400);
    }
    window.manualRefresh = () => { doRefresh(); };

    /* =========================
       ✅ PTR (내부 스크롤: .content overflow)
       - window.scrollY 대신 scrollArea.scrollTop 사용
       ========================= */
    const ptrEl = document.getElementById('pull-to-refresh');
    const statusEl = document.getElementById('ptr-status');
    const loaderEl = document.getElementById('ptr-loader');
    const contentEl = document.getElementById('content');

    let startY = 0;
    let pulling = false;
    let isRefreshing = false;
    let pullDist = 0;

    const PTR_MAX = 60;
    const PTR_THRESHOLD = 60;
    const DAMPING = 0.5;

    function canStartPTR(){
      // ✅ 내부 스크롤이 최상단일 때만
      return scrollArea && scrollArea.scrollTop === 0;
    }

    function setPullUI(dist){
      const d = Math.max(0, Math.min(dist, PTR_MAX));
      pullDist = d;

      if (d > 0){
        ptrEl.classList.add('visible');
        ptrEl.setAttribute('aria-hidden', 'false');
      }

      contentEl.style.transform = `translateY(${d}px)`;

      if (d >= PTR_THRESHOLD){
        statusEl.textContent = '놓아서 새로고침';
        loaderEl.style.opacity = '1';
      } else {
        statusEl.textContent = '당겨서 새로고침';
        loaderEl.style.opacity = '0';
      }
    }

    function resetPullUI(){
      ptrEl.classList.remove('visible');
      ptrEl.setAttribute('aria-hidden', 'true');
      contentEl.style.transform = '';
      pullDist = 0;
    }

    // iOS PWA에서 overscroll bounce 방지 + 부드러운 PTR
    // ✅ touch는 scrollArea(.content)에 걸어야 내부 스크롤 기반으로 제스처가 정확합니다.
    scrollArea.addEventListener('touchstart', (e) => {
      if (isRefreshing) return;
      if (e.touches.length !== 1) return;

      if (canStartPTR()){
        startY = e.touches[0].clientY;
        pulling = true;
      } else {
        startY = 0;
        pulling = false;
      }
    }, { passive: true });

    scrollArea.addEventListener('touchmove', (e) => {
      if (!pulling || isRefreshing) return;
      if (e.touches.length !== 1) return;
      if (!canStartPTR()) return;

      const currentY = e.touches[0].clientY;
      const diff = (currentY - startY) * DAMPING;

      if (diff <= 0) return;

      // ✅ 내부 스크롤이 최상단에서 아래로 당길 때만 기본 스크롤을 막고 PTR 제스처로 처리
      e.preventDefault();
      setPullUI(diff);
    }, { passive: false });

    scrollArea.addEventListener('touchend', async () => {
      if (!pulling) return;
      pulling = false;

      if (isRefreshing) return;

      if (pullDist >= PTR_THRESHOLD){
        isRefreshing = true;
        statusEl.textContent = '새로고침 중...';
        loaderEl.style.opacity = '1';

        contentEl.style.transform = `translateY(${PTR_MAX}px)`;
        ptrEl.classList.add('visible');
        ptrEl.setAttribute('aria-hidden', 'false');

        try{
          await doRefresh();
        } finally {
          resetPullUI();
          isRefreshing = false;
          startY = 0;
        }
      } else {
        resetPullUI();
        startY = 0;
      }
    }, { passive: true });

    window.addEventListener('load', () => {
      const saved = localStorage.getItem(STORAGE_KEYS.source);
      const initial = (saved === 'nature' || saved === 'house') ? saved : 'house';
      currentSource = initial;

      tabHouse.classList.toggle('active', initial === 'house');
      tabNature.classList.toggle('active', initial === 'nature');

      datePicker.value = getLocalISODate(new Date());
      load();
    });
  </script>
</body>
</html>
