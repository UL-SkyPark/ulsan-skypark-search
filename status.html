<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌿 현황 조회</title>

  <style>
    :root{
      /* 은은한 파스텔 톤 */
      --bg-a:#f7f7ff;
      --bg-b:#f2fbf7;
      --bg-c:#fff6fb;

      --card: rgba(255,255,255,0.92);
      --card2: rgba(255,255,255,0.80);
      --line: rgba(148,163,184,0.35);

      --text:#0f172a;
      --muted:#64748b;

      --p1:#a5b4fc; /* indigo pastel */
      --p2:#f9a8d4; /* pink pastel */
      --p3:#86efac; /* green pastel */
      --p4:#93c5fd; /* sky pastel */

      --shadow: 0 14px 40px rgba(15,23,42,0.10);
      --radius: 18px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% 10%, rgba(165,180,252,.55), transparent 55%),
        radial-gradient(900px 520px at 85% 0%, rgba(249,168,212,.45), transparent 55%),
        radial-gradient(1000px 600px at 60% 100%, rgba(134,239,172,.38), transparent 60%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b), var(--bg-c));
      padding: 14px;
    }

    .app{
      max-width: 820px;
      margin: 0 auto;
      border-radius: 24px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    /* 상단 */
    .top{
      padding: 16px 16px 12px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
    }

    .title h1{
      margin:0;
      font-size: 1.22rem;
      letter-spacing: -0.02em;
      font-weight: 900;
    }
    .title .mini{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 세그먼트 + 날짜 */
    .bar{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .seg{
      display:flex;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex: 1 1 240px;
      min-width: 240px;
    }
    .seg button{
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 9px 10px;
      font-weight: 900;
      font-size: .95rem;
      cursor:pointer;
      background: transparent;
      color: rgba(15,23,42,0.72);
      transition: background .15s ease;
      min-height: 40px;
    }
    .seg button.active{
      background: linear-gradient(135deg, rgba(165,180,252,.95), rgba(147,197,253,.85));
      color: #0b1020;
      box-shadow: 0 8px 20px rgba(165,180,252,.25);
    }

    .date-wrap{
      display:flex;
      align-items:center;
      gap: 8px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 999px;
      padding: 6px 10px;
      flex: 0 1 auto;
    }
    .date-wrap .label{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 800;
      padding-left: 6px;
      white-space: nowrap;
    }
    .date-wrap input[type="date"]{
      border: 0;
      background: transparent;
      padding: 6px 6px;
      font-weight: 900;
      color: var(--text);
      outline: none;
      font-size: .95rem;
      min-width: 150px;
      -webkit-appearance:none;
    }

    /* 작고 단순한 토글 */
    .tiny-actions{
      display:flex;
      align-items:center;
      gap: 10px;
      margin-top: 2px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 999px;
      padding: 8px 10px;
      user-select:none;
      font-size: .9rem;
      font-weight: 850;
      color: rgba(15,23,42,0.78);
    }
    .chip input{ width: 16px; height: 16px; }

    /* 통계 - 간단 */
    .stats{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stat{
      flex: 1 1 160px;
      background: rgba(255,255,255,0.70);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 16px;
      padding: 10px 12px;
    }
    .stat .num{
      font-weight: 950;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .stat .txt{
      color: var(--muted);
      font-weight: 800;
      font-size: .88rem;
      margin-top: 2px;
    }

    /* 리스트 */
    .content{
      padding: 12px 12px 14px;
      border-top: 1px solid rgba(148,163,184,0.18);
    }

    .list{
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.20);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(15,23,42,0.08);
    }

    .list-head{
      position: sticky;
      top: 0;
      z-index: 3;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.22);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .list-head .hint{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 800;
    }
    .list-head .badge{
      font-size: .86rem;
      font-weight: 950;
      background: rgba(249,168,212,.20);
      border: 1px solid rgba(249,168,212,.30);
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    ul{ list-style:none; padding:0; margin:0; }
    .item{
      width:100%;
      border:0;
      background: transparent;
      text-align:left;
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(148,163,184,0.22);
      cursor:pointer;
    }
    .item:active{
      background: rgba(165,180,252,.10);
    }
    .main{
      min-width:0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 4px;
    }
    .id{
      font-weight: 950;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: #0b1020;
    }
    .name{
      font-weight: 850;
      font-size: .95rem;
      color: rgba(15,23,42,0.78);
      word-break: keep-all;
      line-height: 1.25;
    }
    .chev{
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(147,197,253,.22);
      border: 1px solid rgba(147,197,253,.28);
      display:grid;
      place-items:center;
      font-weight: 950;
      color: rgba(15,23,42,.55);
      flex: 0 0 auto;
    }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(15,23,42,0.55);
      font-weight: 850;
    }

    /* 모달(바텀시트) */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.35);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(760px, 100%);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 22px;
      box-shadow: 0 28px 90px rgba(15,23,42,.25);
      overflow:hidden;
      backdrop-filter: blur(14px);
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{
      transform: translateY(0);
      opacity: 1;
    }

    .sheet-head{
      padding: 14px 14px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      background: rgba(255,255,255,0.76);
      border-bottom: 1px solid rgba(148,163,184,0.22);
    }
    .sheet-head .t{
      min-width:0;
    }
    .sheet-head .t .line1{
      margin:0 0 4px 0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.06rem;
    }
    .sheet-head .t .line2{
      margin:0;
      color: rgba(15,23,42,0.72);
      font-weight: 850;
      line-height: 1.25;
      word-break: keep-all;
    }
    .x{
      border:0;
      background: rgba(15,23,42,0.06);
      width: 42px;
      height: 42px;
      border-radius: 14px;
      cursor:pointer;
      font-weight: 950;
      color: rgba(15,23,42,0.72);
    }

    .sheet-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 10px;
    }

    .kv{
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 16px;
      padding: 10px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .kv .k{
      color: var(--muted);
      font-weight: 900;
      font-size: .88rem;
      flex: 0 0 auto;
      padding-top: 2px;
    }
    .kv .v{
      font-weight: 900;
      color: rgba(15,23,42,0.82);
      font-size: .95rem;
      text-align:right;
      word-break: keep-all;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    .statusRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .statusRow .k{
      color: var(--muted);
      font-weight: 900;
      font-size: .88rem;
    }
    .statusRow select{
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.35);
      padding: 8px 10px;
      font-weight: 950;
      background: rgba(255,255,255,0.85);
      outline: none;
    }

    .sheet-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
    }
    .btnSmall{
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
    }
    .ghost{
      background: rgba(147,197,253,.20);
      border: 1px solid rgba(147,197,253,.25);
      color: rgba(15,23,42,.80);
    }
    .ok{
      background: linear-gradient(135deg, rgba(134,239,172,.85), rgba(165,180,252,.85));
      border: 1px solid rgba(165,180,252,.25);
      color: rgba(15,23,42,.88);
    }

    /* 토스트 */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.80);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 800;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    @media (max-width: 420px){
      .date-wrap input[type="date"]{ min-width: 140px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="title">
        <h1>🌿 현황 조회</h1>
        <div class="mini" id="todayLabel">오늘: -</div>
      </div>

      <div class="bar">
        <div class="seg" role="tablist" aria-label="시설 선택">
          <button id="tabNature" class="active" onclick="switchSource('nature')">자연장지</button>
          <button id="tabHouse" onclick="switchSource('house')">추모의집</button>
        </div>

        <div class="date-wrap">
          <span class="label">날짜</span>
          <input type="date" id="datePicker" />
        </div>
      </div>

      <div class="tiny-actions">
        <label class="chip" title="체크하면 전체 데이터를 봅니다">
          <input type="checkbox" id="toggleAll" />
          전체
        </label>
      </div>

      <div class="stats" id="stats"></div>
    </div>

    <div class="content">
      <div id="listArea"></div>
    </div>
  </div>

  <!-- 바텀시트 모달 -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="t">
          <p class="line1" id="mTitle">-</p>
          <p class="line2" id="mSub">-</p>
        </div>
        <button class="x" onclick="closeSheet()" aria-label="닫기">✕</button>
      </div>

      <div class="sheet-body">
        <div class="kv">
          <div class="k">현황</div>
          <div class="v">
            <div class="statusRow">
              <span class="k"></span>
              <select id="mStatus"></select>
            </div>
          </div>
        </div>

        <div id="mFields"></div>
      </div>

      <div class="sheet-actions">
        <button class="btnSmall ghost" onclick="copyId()">📋 번호 복사</button>
        <button class="btnSmall ok" onclick="closeSheet()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    /* -------------------------
      ✅ 로컬(한국) 기준 YYYY-MM-DD
      - toISOString() 쓰면 UTC라서 하루 전으로 보일 수 있음
    --------------------------*/
    function getLocalISODate(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const SOURCES = {
      nature: { label: "자연장지", url: "./data/nature_data.json" },
      house:  { label: "추모의집", url: "./data/deceased_data.json" }
    };

    const datePicker = document.getElementById('datePicker');
    const toggleAll = document.getElementById('toggleAll');
    const todayLabel = document.getElementById('todayLabel');
    const statsDiv = document.getElementById('stats');
    const listArea = document.getElementById('listArea');

    const tabNature = document.getElementById('tabNature');
    const tabHouse = document.getElementById('tabHouse');

    const overlay = document.getElementById('overlay');
    const mTitle = document.getElementById('mTitle');
    const mSub = document.getElementById('mSub');
    const mStatus = document.getElementById('mStatus');
    const mFields = document.getElementById('mFields');

    let currentSource = 'nature';
    let currentDisplayData = [];   // 화면에 표시되는 목록 데이터
    let currentSelected = null;    // 모달에 표시 중인 항목(원본)

    // ✅ 오늘 날짜(로컬)
    const TODAY = getLocalISODate(new Date());
    todayLabel.textContent = `오늘: ${TODAY}`;

    // ✅ 초기 진입은 항상 "오늘"로 고정
    datePicker.value = TODAY;

    // UX 단순화: 날짜 변경/전체 토글/탭 변경 시 자동 로드
    datePicker.addEventListener('change', () => load());
    toggleAll.addEventListener('change', () => load());

    function switchSource(sourceKey){
      currentSource = sourceKey;
      tabNature.classList.toggle('active', sourceKey === 'nature');
      tabHouse.classList.toggle('active', sourceKey === 'house');
      load();
    }

    // -------------------------
    // ✅ 상태 저장: "시설+번호" 단위
    // -------------------------
    function statusKey(sourceKey, id){
      return `status_${sourceKey}_${id}`;
    }
    function getStatus(sourceKey, id){
      return localStorage.getItem(statusKey(sourceKey, id)) || '접수';
    }
    function setStatus(sourceKey, id, val){
      localStorage.setItem(statusKey(sourceKey, id), val);
    }

    // -------------------------
    // ✅ 데이터 필드 유연 매핑 (추모의집 JSON 구조가 달라도 최대한 동작)
    // -------------------------
    const ID_CANDIDATES = ['natNo','deceasedNo','receiptNo','recNo','applyNo','no','id','번호','접수번호','관리번호'];
    const NAME_CANDIDATES = ['deadName','deceasedName','name','고인명','사망자명'];
    const APPL_CANDIDATES = ['applName','applicant','신청자명','신청인','유족'];
    const DATE_CANDIDATES = ['natDate','recDate','receiptDate','applyDate','regDate','date','접수일자','등록일자','안장일자'];

    function pickField(obj, candidates){
      for (const k of candidates){
        if (obj && Object.prototype.hasOwnProperty.call(obj, k) && obj[k] != null && String(obj[k]).trim() !== '') return k;
      }
      return null;
    }

    function getId(obj){
      const k = pickField(obj, ID_CANDIDATES);
      return k ? String(obj[k]) : '-';
    }
    function getName(obj){
      const k = pickField(obj, NAME_CANDIDATES);
      return k ? String(obj[k]) : '-';
    }
    function getApplicant(obj){
      const k = pickField(obj, APPL_CANDIDATES);
      return k ? String(obj[k]) : '-';
    }
    function getDateField(sampleObj){
      return pickField(sampleObj, DATE_CANDIDATES);
    }

    // 자연장지: 부부장 병합(기존 로직 유지)
    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];

      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString();
        const applName = (r.applName ?? '').toString();
        const key = `${natNo}||${applName}`;

        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            applName: r.applName ?? '-',
            deadNames: new Set([(r.deadName ?? '-').toString()]),
            dates: new Set([(r.natDate ?? '-').toString()]),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          cur.deadNames.add((r.deadName ?? '-').toString());
          cur.dates.add((r.natDate ?? '-').toString());
          cur._raw.push(r);
        }
      }

      return order.map(key => {
        const v = map.get(key);
        const deadNameJoined = Array.from(v.deadNames).filter(x => x && x !== '-').join(' / ') || '-';
        const dateJoined = Array.from(v.dates).filter(x => x && x !== '-').join(', ') || '-';
        return {
          natNo: v.natNo,
          deadName: deadNameJoined,
          applName: v.applName,
          natDate: dateJoined,
          _raw: v._raw
        };
      });
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    async function fetchJson(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    }

    // -------------------------
    // ✅ 메인 로드
    // -------------------------
    async function load(){
      const source = SOURCES[currentSource];
      const selectedDate = datePicker.value || TODAY; // 비어있으면 오늘로
      const showAll = toggleAll.checked;

      try{
        const raw = await fetchJson(source.url);
        const data = Array.isArray(raw) ? raw : [];

        // 날짜 필터: 소스별로 자동 추정(없으면 필터 불가)
        const dateKey = data.length ? getDateField(data[0]) : null;

        let filtered = data;
        if (!showAll && dateKey){
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selectedDate);
        }

        // 표시용 데이터: 자연장지면 병합, 추모의집은 그대로
        let displayData = filtered;
        if (currentSource === 'nature'){
          displayData = mergeCoupleRows(filtered);
        }

        currentDisplayData = displayData;

        // 통계 (깔끔하게 2개만)
        const displayCount = displayData.length;
        const rawCount = data.length;

        const rangeLabel = showAll ? '전체' : selectedDate;
        statsDiv.innerHTML = `
          <div class="stat">
            <div class="num">${displayCount.toLocaleString()}</div>
            <div class="txt">${source.label} · ${rangeLabel} 표시건수</div>
          </div>
          <div class="stat">
            <div class="num">${rawCount.toLocaleString()}</div>
            <div class="txt">원본 전체 건수</div>
          </div>
        `;

        // 리스트 렌더
        if (displayCount === 0){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          return;
        }

        const limit = 80;
        const shown = displayData.slice(0, limit);

        let html = `
          <div class="list">
            <div class="list-head">
              <div class="hint">목록(번호+고인명) → 눌러서 상세</div>
              <div class="badge">${Math.min(limit, displayCount).toLocaleString()} / ${displayCount.toLocaleString()}</div>
            </div>
            <ul>
        `;

        shown.forEach((item, idx) => {
          // 표시: 번호 + 고인명
          const id = (currentSource === 'nature') ? (item.natNo ?? '-') : getId(item);
          const name = (currentSource === 'nature') ? (item.deadName ?? '-') : getName(item);

          html += `
            <li>
              <button class="item" onclick="openSheet(${idx})">
                <div class="main">
                  <div class="id">${escapeHtml(id)}</div>
                  <div class="name">${escapeHtml(name)}</div>
                </div>
                <div class="chev">›</div>
              </button>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (displayCount > limit){
          listArea.insertAdjacentHTML('beforeend', `<div class="no-data" style="padding:10px 0 0;">(상위 ${limit}건만 표시 중)</div>`);
        }

      }catch(err){
        listArea.innerHTML = `<div class="no-data">❌ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    // -------------------------
    // ✅ 모달(바텀시트) 열기
    // -------------------------
    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      // 자연장지는 병합된 item을 그대로 사용(모달에 표시)
      // 추모의집은 원본 item 사용
      currentSelected = item;

      const sourceLabel = SOURCES[currentSource].label;

      const id = (currentSource === 'nature') ? String(item.natNo ?? '-') : getId(item);
      const name = (currentSource === 'nature') ? String(item.deadName ?? '-') : getName(item);

      mTitle.textContent = `${sourceLabel} · ${id}`;
      mSub.textContent = name;

      // 현황 셀렉트
      mStatus.innerHTML = `
        <option value="접수">접수</option>
        <option value="안치대기">안치대기</option>
        <option value="안장완료">안장완료</option>
      `;
      mStatus.value = getStatus(currentSource, id);
      mStatus.onchange = (e) => {
        setStatus(currentSource, id, e.target.value);
        showToast(`✅ ${id} : ${e.target.value}`);
      };

      // ✅ 상세 필드: “나머지 데이터도 다같이 표기”
      // - 자연장지: natNo/deadName/applName/natDate + (병합이면 _raw 개수 표시)
      // - 추모의집: 객체의 모든 키-값을 보여줌(너무 길면 자동 줄바꿈)
      let fieldsHTML = '';

      if (currentSource === 'nature'){
        const applName = item.applName ?? '-';
        const natDate = item.natDate ?? '-';
        const mergedCount = Array.isArray(item._raw) ? item._raw.length : 1;

        fieldsHTML += kvRow('신청자명', applName);
        fieldsHTML += kvRow('일자', natDate);
        if (mergedCount > 1) fieldsHTML += kvRow('병합', `${mergedCount}건(부부장)`);

      } else {
        // 추모의집: JSON의 모든 키 출력
        const obj = item || {};
        const entries = Object.entries(obj);

        // 보기에서 너무 불필요한 내부키는 제외(원하면 제거 가능)
        const hideKeys = new Set(['_raw']);
        entries
          .filter(([k]) => !hideKeys.has(k))
          .forEach(([k, v]) => {
            fieldsHTML += kvRow(k, (v == null || v === '') ? '-' : String(v));
          });

        // 후보 필드 추가 안내(데이터에 날짜키가 없으면 필터가 안 될 수 있어서)
        if (!entries.length){
          fieldsHTML += kvRow('안내', '표시할 상세 필드가 없습니다.');
        }
      }

      mFields.innerHTML = fieldsHTML;

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }

    function kvRow(k, v){
      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
      currentSelected = null;
    }

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeSheet();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet();
    });

    function copyId(){
      const sourceLabel = SOURCES[currentSource].label;
      if (!currentSelected) return;
      const id = (currentSource === 'nature') ? String(currentSelected.natNo ?? '') : getId(currentSelected);
      if (!id) return;
      navigator.clipboard.writeText(id);
      showToast(`📋 ${sourceLabel} 번호 복사됨`);
    }

    // ✅ 최초 로드: 오늘로 고정 + 자연장지 기본
    window.addEventListener('load', () => {
      datePicker.value = TODAY;
      switchSource('nature'); // 내부에서 load() 호출
    });
  </script>
</body>
</html>
