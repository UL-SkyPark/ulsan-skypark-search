<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 자연장지 안장현황</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; }
        h1 { text-align: center; color: #6a4c93; margin-bottom: 10px; font-size: 2em; }
        .controls { text-align: center; margin-bottom: 30px; }
        .date { color: #888; font-size: 1.1em; margin-bottom: 15px; }
        input[type="date"] { padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; margin: 0 10px; }
        .btn-group { display: inline-flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button { background: #6a4c93; color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-size: 0.95em; transition: all 0.3s; }
        button:hover:not(:disabled) { background: #5a3c83; transform: translateY(-1px); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-all { background: #4caf50; } .btn-all:hover:not(:disabled) { background: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9ff; font-weight: 600; color: #6a4c93; position: sticky; top: 0; }
        tr:hover { background: #f0f4ff; }
        .no-data { text-align: center; color: #888; font-style: italic; padding: 40px; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; flex-wrap: wrap; }
        .stat-box { background: #e8f4fd; padding: 15px; border-radius: 10px; text-align: center; min-width: 120px; }
        .stat-num { font-size: 2em; color: #6a4c93; font-weight: bold; }
        @media (max-width: 768px) { .container { padding: 20px; } th, td { padding: 8px; font-size: 0.9em; } .btn-group { flex-direction: column; width: 100%; } input[type="date"] { width: 100%; margin: 5px 0; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 자연장지 안장현황 조회</h1>
        <div class="controls">
            <div class="date" id="selectedDate"></div>
            <div class="btn-group">
                <input type="date" id="datePicker" value="">
                <button onclick="loadStatus()">날짜별 조회</button>
                <button class="btn-all" onclick="loadAllStatus()">전체 보기</button>
            </div>
        </div>
        <div class="stats" id="stats"></div>
        <div id="statusTable"></div>
    </div>

    <script>
        const datePicker = document.getElementById('datePicker');
        const dateDisplay = document.getElementById('selectedDate');

        // 오늘 날짜 기본 설정
        const today = new Date().toISOString().split('T')[0];
        datePicker.value = today;
        dateDisplay.textContent = `선택: ${today}`;

        // 날짜 변경시 표시 업데이트
        datePicker.addEventListener('change', () => {
            dateDisplay.textContent = `선택: ${datePicker.value || '전체'}`;
        });

        async function loadStatus(selectedDate = null) {
            const btn = event ? event.target : null;
            if (btn) {
                btn.disabled = true;
                btn.textContent = '로드 중...';
            }
            const tableDiv = document.getElementById('statusTable');
            const statsDiv = document.getElementById('stats');

            try {
                const response = await fetch('./data/nature_data.json');
                if (!response.ok) throw new Error('파일을 찾을 수 없습니다. ./data/nature_data.json 경로 확인');
                const data = await response.json();

                let filteredData = data;
                if (selectedDate) {
                    filteredData = data.filter(item => item.natDate === selectedDate);
                }

                // 통계
                const totalFiltered = filteredData.length;
                const statsHTML = `
                    <div class="stat-box">
                        <div class="stat-num">${totalFiltered}</div>
                        <div>${selectedDate ? '선택일자' : '전체'} 안장</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num">${data.length}</div>
                        <div>전체 자연장</div>
                    </div>
                `;
                statsDiv.innerHTML = statsHTML;

                if (totalFiltered === 0) {
                    tableDiv.innerHTML = `<div class="no-data">${selectedDate ? `${selectedDate}에 ` : ''}안장된 자연장지가 없습니다.</div>`;
                    return;
                }

                // 테이블 생성
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>자연장번호</th>
                                <th>안치일자</th>
                                <th>사망자명</th>
                                <th>신청자명</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                filteredData.slice(0, 100).forEach(item => {  // 100건 제한 (성능)
                    tableHTML += `
                        <tr>
                            <td>${item.natNo || ''}</td>
                            <td>${item.natDate || ''}</td>
                            <td>${item.deadName || ''}</td>
                            <td>${item.applName || ''}</td>
                        </tr>
                    `;
                });
                tableHTML += '</tbody></table>';
                if (filteredData.length > 100) {
                    tableHTML += `<p style="text-align:center;color:#888;">총 ${filteredData.length}건 (상위 100건 표시)</p>`;
                }
                tableDiv.innerHTML = tableHTML;

            } catch (error) {
                tableDiv.innerHTML = `<div class="no-data" style="color: #d32f2f;">오류: ${error.message}</div>`;
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '날짜별 조회';
                }
            }
        }

        async function loadAllStatus() {
            datePicker.value = '';
            dateDisplay.textContent = '선체 보기';
            await loadStatus(null);
        }

        // 초기 로드 (오늘)
        loadStatus(today);
    </script>
</body>
</html>
