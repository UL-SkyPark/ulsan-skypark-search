<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>울산하늘공원 접수 현황</title>

  <link rel="icon" type="image/png" href="./images/symbol.png">
  <link rel="apple-touch-icon" href="./images/symbol.png">

  <style>
    :root{
      --bg:#f4f6f9;
      --panel:#ffffff;
      --line:#d9e0ea;
      --line2:#c9d2df;
      --text:#1f2a37;
      --muted:#6b7280;
      --primary:#1f4e79;
      --shadow: 0 8px 24px rgba(15,23,42,0.08);
      --shadow2: 0 14px 40px rgba(15,23,42,0.10);
      --radius: 14px;

      --outerPad: 12px;

      --fabSize: 54px;
      --fabGap: 10px;
      --fabRight: 14px;
      --fabBottom: 14px;

      /* ✅ 타입 스케일 */
      --fs-xxs: clamp(.74rem, 2.6vw, .82rem);
      --fs-xs : clamp(.80rem, 2.8vw, .90rem);
      --fs-sm : clamp(.88rem, 3.0vw, .98rem);
      --fs-md : clamp(.96rem, 3.2vw, 1.05rem);
      --fs-lg : clamp(1.06rem, 3.6vw, 1.18rem);
      --fs-xl : clamp(1.22rem, 4.4vw, 1.55rem);

      --lh-tight: 1.15;
      --lh-base : 1.25;
      --lh-loose: 1.34;

      --ls-tight: -0.015em;
      --ls-base : -0.01em;

      /* ✅ iOS 최적화 스케일(기본=변경없음) */
      --scale-font: 1; /* 글자 */
      --scale-ui  : 1; /* 간격/패딩/버튼 */
      --scale-lh  : 1; /* 줄간격 */
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }

    /* ✅ iOS 보정은 html 클래스에서 걸어야 font-size에 반영됨 */
    html{
      font-size: calc(clamp(14px, 3.6vw, 16px) * var(--scale-font));
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    /* ✅ iPhone/iPad 스케일 (원하시면 여기 숫자만 조절) */
    html.ios-iphone{
      --scale-font: 1.24; /* 폰트 +24% */
      --scale-ui  : 1.16; /* 간격 +16% */
      --scale-lh  : 1.10; /* 줄간격 +10% */
    }
    html.ios-ipad{
      --scale-font: 1.18; /* 폰트 +18% */
      --scale-ui  : 1.10; /* 간격 +10% */
      --scale-lh  : 1.08; /* 줄간격 +8% */
    }

    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);

      padding: calc(var(--outerPad) * var(--scale-ui));
      padding-bottom: calc((var(--outerPad) * var(--scale-ui)) + 16px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      text-rendering: optimizeLegibility;
    }

    /* =========================
       Pull to Refresh
       ========================= */
    .pull-to-refresh{
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -140%);
      height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(217,224,234,0.90);
      box-shadow: 0 10px 30px rgba(15,23,42,0.12);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      z-index: 10001;
      transition: transform 240ms cubic-bezier(.2,.9,.2,1);
      will-change: transform;
      pointer-events: none;
    }
    .pull-to-refresh.visible{ transform: translate(-50%, 0); }

    .ptr-ring{
      width: 22px;
      height: 22px;
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto;
    }
    .ptr-ring svg{
      width: 22px;
      height: 22px;
      display:block;
      transform: rotate(-90deg);
      transition: opacity 120ms ease;
    }
    .ptr-ring .spin{
      position:absolute;
      inset:0;
      border-radius:50%;
      border: 2px solid rgba(203,213,225,0.9);
      border-top-color: rgba(15,23,42,0.9);
      opacity: 0;
      animation: spin 0.9s linear infinite;
      transition: opacity 120ms ease;
    }
    .ptr-ring.loading .spin{ opacity: 1; }
    .ptr-ring.loading svg{ opacity: 0; }

    .ptr-status{
      font-weight: 900;
      font-size: var(--fs-sm);
      color: rgba(15,23,42,0.86);
      letter-spacing: var(--ls-base);
      white-space: nowrap;
      line-height: var(--lh-tight);
    }
    @keyframes spin{ to { transform: rotate(360deg); } }

    /* =========================
       App shell
       ========================= */
    .app{
      max-width: 980px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top{
      position: sticky;
      top: calc((var(--outerPad) * var(--scale-ui)) * -1);
      z-index: 50;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      border-bottom: 1px solid var(--line);
      margin: calc((var(--outerPad) * var(--scale-ui)) * -1);
      margin-bottom: 0;
      padding: calc(var(--outerPad) * var(--scale-ui));
      padding-top: calc((var(--outerPad) * var(--scale-ui)) + env(safe-area-inset-top) * 0);
    }

    .header{
      padding: calc(14px * var(--scale-ui)) calc(16px * var(--scale-ui)) calc(10px * var(--scale-ui));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: calc(12px * var(--scale-ui));
      flex-wrap: wrap;
    }

    .brand, .rightInfo, .rowR, .rowTop, .main, .field .v{ min-width: 0; }

    .brand{
      display:flex;
      flex-direction:column;
      gap: calc(4px * var(--scale-ui));
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand h1{
      margin:0;
      font-weight: 950;
      letter-spacing: var(--ls-tight);
      color: #0f172a;
      word-break: keep-all;
      font-size: var(--fs-xl);
      line-height: calc(1.18 * var(--scale-lh));
    }

    .rightInfo{
      display:flex;
      align-items:flex-start;
      justify-content:flex-end;
      flex: 0 0 auto;
      margin-left: auto;
      padding-top: calc(2px * var(--scale-ui));
      min-width: 0;
    }
    .refDate{
      font-weight: 900;
      font-size: var(--fs-sm);
      letter-spacing: var(--ls-base);
      color: rgba(15,23,42,0.56);
      white-space: nowrap;
      line-height: var(--lh-tight);
    }

    .toolbar{
      padding: calc(10px * var(--scale-ui)) calc(16px * var(--scale-ui)) calc(14px * var(--scale-ui));
      display:flex;
      gap: calc(10px * var(--scale-ui));
      flex-wrap: wrap;
      align-items: stretch;
    }

    /* =========================
       Segmented tabs
       ========================= */
    .seg{
      display:flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      min-width: 260px;
      flex: 0 0 auto;
    }
    .seg button{
      border:0;
      background: transparent;
      padding: calc(11px * var(--scale-ui)) calc(12px * var(--scale-ui));
      border-radius: 10px;
      font-weight: 950;
      color: rgba(31,42,55,.75);
      cursor: pointer;
      min-height: calc(44px * var(--scale-ui));
      flex: 1;
      white-space: nowrap;

      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }
    .seg button.active{
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(31,78,121,.25);
    }

    /* =========================
       Fields group
       ========================= */
    .group{
      flex: 1 1 520px;
      min-width: 320px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: calc(10px * var(--scale-ui));
      align-items: stretch;
    }

    .field{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: calc(10px * var(--scale-ui)) calc(12px * var(--scale-ui));
      display:flex;
      flex-direction:column;
      gap: calc(8px * var(--scale-ui));
      min-height: calc(64px * var(--scale-ui));
      min-width: 0;
    }
    .field .k{
      color: var(--muted);
      font-weight: 900;
      font-size: var(--fs-xs);
      letter-spacing: var(--ls-base);
      white-space: nowrap;
      line-height: var(--lh-tight);
    }
    .field .v{
      display:flex;
      align-items:center;
      gap: calc(8px * var(--scale-ui));
      font-weight: 950;
      color: rgba(31,42,55,.92);
      min-width: 0;
      line-height: var(--lh-tight);
    }

    .field input[type="date"]{
      width: 100%;
      border: 0;
      outline: none;
      box-shadow: none;
      background: transparent;
      border-radius: 0;

      padding: calc(6px * var(--scale-ui)) 0;
      font-weight: 950;
      color: var(--text);
      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);

      -webkit-appearance:none;
      appearance:none;
      min-height: calc(40px * var(--scale-ui));
      min-width: 0;
    }
    .field input[type="date"]:focus{
      outline: none;
      box-shadow: none;
    }
    .field input[type="date"]::-webkit-calendar-picker-indicator{
      opacity: .75;
      padding: 0;
      margin: 0;
    }

    .countCenter{
      width: 100%;
      text-align: center;
      font-weight: 950;
      color: #0f172a;
      letter-spacing: var(--ls-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: var(--lh-tight);
      padding: calc(2px * var(--scale-ui)) 0;
      font-size: var(--fs-md);
      min-width: 0;
    }

    .content{
      padding: calc(12px * var(--scale-ui)) calc(16px * var(--scale-ui)) calc(16px * var(--scale-ui));
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
    }

    /* =========================
       List
       ========================= */
    .list{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .list-head{
      padding: calc(10px * var(--scale-ui)) calc(12px * var(--scale-ui));
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: calc(10px * var(--scale-ui));
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      flex-wrap: wrap;
    }
    .list-head .hint{
      font-weight: 950;
      color: #0f172a;
      display:flex;
      align-items:center;
      gap: calc(10px * var(--scale-ui));
      white-space: nowrap;

      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }
    .badge{
      font-size: var(--fs-sm);
      font-weight: 950;
      background: #fff;
      border: 1px solid var(--line);
      padding: calc(7px * var(--scale-ui)) calc(10px * var(--scale-ui));
      border-radius: 999px;
      color: rgba(31,42,55,.78);
      white-space: nowrap;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }

    .nameLine{
      display:flex;
      align-items:center;
      gap: calc(8px * var(--scale-ui));
      min-width: 0;
    }
    .nameLine .name{ min-width: 0; }

    .tag{
      flex: 0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: calc(4px * var(--scale-ui)) calc(9px * var(--scale-ui));
      border-radius: 999px;
      border: 1px solid rgba(217,224,234,.95);
      background: rgba(255,255,255,.92);
      font-weight: 950;
      font-size: var(--fs-xs);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
      color: rgba(15,23,42,.78);
      white-space: nowrap;
    }
    .tag.self{
      border-color: rgba(31,78,121,.28);
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: rgba(31,78,121,.95);
    }
    .tag.orphan{
      border-color: rgba(180,83,9,.28);
      background: linear-gradient(180deg, rgba(180,83,9,.16), rgba(245,158,11,.10));
      color: rgba(180,83,9,.95);
    }

    ul{ list-style:none; padding:0; margin:0; }

    .row{
      display:grid;
      grid-template-columns: 10px 1fr;
      gap: calc(10px * var(--scale-ui));
      padding: calc(12px * var(--scale-ui)) calc(12px * var(--scale-ui));
      border-bottom: 1px solid var(--line);
      align-items: stretch;
      background: #fff;
    }
    .row:last-child{ border-bottom:0; }

    .barL{
      width: 10px;
      border-radius: 6px;
      background: #e2e8f0;
      height: 100%;
      align-self: stretch;
    }
    .row.recv .barL{ background: rgba(31,78,121,.35); }
    .row.done .barL{ background: rgba(46,125,50,.45); }
    .row.ret .barL{ background: rgba(180,83,9,.40); }
    .row.retDone .barL{ background: rgba(126,34,206,.48); }

    .rowR{
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap: calc(8px * var(--scale-ui));
    }

    .rowTop{
      display:flex;
      gap: calc(10px * var(--scale-ui));
      align-items:flex-start;
      justify-content:space-between;
      min-width: 0;
    }

    .mainBtn{
      border:0;
      background: transparent;
      text-align:left;
      padding: 0;
      margin: 0;
      cursor: pointer;
      min-width: 0;
      flex: 1;
    }
    .mainBtn:active{ background: rgba(31,78,121,.06); }

    .main{
      display:flex;
      flex-direction:column;
      gap: calc(6px * var(--scale-ui));
      min-width: 0;
    }

    .no{
      font-weight: 950;
      color: #0f172a;
      font-size: var(--fs-md);
      white-space: nowrap;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }

    .name{
      font-weight: 950;
      color: rgba(15,23,42,.92);
      font-size: var(--fs-lg);
      line-height: calc(1.22 * var(--scale-lh));
      word-break: keep-all;
      letter-spacing: var(--ls-base);
      min-width: 0;
    }

    .toggle{
      display:flex;
      align-items:center;
      gap: calc(8px * var(--scale-ui));
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: calc(6px * var(--scale-ui)) calc(10px * var(--scale-ui));
      cursor: pointer;
      white-space: nowrap;
      user-select:none;
      margin-top: calc(2px * var(--scale-ui));
      flex: 0 0 auto;
      min-height: calc(40px * var(--scale-ui));
    }
    .toggle span{
      font-size: var(--fs-xs);
      font-weight: 950;
      color: rgba(31,42,55,.74);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }
    .sw{
      width: calc(38px * var(--scale-ui));
      height: calc(22px * var(--scale-ui));
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: #eef2f7;
      position: relative;
      flex: 0 0 auto;
    }
    .sw::after{
      content:"";
      position:absolute;
      top: 50%;
      left: calc(3px * var(--scale-ui));
      transform: translateY(-50%);
      width: calc(17px * var(--scale-ui));
      height: calc(17px * var(--scale-ui));
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line2);
      transition: left .14s ease;
    }
    .sw.on{
      background: rgba(46,125,50,.14);
      border-color: rgba(46,125,50,.22);
    }
    .sw.on::after{ left: calc(18px * var(--scale-ui)); }

    .cremWrap{ display:flex; flex-direction:column; gap: calc(4px * var(--scale-ui)); min-width:0; }
    .cremLine{
      font-weight: 900;
      font-size: var(--fs-sm);
      color: rgba(31,42,55,.72);
      line-height: calc(var(--lh-loose) * var(--scale-lh));
      letter-spacing: var(--ls-base);
      word-break: keep-all;
      min-width: 0;
    }

    .no-data{
      text-align:center;
      padding: calc(26px * var(--scale-ui)) calc(14px * var(--scale-ui));
      color: rgba(31,42,55,0.56);
      font-weight: 900;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);

      font-size: var(--fs-md);
      line-height: calc(var(--lh-base) * var(--scale-lh));
      letter-spacing: var(--ls-base);
    }

    /* =========================
       Modal sheet
       ========================= */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: calc(14px * var(--scale-ui));
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(560px, 94vw);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 30px 90px rgba(15,23,42,.25);
      overflow:hidden;
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    .sheet-head{
      padding: calc(12px * var(--scale-ui)) calc(14px * var(--scale-ui));
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: calc(12px * var(--scale-ui));
      min-height: calc(58px * var(--scale-ui));
    }
    .sheet-title{
      font-weight: 950;
      color: #0f172a;
      letter-spacing: var(--ls-tight);
      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sheet-body{
      padding: calc(12px * var(--scale-ui)) calc(14px * var(--scale-ui)) calc(14px * var(--scale-ui));
      display:grid;
      gap: calc(10px * var(--scale-ui));
      background: #fff;
    }

    .kv{
      display:flex;
      gap: calc(12px * var(--scale-ui));
      align-items:flex-start;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: calc(10px * var(--scale-ui)) calc(12px * var(--scale-ui));
      min-width: 0;
    }
    .kv .k{
      flex: 0 0 calc(92px * var(--scale-ui));
      color: var(--muted);
      font-weight: 950;
      font-size: var(--fs-xs);
      padding-top: calc(2px * var(--scale-ui));
      letter-spacing: var(--ls-base);
      line-height: var(--lh-tight);
    }
    .kv .v{
      flex: 1;
      min-width: 0;
      color: rgba(31,42,55,.86);
      font-weight: 900;
      font-size: var(--fs-sm);
      line-height: calc(var(--lh-loose) * var(--scale-lh));
      letter-spacing: var(--ls-base);
      word-break: keep-all;
    }

    @media (min-width: 720px){
      #mFields{ display:grid; grid-template-columns: 1fr 1fr; gap: calc(10px * var(--scale-ui)); }
    }

    .sheet-actions{
      padding: 0 calc(14px * var(--scale-ui)) calc(14px * var(--scale-ui));
      display:flex;
      gap: calc(10px * var(--scale-ui));
      background: #fff;
    }

    .btn{
      flex: 1;
      border: 1px solid var(--line2);
      border-radius: 12px;
      padding: calc(10px * var(--scale-ui)) calc(10px * var(--scale-ui));
      font-weight: 950;
      cursor:pointer;
      min-height: calc(42px * var(--scale-ui));
      background: #fff;
      color: rgba(31,42,55,.9);

      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }
    .btn.primary{
      border-color: rgba(31,78,121,.30);
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: var(--primary);
    }

    /* =========================
       Toast
       ========================= */
    .toast{
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(15,23,42,0.92);
      color: #fff;
      padding: calc(10px * var(--scale-ui)) calc(14px * var(--scale-ui));
      border-radius: 14px;
      font-size: var(--fs-sm);
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:left;
      white-space: normal;
      line-height: calc(var(--lh-base) * var(--scale-lh));
      letter-spacing: var(--ls-base);
      word-break: keep-all;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    /* =========================
       FABs
       ========================= */
    .fabs{
      position: fixed;
      right: var(--fabRight);
      bottom: calc(var(--fabBottom) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: var(--fabGap);
      z-index: 10002;
      pointer-events: none;
    }
    .fab{
      width: var(--fabSize);
      height: var(--fabSize);
      border-radius: 999px;
      border: 1px solid rgba(217,224,234,.92);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(15,23,42,0.14);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 950;
      color: rgba(15,23,42,0.86);
      pointer-events: auto;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .fab.show{
      opacity: 1;
      transform: translateY(0);
    }
    .fab:active{ transform: translateY(0) scale(0.98); }
    .fab svg{ width: 22px; height: 22px; stroke: rgba(15,23,42,0.84); }

    .fab.refresh{
      border-color: rgba(31,78,121,.25);
    }
    .fab.refresh svg{ stroke: rgba(31,78,121,0.92); }

    /* =========================
       Infinite scroll status
       ========================= */
    .inf {
      margin-top: calc(10px * var(--scale-ui));
      display: grid;
      gap: calc(10px * var(--scale-ui));
    }
    .infCard{
      text-align:center;
      padding: calc(12px * var(--scale-ui)) calc(14px * var(--scale-ui));
      color: rgba(31,42,55,0.62);
      font-weight: 900;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);

      font-size: var(--fs-md);
      line-height: calc(var(--lh-base) * var(--scale-lh));
      letter-spacing: var(--ls-base);
    }
    .infCard strong{
      color: rgba(15,23,42,0.86);
    }
    #sentinel{ height: 1px; }

    @media (max-width: 560px){
      .seg{ flex: 1 1 100%; min-width: 0; }
      .group{ min-width: 0; grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce){
      .pull-to-refresh{ transition: none !important; }
      .ptr-ring .spin{ animation: none !important; }
      .fab{ transition: none !important; }
    }
  </style>
</head>

<body>
  <div id="pull-to-refresh" class="pull-to-refresh" aria-hidden="true">
    <div id="ptrRing" class="ptr-ring" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="rgba(203,213,225,0.85)" stroke-width="2.4" fill="none"></circle>
        <circle id="ptrProg" cx="12" cy="12" r="9" stroke="rgba(15,23,42,0.88)" stroke-width="2.4" fill="none"
                stroke-linecap="round" stroke-dasharray="56.55" stroke-dashoffset="56.55"></circle>
      </svg>
      <div class="spin" aria-hidden="true"></div>
    </div>
    <div id="ptr-status" class="ptr-status">당겨서 새로고침</div>
  </div>

  <div class="app" id="app">
    <div class="top" id="topBar">
      <div class="header">
        <div class="brand">
          <h1>울산하늘공원 접수 현황</h1>
        </div>
        <div class="rightInfo" aria-label="기준날짜">
          <div class="refDate" id="refDateText">0000-00-00</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="seg" role="tablist" aria-label="시설 선택">
          <button id="tabHouse" class="active" type="button">추모의집</button>
          <button id="tabNature" type="button">자연장지</button>
        </div>

        <div class="group">
          <div class="field" id="datePill">
            <div class="k">날짜 선택</div>
            <div class="v">
              <input type="date" id="datePicker" />
            </div>
          </div>

          <div class="field" id="countPill">
            <div class="k" id="countTitle">현황</div>
            <div class="v" style="width:100%;">
              <div class="countCenter" id="countText">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="content" id="contentArea">
      <div id="listArea"></div>
      <div id="infiniteArea"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="sheet-title" id="mTitleLine">-</div>
      </div>
      <div class="sheet-body">
        <div id="mFields"></div>
      </div>
      <div class="sheet-actions">
        <button class="btn primary" type="button" id="sheetOkBtn">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <div class="fabs" aria-hidden="false">
    <button id="fabRefresh" class="fab refresh" type="button" aria-label="새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 0 1-15.2 6.4"></path>
        <path d="M3 12a9 9 0 0 1 15.2-6.4"></path>
        <path d="M21 3v6h-6"></path>
        <path d="M3 21v-6h6"></path>
      </svg>
    </button>

    <button id="fabTop" class="fab" type="button" aria-label="맨 위로">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V6"></path>
        <path d="M7 11l5-5 5 5"></path>
      </svg>
    </button>
  </div>

  <script>
    /* =========================
       ✅ iOS / iPhone / iPad 감지 → html(documentElement)에 클래스 부여
       - 중요: html에 붙여야 html font-size에 변수가 적용됩니다.
       ========================= */
    (function(){
      const ua = navigator.userAgent || '';
      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (!isIOS) return;

      const isIPad =
        /iPad/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
        (Math.max(screen.width, screen.height) >= 768);

      document.documentElement.classList.add(isIPad ? 'ios-ipad' : 'ios-iphone');
    })();

    /* =========
       DOM
       ========= */
    const $ = (s) => document.querySelector(s);

    const datePicker   = $('#datePicker');
    const listArea     = $('#listArea');
    const infiniteArea = $('#infiniteArea');

    const tabHouse    = $('#tabHouse');
    const tabNature   = $('#tabNature');

    const countText   = $('#countText');

    const overlay     = $('#overlay');
    const mTitleLine  = $('#mTitleLine');
    const mFields     = $('#mFields');
    const sheetOkBtn  = $('#sheetOkBtn');

    const refDateText = $('#refDateText');

    const ptrEl       = $('#pull-to-refresh');
    const statusEl    = $('#ptr-status');
    const ptrRing     = $('#ptrRing');
    const ptrProg     = $('#ptrProg');

    const fabTop      = $('#fabTop');
    const fabRefresh  = $('#fabRefresh');

    /* =========
       Utils
       ========= */
    const STORAGE_KEYS = { source: "uic_source_selected" };
    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    const TODAY = (() => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    })();

    const esc = (v) => String(v ?? '')
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'","&#039;");

    const normISO = (v) => {
      if (v == null) return '';
      const s = String(v).trim();
      if (!s) return '';
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
      m = s.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
      m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      return '';
    };

    const pickRetDate = (o) => o?.retDate ?? o?.retdate ?? o?.RETDATE ?? o?.RetDate ?? '';

    const toast = (msg, ms=1600) => {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), ms);
    };

    const fetchJson = async (url, bust=false) => {
      const u = bust ? `${url}${url.includes('?')?'&':'?'}_=${Date.now()}` : url;
      const res = await fetch(u, { cache: bust ? 'no-store' : 'default' });
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    };

    function updateRefDate(){
      const selected = datePicker?.value || TODAY;
      if (refDateText) refDateText.textContent = selected;
    }

    /* =========
       Data cache
       ========= */
    const dataCache = { house: null, nature: null };
    let cremMapCache = null;
    let funeralMapCache = null;

    const ensureData = async (key, force=false) => {
      if (dataCache[key] && !force) return dataCache[key];
      const raw = await fetchJson(SOURCES[key].url, force);
      dataCache[key] = Array.isArray(raw) ? raw : [];
      return dataCache[key];
    };

    const ensureCrem = async (force=false) => {
      if (cremMapCache && !force) return cremMapCache;
      const raw = await fetchJson("./data/crem.json", force);
      const arr = Array.isArray(raw) ? raw : [];
      const map = new Map();
      for (const r of arr){
        const id = String(r?.deadId ?? '').trim();
        if (id) map.set(id, r);
      }
      cremMapCache = map;
      return map;
    };

    const ensureFuneral = async (force=false) => {
      if (funeralMapCache && !force) return funeralMapCache;
      const raw = await fetchJson("./data/funeral.json", force);
      const arr = Array.isArray(raw) ? raw : [];
      const map = new Map();
      for (const r of arr){
        const id = String(r?.deadId ?? '').trim();
        if (!id) continue;
        map.set(id, {
          deadId: id,
          deadName: String(r?.deadName ?? '').trim(),
          dcGubun: String(r?.dcGubun ?? '').trim(),
        });
      }
      funeralMapCache = map;
      return map;
    };

    /* =========
       Domain helpers
       ========= */
    function formatEnsNo(val){
      if (val == null) return '-';
      const raw = String(val).trim();
      if (!raw) return '-';

      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart  = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));
        if (roomPart && numPart){
          const room = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
          const num  = numPart.replace(/\D/g,'').padStart(5,'0').slice(-5);
          return `${room}실 ${num}`;
        }
        if (roomPart){
          const tail = parts.slice().reverse().find(p => p.replace(/\D/g,'').length >= 5);
          if (tail){
            const room = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
            const num  = tail.replace(/\D/g,'').slice(-5).padStart(5,'0');
            return `${room}실 ${num}`;
          }
        }
      }

      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1) return `${String(m1[1]).padStart(2,'0')}실 ${String(m1[2]).padStart(5,'0')}`;

      let digits = raw.replace(/\D/g,'');
      if (!digits) return raw;
      if (digits.length === 6) digits = digits.padStart(7,'0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7) return `${digits.slice(0,2)}실 ${digits.slice(-5)}`;
      return raw;
    }

    const safeKey = (v) => String(v ?? '').trim();

    const ensMergeKey = (r) => {
      const ens = safeKey(r.ensNO ?? r.ensNo ?? r.ensno);
      if (ens) return `ENS:${ens}`;
      return `ALT:${safeKey(r.deadId)}|${safeKey(r.strDate)}|${safeKey(r.applname ?? r.applName)}|${safeKey(r.deadname ?? r.deadName ?? r.deceasedName)}`;
    };

    const mergeEnsRows = (rows) => {
      const map = new Map(), order = [];
      for (const r of rows){
        const key = ensMergeKey(r);
        if (!map.has(key)){
          map.set(key, {
            ensNO: safeKey(r.ensNO ?? r.ensNo ?? r.ensno) || '-',
            strDate: r.strDate ?? '-',
            deadname: r.deadname ?? r.deadName ?? r.deceasedName ?? '-',
            applname: r.applname ?? r.applName ?? '-',
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = String(r.deadname ?? r.deadName ?? r.deceasedName ?? '-');
          const an = String(r.applname ?? r.applName ?? '-');
          if (dn && dn !== '-' && !String(cur.deadname).split(' / ').includes(dn))
            cur.deadname = (cur.deadname && cur.deadname !== '-') ? `${cur.deadname} / ${dn}` : dn;
          if (an && an !== '-' && !String(cur.applname).split(' / ').includes(an))
            cur.applname = (cur.applname && cur.applname !== '-') ? `${cur.applname} / ${an}` : an;
          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;
          cur._raw.push(r);
        }
      }
      return order.map(k => map.get(k));
    };

    const mergeCoupleRows = (rows) => {
      const map = new Map(), order = [];
      for (const r of rows){
        const natNo = safeKey(r.natNo);
        const appl  = safeKey(r.applName);
        const key = `${natNo}||${appl}`;
        if (!map.has(key)){
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: String(r.deadName ?? r.deadname ?? '-'),
            applName: r.applName ?? '-',
            natDate: String(r.natDate ?? '-'),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = String(r.deadName ?? r.deadname ?? '-');
          if (dn && dn !== '-' && !cur.deadName.split(' / ').includes(dn))
            cur.deadName = (cur.deadName && cur.deadName !== '-') ? `${cur.deadName} / ${dn}` : dn;
          const dt = String(r.natDate ?? '-');
          if (dt && dt !== '-' && !cur.natDate.split(', ').includes(dt))
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${dt}` : dt;
          cur._raw.push(r);
        }
      }
      return order.map(k => map.get(k));
    };

    const itemId = (src, item) => src === 'house'
      ? String(item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-')
      : String(item?.natNo ?? '-');

    const recvKey = (src, id) => `recv_${src}_${id}`;
    const recvPending = (src) => (src === 'nature') ? '안장대기' : '안치대기';
    const recvDone    = (src) => (src === 'nature') ? '안장완료' : '안치완료';

    const getRecv = (src, id) => {
      const v = localStorage.getItem(recvKey(src, id));
      if (!v) return recvPending(src);
      if (src !== 'nature' && v === '접수') return '안치대기';
      if (src === 'nature' && v === '안치대기') return '안장대기';
      if (src === 'nature' && v === '안치완료') return '안장완료';
      return v;
    };
    const setRecv = (src, id, v) => localStorage.setItem(recvKey(src, id), v);

    const isRetOn = (item, iso) => normISO(pickRetDate(item)) === iso;

    const retKey = (id) => `ret_house_${id}`;
    const getRet = (id) => {
      const v = localStorage.getItem(retKey(id));
      if (!v) return '반출대기';
      if (v === '반출') return '반출대기';
      return v;
    };
    const setRet = (id, v) => localStorage.setItem(retKey(id), v);

    const leftCls = (src, mode, status) => {
      if (mode === 'ret') return (status === '반출완료') ? 'retDone' : 'ret';
      return (status === recvDone(src)) ? 'done' : 'recv';
    };

    const pad2 = (n) => String(n ?? '').trim().padStart(2,'0').slice(-2) || '00';
    const fmtTime = (v) => String(v ?? '').trim();

    const cremObj = (deadId, cremMap) => {
      const did = String(deadId ?? '').trim();
      const rec = did ? cremMap.get(did) : null;
      if (!rec) return { type:'pay', chasu:0, start:'선결제', end:'선결제', text:'선결제' };

      const chasuRaw = rec?.burnChasu;
      const chasuNum = parseInt(pad2(chasuRaw), 10);
      const safeChasu = isNaN(chasuNum) ? 0 : chasuNum;

      const st = fmtTime(rec?.burnStrTime);
      const en = fmtTime(rec?.burnEndTime);

      if (!st){
        const label = `${pad2(chasuRaw)}회차, 화장접수`;
        return { type:'recv', chasu:safeChasu, start:'화장접수', end:'', text: label };
      }

      if (st && !en){
        const chLabel = safeChasu > 0 ? `${pad2(chasuRaw)}회차` : `회차미정`;
        return { type:'info', chasu:safeChasu, start:st, end:'', text:`${chLabel}, 화장시작: ${st}, 화장중` };
      }

      const chLabel = safeChasu > 0 ? `${pad2(chasuRaw)}회차` : `회차미정`;
      return { type:'info', chasu:safeChasu, start:st, end:en, text:`${chLabel}, 화장시작: ${st}, 화장종료: ${en}` };
    };

    const uniqDeadIds = (item) => {
      const raws = Array.isArray(item?._raw) ? item._raw : [item];
      const seen = new Set(), ids = [];
      for (const r of raws){
        const did = String(r?.deadId ?? '').trim();
        if (!did || seen.has(did)) continue;
        seen.add(did); ids.push(did);
      }
      return ids;
    };

    const chasuKey = (item, cremMap) => {
      const ids = uniqDeadIds(item);
      if (!ids.length) return 0;
      const nums = ids.map(id => cremObj(id, cremMap).chasu).filter(n => Number.isFinite(n));
      const pos = nums.filter(n => n > 0);
      return pos.length ? Math.min(...pos) : 0;
    };

    const cremLinesHTML = (item, cremMap, mode) => {
      if (mode === 'ret' || !cremMap) return '';
      const ids = uniqDeadIds(item);
      if (!ids.length) return `<div class="cremWrap"><div class="cremLine">선결제</div></div>`;
      const objs = ids.map(id => cremObj(id, cremMap));
      const allPay = objs.length && objs.every(o => o.type === 'pay');
      if (allPay) return `<div class="cremWrap"><div class="cremLine">선결제</div></div>`;
      return `<div class="cremWrap">${objs.map(o => `<div class="cremLine">${esc(o.text)}</div>`).join('')}</div>`;
    };

    const cremTimes = (item, cremMap) => {
      if (!cremMap) return null;
      const ids = uniqDeadIds(item);

      if (!ids.length){
        return { a:'화장시작: 선결제', b:'화장종료: 선결제' };
      }

      const raws = ids.map(id => {
        const did = String(id ?? '').trim();
        const rec = did ? cremMap.get(did) : null;
        const st = fmtTime(rec?.burnStrTime);
        const en = fmtTime(rec?.burnEndTime);
        if (!rec) return { st:'선결제', en:'선결제' };
        return { st: st || '화장접수', en: en || '-' };
      });

      const starts = raws.map(x => x.st);
      const ends   = raws.map(x => x.en);

      return { a:`화장시작: ${starts.join(' / ')}`, b:`화장종료: ${ends.join(' / ')}` };
    };

    const kv = (k, v) => `
      <div class="kv">
        <div class="k">${esc(k)}</div>
        <div class="v">${esc(v)}</div>
      </div>
    `;

    const kvLines = (k, lines) => {
      const arr = (Array.isArray(lines) ? lines : []).map(esc).filter(Boolean);
      if (!arr.length) return '';
      return `
        <div class="kv">
          <div class="k">${esc(k)}</div>
          <div class="v">${arr.join('<br>')}</div>
        </div>
      `;
    };

    /* ✅ 배지 판별 */
    const normNameKey = (s) => String(s ?? '').replace(/\s+/g,'').trim();
    const nameKeySetFromDisplay = (displayName) => {
      const parts = String(displayName ?? '')
        .split('/')
        .map(x => normNameKey(x));
      const set = new Set();
      for (const p of parts){
        if (p) set.add(p);
      }
      return set;
    };

    const funeralBadgeLabelForItem = (item, displayName, funeralMap) => {
      if (!funeralMap) return null;

      const ids = uniqDeadIds(item);
      if (!ids.length) return null;

      const nameSet = nameKeySetFromDisplay(displayName);

      let hasSelf = false;
      for (const id of ids){
        const rec = funeralMap.get(String(id ?? '').trim());
        if (!rec) continue;

        const recNameKey = normNameKey(rec.deadName);
        if (!recNameKey) continue;

        if (!nameSet.has(recNameKey)) continue;

        if (String(rec.dcGubun ?? '').trim() === 'TCM1200099'){
          return '무연고';
        }
        hasSelf = true;
      }
      return hasSelf ? '자체' : null;
    };

    const badgeHTML = (label) => {
      if (!label) return '';
      const cls = (label === '무연고') ? 'tag orphan' : 'tag self';
      return `<span class="${cls}">${esc(label)}</span>`;
    };

    /* =========
       State
       ========= */
    let currentSource = 'house';
    let currentSelectedDate = TODAY;
    let currentDisplayData = [];
    let loadToken = 0;
    let isRefreshing = false;

    const calcCounts = (src, data, iso) => {
      const dateKey = SOURCES[src].dateKey;
      if (src === 'house'){
        const rows = (Array.isArray(data)?data:[]).filter(x => {
          const s = String(x?.[dateKey] ?? '');
          const r = normISO(pickRetDate(x));
          return (s === iso) || (r === iso);
        });
        const merged = mergeEnsRows(rows);
        let recv = 0, ret = 0;
        for (const it of merged){
          const isR = isRetOn(it, iso);
          const isS = String(it.strDate ?? '') === iso;
          if (isR) ret++;
          else if (isS) recv++;
        }
        return { recv, ret };
      }
      const todays = (Array.isArray(data)?data:[]).filter(x => String(x?.[dateKey] ?? '') === iso);
      return { recv: mergeCoupleRows(todays).length, ret: 0 };
    };

    const sortStable = (arr, iso, cremMap) => {
      const clone = arr.slice();
      clone.forEach((it, i) => { it._pos = (it._pos ?? i); });

      clone.sort((a, b) => {
        const isHouse = (currentSource === 'house');
        const retA = isHouse && isRetOn(a, iso);
        const retB = isHouse && isRetOn(b, iso);

        const aId = itemId(currentSource, a);
        const bId = itemId(currentSource, b);

        const aRetDone = retA ? (getRet(aId) === '반출완료') : false;
        const bRetDone = retB ? (getRet(bId) === '반출완료') : false;

        const grpA = retA ? (aRetDone ? 2 : 0) : 1;
        const grpB = retB ? (bRetDone ? 2 : 0) : 1;
        if (grpA !== grpB) return grpA - grpB;

        if (grpA === 1 && grpB === 1 && cremMap){
          const ca = chasuKey(a, cremMap);
          const cb = chasuKey(b, cremMap);
          if (ca !== cb) return ca - cb;
        }

        return (a._pos ?? 0) - (b._pos ?? 0);
      });

      return clone;
    };

    /* =========
       Page size auto
       ========= */
    const computePageSize = () => {
      const w = Math.min(window.innerWidth || 0, window.screen?.width || 0) || 360;
      if (w <= 390) return 28;
      if (w <= 430) return 32;
      return 40;
    };

    /* =========
       Infinite scroll
       ========= */
    let pageSize = computePageSize();
    let renderedCount = 0;
    let observer = null;
    let lastCremMapForRender = null;
    let lastFuneralMapForRender = null;

    const resetInfinite = () => {
      renderedCount = 0;
      infiniteArea.innerHTML = '';
      if (observer) { observer.disconnect(); observer = null; }
    };

    const ensureObserver = () => {
      const sentinel = document.getElementById('sentinel');
      if (!sentinel) return;

      if (observer) observer.disconnect();

      observer = new IntersectionObserver((entries) => {
        const ent = entries[0];
        if (!ent || !ent.isIntersecting) return;
        renderNextPage();
      }, {
        root: null,
        rootMargin: '900px 0px',
        threshold: 0.01
      });

      observer.observe(sentinel);
    };

    const setInfiniteUI = ({ mode, shown, total }) => {
      if (mode === 'empty'){
        infiniteArea.innerHTML = '';
        return;
      }

      let msg = '';
      if (mode === 'loading'){
        msg = `<div class="infCard">불러오는 중…</div>`;
      } else if (mode === 'more'){
        msg = `<div class="infCard"><strong>${shown.toLocaleString()}</strong> / ${total.toLocaleString()}건 표시 중 · 아래로 스크롤하면 더 불러옵니다</div>`;
      } else if (mode === 'end'){
        msg = `<div class="infCard">전체 <strong>${total.toLocaleString()}</strong>건 표시 완료</div>`;
      }

      infiniteArea.innerHTML = `
        <div class="inf">
          ${msg}
          <div id="sentinel"></div>
        </div>
      `;
    };

    const rowHTML = (item, idx, selected, cremMap, funeralMap) => {
      const sid = itemId(currentSource, item);
      const mode = (currentSource === 'house' && isRetOn(item, selected)) ? 'ret' : 'recv';

      let status = '';
      let isOn = false;
      let label = '';
      let swCls = 'sw';

      if (mode === 'ret'){
        status = getRet(sid);
        isOn = (status === '반출완료');
        label = isOn ? '반출완료' : '반출대기';
        swCls = isOn ? 'sw on' : 'sw';
      } else {
        status = getRecv(currentSource, sid);
        const done = recvDone(currentSource);
        const pending = recvPending(currentSource);
        isOn = (status === done);
        label = isOn ? done : pending;
        swCls = isOn ? 'sw on' : 'sw';
      }

      const displayId = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      const displayName = (currentSource === 'house')
        ? String(item.deadname ?? item.deadName ?? item.deceasedName ?? '-')
        : String(item.deadName ?? '-');

      /* ✅ 반출(ret) 건은 배지 표시 금지 */
      const badgeLabel = (mode === 'ret') ? null : funeralBadgeLabelForItem(item, displayName, funeralMap);
      const tag = badgeHTML(badgeLabel);

      return `
        <li>
          <div class="row ${leftCls(currentSource, mode, status)}">
            <div class="barL"></div>
            <div class="rowR">
              <div class="rowTop">
                <button class="mainBtn" type="button" data-open="${idx}" aria-label="상세 보기">
                  <div class="main">
                    <div class="no">${esc(displayId)}</div>
                    <div class="nameLine">
                      <div class="name">${esc(displayName)}</div>
                      ${tag}
                    </div>
                  </div>
                </button>
                <div class="toggle" role="switch" aria-checked="${isOn ? 'true' : 'false'}" data-toggle="${idx}">
                  <div class="${swCls}"></div>
                  <span>${esc(label)}</span>
                </div>
              </div>
              ${cremLinesHTML(item, cremMap, mode)}
            </div>
          </div>
        </li>
      `;
    };

    const updateHeadShown = (shown, total) => {
      const badge = document.getElementById('headBadge');
      if (badge) badge.textContent = `${shown.toLocaleString()} / ${total.toLocaleString()}`;
    };

    const renderNextPage = () => {
      const selected = datePicker.value || TODAY;
      const total = currentDisplayData.length;
      if (!total) return;

      const cremMap = lastCremMapForRender;
      const funeralMap = lastFuneralMapForRender;

      const ul = document.getElementById('listUL');
      if (!ul) return;

      if (renderedCount >= total){
        updateHeadShown(total, total);
        setInfiniteUI({ mode: 'end', shown: total, total });
        if (observer) observer.disconnect();
        return;
      }

      const from = renderedCount;
      const to = Math.min(renderedCount + pageSize, total);

      let chunk = '';
      for (let i = from; i < to; i++){
        chunk += rowHTML(currentDisplayData[i], i, selected, cremMap, funeralMap);
      }
      ul.insertAdjacentHTML('beforeend', chunk);

      renderedCount = to;

      updateHeadShown(renderedCount, total);

      if (renderedCount < total){
        setInfiniteUI({ mode: 'more', shown: renderedCount, total });
        ensureObserver();
      } else {
        setInfiniteUI({ mode: 'end', shown: total, total });
        if (observer) observer.disconnect();
      }
    };

    /* =========
       Load + Render
       ========= */
    async function load(force=false){
      const myToken = ++loadToken;

      const selected = datePicker.value || TODAY;
      currentSelectedDate = selected;

      updateRefDate();

      const showCrem = (selected === TODAY);
      let cremMap = null;
      let funeralMap = null;

      try{
        funeralMap = await ensureFuneral(force);
        if (myToken !== loadToken) return;

        if (showCrem){
          cremMap = await ensureCrem(force);
          if (myToken !== loadToken) return;
        }

        const data = await ensureData(currentSource, force);
        if (myToken !== loadToken) return;

        const c = calcCounts(currentSource, data, selected);
        countText.textContent = (currentSource === 'house')
          ? `안치 ${c.recv}건 · 반출 ${c.ret}건`
          : `안장 ${c.recv}건`;

        const dateKey = SOURCES[currentSource].dateKey;
        let filtered = [];

        if (currentSource === 'house'){
          filtered = data.filter(x => {
            const s = String(x?.[dateKey] ?? '');
            const r = normISO(pickRetDate(x));
            return (s === selected) || (r === selected);
          });
        } else {
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selected);
        }

        let display = filtered;
        if (currentSource === 'house') display = mergeEnsRows(filtered);
        if (currentSource === 'nature') display = mergeCoupleRows(filtered);

        display.forEach((it, i) => it._pos = i);
        display = sortStable(display, selected, cremMap);
        currentDisplayData = display;

        if (!display.length){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          resetInfinite();
          return;
        }

        resetInfinite();
        lastCremMapForRender = cremMap;
        lastFuneralMapForRender = funeralMap;

        listArea.innerHTML = `
          <div class="list">
            <div class="list-head">
              <div class="hint">${esc(SOURCES[currentSource].label)} 접수목록</div>
              <div class="badge" id="headBadge">0 / ${display.length.toLocaleString()}</div>
            </div>
            <ul id="listUL"></ul>
          </div>
        `;

        setInfiniteUI({ mode: 'loading', shown: 0, total: display.length });
        renderNextPage();

      } catch (err){
        listArea.innerHTML = `<div class="no-data">오류: ${esc(err.message)}</div>`;
        resetInfinite();
      }
    }

    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      const selected = datePicker.value || TODAY;
      const showCrem = (selected === TODAY);
      const cremMap = showCrem ? cremMapCache : null;

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      mTitleLine.textContent = `${SOURCES[currentSource].label} · ${headerNo}`;

      let html = '';
      const isRetModal = (currentSource === 'house' && isRetOn(item, currentSelectedDate));

      if (currentSource === 'house'){
        html += kv('안치일자', item.strDate ?? '-');
        html += kv('고인명', item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
        html += kv('신청자', item.applname ?? item.applName ?? '-');
        const rdISO = normISO(pickRetDate(item));
        const rdRaw = pickRetDate(item);
        if (rdISO) html += kv('반출일자', String(rdRaw ?? rdISO));
      } else {
        html += kv('안치일자', item.natDate ?? '-');
        html += kv('고인명', item.deadName ?? '-');
        html += kv('신청자', item.applName ?? '-');
      }

      if (!isRetModal){
        const t = cremTimes(item, cremMap);
        if (t) html += kvLines('화장시간', [t.a, t.b]);
      }

      mFields.innerHTML = html;

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
    }

    async function doRefresh(fromUI=true){
      if (isRefreshing) return;
      isRefreshing = true;

      try{
        dataCache.house = null;
        dataCache.nature = null;
        cremMapCache = null;
        funeralMapCache = null;

        await load(true);
        if (fromUI) toast('새로고침 완료', 1400);
      } finally {
        isRefreshing = false;
      }
    }

    function setSource(src){
      currentSource = src;
      localStorage.setItem(STORAGE_KEYS.source, src);
      tabHouse.classList.toggle('active', src === 'house');
      tabNature.classList.toggle('active', src === 'nature');
      load();
    }

    tabHouse.addEventListener('click', () => setSource('house'));
    tabNature.addEventListener('click', () => setSource('nature'));

    datePicker.addEventListener('change', () => {
      updateRefDate();
      load();
    });

    sheetOkBtn.addEventListener('click', closeSheet);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    listArea.addEventListener('click', (e) => {
      const openBtn = e.target.closest('[data-open]');
      if (openBtn){
        openSheet(parseInt(openBtn.getAttribute('data-open'), 10));
        return;
      }
      const tg = e.target.closest('[data-toggle]');
      if (!tg) return;

      e.preventDefault();
      e.stopPropagation();

      const idx = parseInt(tg.getAttribute('data-toggle'), 10);
      const item = currentDisplayData[idx];
      if (!item) return;

      const sid = itemId(currentSource, item);
      const mode = (currentSource === 'house' && isRetOn(item, currentSelectedDate)) ? 'ret' : 'recv';

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      if (mode === 'ret'){
        const cur = getRet(sid);
        const next = (cur === '반출완료') ? '반출대기' : '반출완료';
        setRet(sid, next);
        toast(`${headerNo} : ${next}`, 2200);
      } else {
        const done = recvDone(currentSource);
        const pending = recvPending(currentSource);
        const cur = getRecv(currentSource, sid);
        const next = (cur === done) ? pending : done;
        setRecv(currentSource, sid, next);
        toast(`${headerNo} : ${next}`, 2200);
      }

      load();
    });

    /* =========
       FAB show/hide
       ========= */
    function updateFAB(){
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const show = y > 220;
      fabTop.classList.toggle('show', show);
      fabRefresh.classList.toggle('show', true);
    }

    fabTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    fabRefresh.addEventListener('click', async () => {
      await doRefresh(true);
    });

    window.addEventListener('scroll', updateFAB, { passive:true });

    /* =========
       PTR (top only)
       ========= */
    let startY = 0, pulling = false, pullDist = 0;
    const PTR_MAX = 64, PTR_TH = 60, DAMP = 0.52;

    const R = 9;
    const CIRC = 2 * Math.PI * R;

    const atTop = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      return y <= 0;
    };

    const canPTR = () => atTop() && !isRefreshing && !overlay.classList.contains('show');

    const setPullProgress = (ratio) => {
      const p = Math.max(0, Math.min(ratio, 1));
      ptrProg.style.strokeDasharray = String(CIRC.toFixed(2));
      ptrProg.style.strokeDashoffset = String((CIRC * (1 - p)).toFixed(2));
    };

    const setPullUI = (dist) => {
      const d = Math.max(0, Math.min(dist, PTR_MAX));
      pullDist = d;

      if (d > 0){
        ptrEl.classList.add('visible');
        ptrEl.setAttribute('aria-hidden', 'false');
      }

      const p = d / PTR_TH;
      setPullProgress(p);

      statusEl.textContent = (d >= PTR_TH) ? '놓아서 새로고침' : '당겨서 새로고침';
    };

    const resetPullUI = () => {
      ptrEl.classList.remove('visible');
      ptrEl.setAttribute('aria-hidden', 'true');
      pullDist = 0;

      setPullProgress(0);
      ptrRing.classList.remove('loading');
      statusEl.textContent = '당겨서 새로고침';
    };

    document.addEventListener('touchstart', (e) => {
      if (!canPTR()) return;
      if (e.touches.length !== 1) return;
      startY = e.touches[0].clientY;
      pulling = true;
      ptrRing.classList.remove('loading');
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!pulling || !canPTR()) return;
      if (e.touches.length !== 1) return;

      const diff = (e.touches[0].clientY - startY) * DAMP;
      if (diff <= 0) return;

      e.preventDefault();
      setPullUI(diff);
    }, { passive: false });

    document.addEventListener('touchend', async () => {
      if (!pulling) return;
      pulling = false;

      if (pullDist >= PTR_TH){
        statusEl.textContent = '새로고침 중...';
        ptrRing.classList.add('loading');
        ptrEl.classList.add('visible');
        ptrEl.setAttribute('aria-hidden', 'false');

        try{
          await doRefresh(false);
          toast('새로고침 완료', 1400);
        } finally {
          resetPullUI();
          startY = 0;
        }
      } else {
        resetPullUI();
        startY = 0;
      }
    }, { passive: true });

    /* =========
       PageSize recalculation
       ========= */
    const onResize = () => {
      const next = computePageSize();
      if (next !== pageSize){
        pageSize = next;
      }
    };
    window.addEventListener('resize', onResize, { passive:true });
    window.addEventListener('orientationchange', onResize, { passive:true });

    /* =========
       Init
       ========= */
    window.addEventListener('load', () => {
      pageSize = computePageSize();

      const saved = localStorage.getItem(STORAGE_KEYS.source);
      setSource((saved === 'nature' || saved === 'house') ? saved : 'house');

      datePicker.value = TODAY;
      updateRefDate();

      setPullProgress(0);
      load();

      updateFAB();
    });
  </script>
</body>
</html>
