<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=()" />
  <title>울산하늘공원 접수 현황</title>

  <link rel="icon" type="image/png" href="./images/symbol.png">
  <link rel="apple-touch-icon" href="./images/symbol.png">

  <style>
    :root{
      --bg:#f4f6f9;
      --panel:#ffffff;
      --line:#d9e0ea;
      --line2:#c9d2df;
      --text:#1f2a37;
      --muted:#6b7280;
      --primary:#1f4e79;
      --shadow: 0 8px 24px rgba(15,23,42,0.08);
      --shadow2: 0 14px 40px rgba(15,23,42,0.10);
      --radius: 14px;

      --outerPad: 12px;

      --fabSize: 54px;
      --fabGap: 10px;
      --fabRight: 14px;
      --fabBottom: 14px;

      --fs-xxs: clamp(.68rem, 2.3vw, .78rem);
      --fs-xs : clamp(.78rem, 2.6vw, .88rem);
      --fs-sm : clamp(.86rem, 2.9vw, .96rem);
      --fs-md : clamp(.92rem, 3.0vw, 1.02rem);
      --fs-lg : clamp(.98rem, 3.2vw, 1.10rem);
      --fs-xl : clamp(1.18rem, 4.2vw, 1.48rem);

      --lh-tight: 1.14;
      --lh-base : 1.22;
      --lh-loose: 1.30;

      --ls-tight: -0.015em;
      --ls-base : -0.01em;

      --scale-font: 1;
      --scale-ui  : 1;
      --scale-lh  : 1;

      --pad-xxs: 6px;
      --pad-xs : 8px;
      --pad-sm : 10px;
      --pad-md : 12px;

      --gap-xs : 6px;
      --gap-sm : 8px;
      --gap-md : 10px;

      --row-pad-y: 10px;
      --row-pad-x: 12px;

      --ptrMax: 88px;
      --ptrTrigger: 64px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body{
      height:100%;
    }

    html{
      font-size: calc(clamp(14px, 3.6vw, 16px) * var(--scale-font));
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    html.ios-iphone{
      --scale-font: 1.18;
      --scale-ui  : 1.10;
      --scale-lh  : 1.08;
    }

    html.ios-ipad{
      --scale-font: 1.14;
      --scale-ui  : 1.08;
      --scale-lh  : 1.06;
    }

    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: calc(var(--outerPad) * var(--scale-ui));
      padding-bottom: calc((var(--outerPad) * var(--scale-ui)) + 18px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      text-rendering: optimizeLegibility;
      transition: transform .16s ease;
    }

    .ptr{
      position: fixed;
      left: 50%;
      top: calc(8px + env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 12000;
      pointer-events: none;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
    }

    .ptr.show{
      opacity: 1;
    }

    .ptrCard{
      display:flex;
      align-items:center;
      justify-content:center;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(217,224,234,.95);
      box-shadow: 0 8px 20px rgba(15,23,42,0.10);
      overflow: hidden;
      position: relative;
    }

    .ptrProgress{
      width: 22px;
      height: 22px;
      transform: rotate(-90deg);
    }

    .ptrTrack{
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 2.6;
    }

    .ptrFill{
      fill: none;
      stroke: #1f4e79;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-dasharray: 62.83;
      stroke-dashoffset: 62.83;
      transition: stroke-dashoffset .08s linear;
    }

    .ptrSpinner{
      position:absolute;
      inset: 0;
      margin:auto;
      width: 18px;
      height: 18px;
      border-radius:50%;
      border:2.2px solid #dbe4ef;
      border-top-color:#1f4e79;
      animation:spin .8s linear infinite;
      display:none;
      background: transparent;
    }

    .ptr.refreshing .ptrProgress{
      display:none;
    }

    .ptr.refreshing .ptrSpinner{
      display:block;
    }

    .app{
      max-width: 980px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      content-visibility: auto;
      contain-intrinsic-size: 1200px;
    }

    .top{
      position: sticky;
      top: calc((var(--outerPad) * var(--scale-ui)) * -1);
      z-index: 50;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      border-bottom: 1px solid var(--line);
      margin: calc((var(--outerPad) * var(--scale-ui)) * -1);
      margin-bottom: 0;
      padding: calc(var(--outerPad) * var(--scale-ui));
    }

    .header{
      padding: calc(12px * var(--scale-ui)) calc(14px * var(--scale-ui)) calc(8px * var(--scale-ui));
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: calc(10px * var(--scale-ui));
      flex-wrap: wrap;
    }

    .brand, .rightInfo, .rowR, .rowTop, .main, .field .v{
      min-width: 0;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap: calc(4px * var(--scale-ui));
      min-width: 0;
      flex: 1 1 auto;
    }

    .brand h1{
      margin:0;
      font-weight: 950;
      letter-spacing: var(--ls-tight);
      color: #0f172a;
      word-break: keep-all;
      font-size: var(--fs-xl);
      line-height: calc(1.18 * var(--scale-lh));
    }

    .rightInfo{
      display:flex;
      align-items:flex-start;
      justify-content:flex-end;
      flex: 0 0 auto;
      margin-left: auto;
      padding-top: calc(2px * var(--scale-ui));
      min-width: 0;
    }

    .refDate{
      font-weight: 900;
      font-size: var(--fs-sm);
      letter-spacing: var(--ls-base);
      color: rgba(15,23,42,0.56);
      white-space: nowrap;
      line-height: var(--lh-tight);
    }

    .toolbar{
      padding: calc(8px * var(--scale-ui)) calc(14px * var(--scale-ui)) calc(12px * var(--scale-ui));
      display:flex;
      gap: calc(10px * var(--scale-ui));
      flex-wrap: wrap;
      align-items: stretch;
    }

    .seg{
      display:flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      min-width: 320px;
      flex: 0 0 auto;
    }

    .seg button{
      border:0;
      background: transparent;
      padding: calc(10px * var(--scale-ui)) calc(10px * var(--scale-ui));
      border-radius: 10px;
      font-weight: 950;
      color: rgba(31,42,55,.75);
      cursor: pointer;
      min-height: calc(42px * var(--scale-ui));
      flex: 1;
      white-space: nowrap;
      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }

    .seg button.active{
      background: linear-gradient(180deg, rgba(31,78,121,.14), rgba(47,111,173,.10));
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(31,78,121,.25);
    }

    .seg button:disabled{
      opacity:.6;
      cursor:default;
    }

    .group{
      flex: 1 1 520px;
      min-width: 320px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: calc(10px * var(--scale-ui));
      align-items: stretch;
    }

    .field{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: calc(9px * var(--scale-ui)) calc(11px * var(--scale-ui));
      display:flex;
      flex-direction:column;
      gap: calc(6px * var(--scale-ui));
      min-height: calc(60px * var(--scale-ui));
      min-width: 0;
    }

    .field .k{
      color: var(--muted);
      font-weight: 900;
      font-size: var(--fs-xs);
      letter-spacing: var(--ls-base);
      white-space: nowrap;
      line-height: var(--lh-tight);
    }

    .field .v{
      display:flex;
      align-items:center;
      gap: calc(8px * var(--scale-ui));
      font-weight: 950;
      color: rgba(31,42,55,.92);
      min-width: 0;
      line-height: var(--lh-tight);
      flex: 1;
      min-height: calc(38px * var(--scale-ui));
    }

    .field input[type="date"]{
      width: 100%;
      border: 0;
      outline: none;
      box-shadow: none;
      background: transparent;
      border-radius: 0;
      padding: 0;
      font-weight: 950;
      color: var(--text);
      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
      -webkit-appearance:none;
      appearance:none;
      min-height: calc(38px * var(--scale-ui));
      min-width: 0;
      display:flex;
      align-items:center;
    }

    .field input[type="date"]:disabled{
      opacity:.6;
      cursor:default;
    }

    .countCenter{
      width: 100%;
      text-align: center;
      font-weight: 950;
      color: #0f172a;
      letter-spacing: var(--ls-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: var(--lh-tight);
      padding: 0;
      font-size: var(--fs-md);
      min-width: 0;
      min-height: calc(38px * var(--scale-ui));
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .content{
      padding: calc(10px * var(--scale-ui)) calc(14px * var(--scale-ui)) calc(14px * var(--scale-ui));
      background: linear-gradient(180deg, #ffffff, #f6f8fb);
    }

    .list{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      content-visibility: auto;
      contain-intrinsic-size: 900px;
    }

    .list-head{
      padding: calc(9px * var(--scale-ui)) calc(12px * var(--scale-ui));
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap: calc(10px * var(--scale-ui));
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      flex-wrap: wrap;
    }

    .list-head .hint{
      font-weight: 950;
      color: #0f172a;
      display:flex;
      align-items:center;
      gap: calc(10px * var(--scale-ui));
      white-space: nowrap;
      font-size: var(--fs-md);
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
    }

    .nameLine{
      display:flex;
      align-items:center;
      gap: calc(4px * var(--scale-ui));
      min-width: 0;
      flex-wrap: nowrap;
    }

    .nameWrap{
      display: inline-flex;
      align-items: center;
      gap: calc(3px * var(--scale-ui));
      min-width: 0;
      max-width: 100%;
      flex: 0 1 auto;
      width: fit-content;
      flex-wrap: wrap;
    }

    .nameText{
      font-weight: 950;
      color: rgba(15,23,42,.92);
      font-size: var(--fs-lg);
      line-height: calc(1.18 * var(--scale-lh));
      letter-spacing: var(--ls-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      max-width: 100%;
      flex: 0 1 auto;
    }

    .tag{
      flex: 0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: calc(2px * var(--scale-ui)) calc(6px * var(--scale-ui));
      border-radius: 999px;
      border: 1px solid rgba(217,224,234,.95);
      background: rgba(255,255,255,.92);
      font-weight: 950;
      font-size: var(--fs-xxs);
      line-height: 1;
      letter-spacing: var(--ls-base);
      color: rgba(15,23,42,.78);
      white-space: nowrap;
      vertical-align: middle;
    }

    .tag.self{
      border-color: rgba(31,78,121,.28);
      background: linear-gradient(180deg, rgba(31,78,121,.12), rgba(47,111,173,.08));
      color: rgba(31,78,121,.95);
    }

    .tag.orphan{
      border-color: rgba(180,83,9,.28);
      background: linear-gradient(180deg, rgba(180,83,9,.14), rgba(245,158,11,.08));
      color: rgba(180,83,9,.95);
    }

    .tag.objt{
      border-color: rgba(15,23,42,.16);
      background: linear-gradient(180deg, rgba(15,23,42,.08), rgba(15,23,42,.04));
      color: rgba(15,23,42,.88);
      margin-right: 0;
    }

    .tag.objt.body{
      border-color: rgba(185,28,28,.28);
      background: linear-gradient(180deg, rgba(220,38,38,.14), rgba(239,68,68,.08));
      color: rgba(153,27,27,.96);
    }

    .tag.objt.open{
      border-color: rgba(30,64,175,.28);
      background: linear-gradient(180deg, rgba(59,130,246,.14), rgba(96,165,250,.08));
      color: rgba(30,64,175,.96);
    }

    .tag.objt.still{
      border-color: rgba(67,56,202,.28);
      background: linear-gradient(180deg, rgba(99,102,241,.14), rgba(129,140,248,.08));
      color: rgba(67,56,202,.96);
    }

    ul{
      list-style:none;
      padding:0;
      margin:0;
    }

    .row{
      display:grid;
      grid-template-columns: 10px 1fr;
      gap: calc(var(--gap-sm) * var(--scale-ui));
      padding: calc(var(--row-pad-y) * var(--scale-ui)) calc(var(--row-pad-x) * var(--scale-ui));
      border-bottom: 1px solid var(--line);
      align-items: stretch;
      background: #fff;
    }

    .row:last-child{
      border-bottom:0;
    }

    .barL{
      width: 10px;
      border-radius: 6px;
      background: #e2e8f0;
      height: 100%;
      align-self: stretch;
    }

    .row.recv .barL{ background: rgba(31,78,121,.35); }
    .row.done .barL{ background: rgba(46,125,50,.45); }
    .row.ret .barL{ background: rgba(180,83,9,.40); }
    .row.retDone .barL{ background: rgba(126,34,206,.48); }
    .row.cremRecv .barL{ background: rgba(100,116,139,.45); }
    .row.cremProgress .barL{ background: rgba(220,38,38,.52); }
    .row.cremDone .barL{ background: rgba(22,163,74,.48); }

    .rowR{
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap: calc(6px * var(--scale-ui));
    }

    .rowTop{
      display:flex;
      gap: calc(10px * var(--scale-ui));
      align-items:flex-start;
      justify-content:space-between;
      min-width: 0;
      width: 100%;
    }

    .mainBtn{
      border:0;
      background: transparent;
      text-align:left;
      padding: 0;
      margin: 0;
      cursor: pointer;
      min-width: 0;
      flex: 1 1 auto;
      width: 100%;
      max-width: 100%;
    }

    .mainBtn:active{
      background: rgba(31,78,121,.06);
    }

    .main{
      display:flex;
      flex-direction:column;
      gap: calc(5px * var(--scale-ui));
      min-width: 0;
      width: 100%;
    }

    .no{
      font-weight: 950;
      color: #0f172a;
      font-size: var(--fs-md);
      white-space: nowrap;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-base);
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .statusPill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height: calc(28px * var(--scale-ui));
      padding: calc(4px * var(--scale-ui)) calc(8px * var(--scale-ui));
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      white-space: nowrap;
      font-weight: 950;
      font-size: clamp(.70rem, 2.4vw, .78rem);
      color: rgba(31,42,55,.78);
      letter-spacing: var(--ls-base);
      flex: 0 0 auto;
      margin-top: 0;
      margin-left: auto;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
    }

    .statusPill.done{
      border-color: rgba(46,125,50,.22);
      background: linear-gradient(180deg, rgba(46,125,50,.14), rgba(46,125,50,.08));
      color: rgba(46,125,50,.95);
    }

    .statusPill.retDone{
      border-color: rgba(126,34,206,.22);
      background: linear-gradient(180deg, rgba(126,34,206,.14), rgba(126,34,206,.08));
      color: rgba(126,34,206,.95);
    }

    .statusPill.ret{
      border-color: rgba(180,83,9,.22);
      background: linear-gradient(180deg, rgba(180,83,9,.14), rgba(180,83,9,.08));
      color: rgba(180,83,9,.95);
    }

    .cremWrap{
      display:flex;
      flex-direction:column;
      gap: calc(6px * var(--scale-ui));
      min-width:0;
      width:100%;
      overflow-x: auto;
      overflow-y: visible;
    }

    .cremLine{
      display:grid;
      grid-template-columns: auto auto;
      align-items:center;
      width:max-content;
      min-width:100%;
      column-gap: 12px;
      row-gap: 0;
      min-width:0;
      font-weight: 900;
      font-size: var(--fs-md);
      color: rgba(31,42,55,.78);
      line-height: calc(var(--lh-loose) * var(--scale-lh));
      letter-spacing: var(--ls-base);
      text-align:left;
    }

    .cremSubWrap{
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-width:0;
      width:100%;
      padding-right: 0;
      margin-top: 6px;
    }

    .cremSubLine{
      display:block;
      width:100%;
      min-width:0;
      white-space:normal;
      overflow:visible;
      text-overflow:clip;
      color: rgba(31,42,55,.74);
      font-weight:900;
      font-size: clamp(.92rem, 2.95vw, 1.02rem);
      line-height: calc(1.28 * var(--scale-lh));
      letter-spacing: -0.01em;
      text-align:left;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .cremPerson{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
      width:100%;
    }

    .cremName{
      color:#0f172a;
      font-weight:950;
      min-width:0;
      max-width:none;
      white-space:nowrap;
      overflow:visible;
      text-overflow:clip;
      display:block;
      text-align:left;
    }

    .cremName.short{
      letter-spacing: 0.12em;
    }

    .cremName.halfPad{
      padding-right: 0.5ch;
    }

    .cremName.twoChar{
      padding-right: 0.9ch;
    }

    .cremTime{
      white-space:nowrap;
      color:rgba(31,42,55,.82);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      text-align:left;
      min-width:max-content;
      font-size: clamp(.98rem, 3.1vw, 1.08rem);
    }

    .cremTimeWrap{
      display:inline-flex;
      align-items:center;
      white-space:nowrap;
      gap: 1.0ch;
    }

    .cremGap{
      display:inline-block;
      width: 0;
    }

    .cremDisp{
      white-space:nowrap;
      text-align:left;
      font-weight:950;
      min-width:max-content;
      font-size: clamp(.98rem, 3.1vw, 1.08rem);
    }

    .cremDisp.house{ color:#1f4e79; }
    .cremDisp.nature{ color:#2e7d32; }
    .cremDisp.yutaek{ color:#b45309; }

    .no-data{
      text-align:center;
      padding: calc(22px * var(--scale-ui)) calc(14px * var(--scale-ui));
      color: rgba(31,42,55,0.56);
      font-weight: 900;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: var(--fs-md);
      line-height: calc(var(--lh-base) * var(--scale-lh));
      letter-spacing: var(--ls-base);
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding: calc(14px * var(--scale-ui));
      z-index: 9999;
    }

    .overlay.show{
      display:flex;
    }

    .sheet{
      width: min(640px, 96vw);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 30px 90px rgba(15,23,42,.25);
      overflow:hidden;
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }

    .overlay.show .sheet{
      transform: translateY(0);
      opacity: 1;
    }

    .sheet-head{
      padding: calc(12px * var(--scale-ui)) calc(14px * var(--scale-ui));
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: calc(12px * var(--scale-ui));

</head>

<body>

  <script>
    const APP_CONFIG = {
      placeholderWebAppUrl: '여기에_앱스크립트_웹앱_URL_입력',
      statusApiUrl: 'https://script.google.com/macros/s/AKfycbwrG5DFejrblSYgjB8sidOzUP7og6iShjYi2wb5BT6aETXgAQsRoiQTz3Ot3lOdkfM/exec',
      enableStatusEditing: true,
      sharedStatusCacheMs: 180000,
      pageSizeSmall: 28,
      pageSizeMedium: 32,
      pageSizeLarge: 40
    };

    const STORAGE_KEYS = {
      source: 'uic_source_selected',
      cremDoneSeen: 'uic_crem_done_seen',
      sharedStatusCache: 'uic_shared_status_cache'
    };

    const UI_TEXT = {
      loading: '데이터 불러오는 중...',
      loadingInitial: '초기 데이터 불러오는 중...',
      loadingRefresh: '새로고침 중...',
      loadingCrem: '화장진행 데이터 불러오는 중...',
      loadingHouse: '추모의집 데이터 불러오는 중...',
      loadingNature: '자연장지 데이터 불러오는 중...',
      refreshComplete: '새로고침 완료',
      noData: '표시할 데이터가 없습니다.',
      noChanges: '변경된 상태가 없습니다.',
      sharedStatusLoadError: '공유 상태 정보를 불러오지 못했습니다.',
      sharedStatusSaveError: '공유 상태 저장에 실패했습니다.',
      sharedStatusAuthRequired: '앱스크립트 로그인이 필요합니다. 새 탭에서 로그인 후 다시 시도해 주세요.',
      sharedApiNotConfigured: '공유 저장 API 주소가 설정되지 않았습니다.',
      sharedApiInvalid: '공유 저장 API 주소 형식이 올바르지 않습니다.',
      dataFileNotFound: '데이터 파일을 찾을 수 없습니다.',
      saving: '저장중',
      savingDesc: '상태를 저장하고 있습니다...'
    };

    const STATUS_TEXT = {
      recvPendingHouse: '안치대기',
      recvDoneHouse: '안치완료',
      recvPendingNature: '안장대기',
      recvDoneNature: '안장완료',
      retPending: '반환대기',
      retDone: '반환완료',
      legacyRecvHouse: '접수',
      legacyRet: '반출'
    };

    const FACILITY = {
      crem: {
        key: 'crem',
        label: '화장진행',
        url: './data/crem.json',
        dateKey: 'cremDate'
      },
      house: {
        key: 'house',
        label: '추모의집',
        url: './data/deceased_data.json',
        dateKey: 'strDate'
      },
      nature: {
        key: 'nature',
        label: '자연장지',
        url: './data/nature_data.json',
        dateKey: 'natDate'
      }
    };

    const DATA_URLS = {
      crem: './data/crem.json',
      funeral: './data/funeral.json'
    };

    const TAG_LABEL = {
      self: '자체',
      orphan: '무연고'
    };

    const CREM_OBJT_LABEL = {
      A001: '시신',
      B001: '개장',
      A002: '사산'
    };

    const CREM_DISPOSAL_LABEL = {
      '추모의집': '추모의집',
      '봉안': '추모의집',
      '시설내자연장': '자연장지',
      '자연': '자연장지',
      '자연장지': '자연장지',
      '유택동산': '유택동산',
      '유택': '유택동산'
    };

    const $ = (selector) => document.querySelector(selector);

    const esc = (v) => String(v ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const toTrimmedString = (v) => String(v ?? '').trim();
    const safeKey = (v) => toTrimmedString(v);

    function isConfiguredStatusApi(){
      const url = String(APP_CONFIG.statusApiUrl || '').trim();
      const placeholder = String(APP_CONFIG.placeholderWebAppUrl || '').trim();

      if (!url) return false;
      if (url === placeholder) return false;
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(\?.*)?$/.test(url)) return false;

      return true;
    }

    function getTodayIso(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function fmtHHMM(date){
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    const pad2 = (n) => String(n ?? '').trim().padStart(2, '0').slice(-2) || '00';
    const fmtTime = (v) => String(v ?? '').trim();
    const normNameKey = (s) => String(s ?? '').replace(/\s+/g, '').trim();

    function normISO(v){
      if (v == null) return '';
      const s = String(v).trim();
      if (!s) return '';

      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;

      m = s.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;

      m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;

      const d = new Date(s);
      if (!Number.isNaN(d.getTime())){
        const y = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${y}-${mo}-${da}`;
      }

      return '';
    }

    function pickRetDate(o){
      return o?.retDate ?? o?.retdate ?? o?.RETDATE ?? o?.RetDate ?? '';
    }

    function normalizeCoupleName(s){
      const raw = String(s ?? '').trim();
      if (!raw) return '-';
      return raw.replace(/\s*,\s*/g, ' / ');
    }

    function formatEnsNo(val){
      if (val == null) return '-';

      const raw = String(val).trim();
      if (!raw) return '-';

      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart  = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));

        if (roomPart && numPart){
          const room = roomPart.replace(/\D/g, '').padStart(2, '0').slice(-2);
          const num  = numPart.replace(/\D/g, '').padStart(5, '0').slice(-5);
          return `${room}실 ${num}`;
        }

        if (roomPart){
          const tail = parts.slice().reverse().find(p => p.replace(/\D/g, '').length >= 5);
          if (tail){
            const room = roomPart.replace(/\D/g, '').padStart(2, '0').slice(-2);
            const num  = tail.replace(/\D/g, '').slice(-5).padStart(5, '0');
            return `${room}실 ${num}`;
          }
        }
      }

      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1){
        return `${String(m1[1]).padStart(2, '0')}실 ${String(m1[2]).padStart(5, '0')}`;
      }

      let digits = raw.replace(/\D/g, '');
      if (!digits) return raw;
      if (digits.length === 6) digits = digits.padStart(7, '0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7) return `${digits.slice(0, 2)}실 ${digits.slice(-5)}`;

      return raw;
    }

    function cremDateOf(r){
      return normISO(r?.cremDate) || normISO(r?.burnDate) || '';
    }

    function cremChasuOf(r){
      return pad2(r?.burnChasu ?? r?.hwaBrazier?.burnChasu);
    }

    function cremStartOf(r){
      return fmtTime(r?.hwaBrazier?.burnStrTime ?? r?.burnStrTime);
    }

    function cremEndOf(r){
      return fmtTime(r?.hwaBrazier?.burnEndTime ?? r?.burnEndTime);
    }

    function cremRawStatusOf(r){
      return toTrimmedString(
        r?.hwaBrazier?.burnStatusCode?.name ??
        r?.burnStatusCode?.name ??
        r?.hwaBrazier?.burnStatus ??
        r?.burnStatus
      ) || '';
    }

    function normalizeCremStage(r){
      const raw = cremRawStatusOf(r);
      const st = cremStartOf(r);
      const en = cremEndOf(r);

      if (!st){
        if (raw.includes('운구')) return '운구중';
        return '접수';
      }

      if (st && !en) return '화장시작';
      if (raw.includes('유골인도')) return '유골인도';
      return '화장종료';
    }

    function cremObjtOf(r){
      const code = toTrimmedString(r?.objtCode ?? r?.objt);
      return CREM_OBJT_LABEL[code] || toTrimmedString(r?.objtName) || '-';
    }

    function cremDisposalOf(r){
      const raw = toTrimmedString(
        r?.scatterPlaceCode?.name ??
        r?.scatterPlaceName ??
        r?.scatterPlace
      ) || '-';

      return CREM_DISPOSAL_LABEL[raw] || raw;
    }

    function cremDisposalClass(disposal){
      if (disposal === '추모의집') return 'house';
      if (disposal === '자연장지') return 'nature';
      if (disposal === '유택동산') return 'yutaek';
      return '';
    }

    function cremDeadNameOf(r){
      return toTrimmedString(
        r?.thedead?.deadName ??
        r?.deadName
      ) || '-';
    }

    function formatCremNameDisplay(name){
      const raw = toTrimmedString(name) || '-';
      const chars = Array.from(raw);
      const len = chars.length;
      const hasSpecial = (raw !== '-') && /[^0-9A-Za-z가-힣]/.test(raw);

      if (len > 4){
        return {
          text: chars.slice(0, 4).join(''),
          short: false,
          halfPad: true,
          twoChar: false
        };
      }

      if (len <= 3 && raw !== '-'){
        const pad = '\u00A0'.repeat(Math.max(0, 4 - len));
        return {
          text: `${raw}${pad}`,
          short: true,
          halfPad: (len === 2) || hasSpecial,
          twoChar: (len === 2)
        };
      }

      return { text: raw, short: false, halfPad: hasSpecial, twoChar: false };
    }

    function cremTimeRangeOf(r){
      const st = cremStartOf(r);
      const en = cremEndOf(r);

      if (!st) return '화장접수';
      if (st && en) return `${st} ~ ${en}`;
      return `${st} ~ 진행중`;
    }

    function cremStartSortValue(rec){
      const time = cremStartOf(rec);
      if (!/^\d{2}:\d{2}$/.test(time)) return Number.POSITIVE_INFINITY;

      const parts = time.split(':');
      const hh = parseInt(parts[0], 10);
      const mm = parseInt(parts[1], 10);
      if (Number.isNaN(hh) || Number.isNaN(mm)) return Number.POSITIVE_INFINITY;
      return (hh * 60) + mm;
    }

    function cremGroupStartSortValue(group){
      const values = (group?.records || [])
        .map(cremStartSortValue)
        .filter(v => Number.isFinite(v));

      return values.length ? Math.min(...values) : Number.POSITIVE_INFINITY;
    }

        const key = cremDoneKey(deadId, cremDeadNameOf(rec));
        if (!key || state.cremDoneSeen.has(key)) continue;
        state.cremDoneSeen.add(key);
        changed = true;
      }

      if (changed) saveCremDoneSeen();

    function collectNewCremDoneAlerts(items, cremMap){

        for (const entry of entries){

          const rec = did ? cremMap.get(did) : null;
          if (!isCremDoneRecord(rec)) continue;

          const key = cremDoneKey(did, name);

          state.cremDoneSeen.add(key);
          changed = true;

          alerts.push({

    function cremGroupState(group){

      const allDone = stages.every(s => s === '화장종료' || s === '유골인도');
      if (allDone) return 'cremDone';

    function groupCremRows(rows){
      const map = new Map();
      const order = [];

      for (const r of (Array.isArray(rows) ? rows : [])){
        const chasu = cremChasuOf(r) || '00';
        if (!map.has(chasu)){
          map.set(chasu, {
            burnChasu: chasu,
            chasuLabel: `${chasu}회차`,
            records: []
          });
          order.push(chasu);
        }
        map.get(chasu).records.push({
          row: r,
          order: map.get(chasu).records.length
        });
      }

      return order
        .map(k => {
          const group = map.get(k);
          group.records.sort((a, b) => {
            const timeDiff = cremStartSortValue(a.row) - cremStartSortValue(b.row);
            if (timeDiff !== 0) return timeDiff;
            return a.order - b.order;
          });
          group.records = group.records.map(entry => entry.row);
          return group;
        })
        .sort((a, b) => parseInt(a.burnChasu, 10) - parseInt(b.burnChasu, 10));
    }

      dom.ptrFillCircle.style.strokeDashoffset = String(circumference * (1 - progress));

      const capped = Math.max(0, Math.min(distance, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--ptrMax')) || 88));

      if (mode === 'hide'){
        document.body.style.transform = '';
        dom.ptr.classList.remove('show', 'refreshing');
        dom.ptr.setAttribute('aria-hidden', 'true');
        setPTRProgress(0);
        return;
      }

      dom.ptr.classList.add('show');
      dom.ptr.setAttribute('aria-hidden', 'false');
      document.body.style.transform = `translateY(${capped}px)`;

      if (mode === 'refreshing'){
        dom.ptr.classList.add('refreshing');
      } else {
        dom.ptr.classList.remove('refreshing');
        setPTRProgress(capped);

      state.cremRawCache = arr;

    function buildStatusApiUrl(params = {}){
      const url = new URL(APP_CONFIG.statusApiUrl);
      for (const [key, value] of Object.entries(params)){
        if (value == null || value === '') continue;
        url.searchParams.set(key, String(value));
      }
      return url.toString();
    }

    function looksLikeStatusApiAuthResponse(res, text, contentType){
      const finalUrl = String(res?.url || '');
      const body = String(text || '');
      const type = String(contentType || '').toLowerCase();

      return Boolean(
        res?.redirected ||
        finalUrl.includes('accounts.google.com') ||
        finalUrl.includes('ServiceLogin') ||
        type.includes('text/html') ||
        /accounts\.google\.com|serviceLogin|Google 계정|로그인|Sign in/i.test(body)
      );
    }

    function promptStatusApiLogin(){
      const now = Date.now();
      if (state.statusApiAuthPromptedAt && (now - state.statusApiAuthPromptedAt) < 10000) return;
      state.statusApiAuthPromptedAt = now;

      toast(UI_TEXT.sharedStatusAuthRequired, 3200);

      try{
        window.open(buildStatusApiUrl({ action: 'list' }), '_blank', 'noopener');
      } catch {}
    }

    async function fetchStatusApiJson(params = {}, init = {}, fallbackMessage = UI_TEXT.sharedStatusLoadError){
      const res = await fetch(buildStatusApiUrl(params), {
        cache: 'no-store',
        mode: 'cors',
        redirect: 'follow',
        ...init
      });

      const contentType = String(res.headers.get('content-type') || '').toLowerCase();
      const text = await res.text();

      if (looksLikeStatusApiAuthResponse(res, text, contentType)){
        throw createStatusApiAuthError();
      }

      if (!res.ok){
        throw new Error(fallbackMessage);
      }

      try{
        return text ? JSON.parse(text) : {};
      } catch {
        throw new Error(fallbackMessage);
      }
    }

    function wait(ms){

    async function verifySharedStatusSaved(src, id, mode, status){
      const key = statusKey(src, id, mode);

      for (let i = 0; i < 4; i++){
        await wait(700 + (i * 250));
        await loadSharedStatuses(true);
        if (state.sharedStatusMap.get(key) === status){
          return true;
        }
      }

      return false;

    async function loadSharedStatuses(force = false){
      if (!isConfiguredStatusApi()){
        state.sharedStatusMap = new Map();
        state.sharedStatusFetchedAt = Date.now();
        return;
      }

      const now = Date.now();
      if (!force && state.sharedStatusFetchedAt && (now - state.sharedStatusFetchedAt) < APP_CONFIG.sharedStatusCacheMs){
        return;
      }

      if (state.sharedStatusLoadingPromise){
        return state.sharedStatusLoadingPromise;
      }

      state.sharedStatusLoadingPromise = (async () => {
        const json = await fetchStatusApiJson(
          { action: 'list', _: force ? Date.now() : '' },
          {},
          UI_TEXT.sharedStatusLoadError
        );
        const items = Array.isArray(json?.items) ? json.items : [];

        const map = new Map();
        for (const row of items){
          const src = toTrimmedString(row?.src);
          const mode = toTrimmedString(row?.mode);
          const id = toTrimmedString(row?.id);
          const status = toTrimmedString(row?.status);

          if (!src || !mode || !id) continue;
          map.set(statusKey(src, id, mode), status);
        }

        state.sharedStatusMap = map;
        state.sharedStatusFetchedAt = Date.now();
        saveSharedStatusCache();
      })();

      try{
        await state.sharedStatusLoadingPromise;
      } catch (err){
        if (err?.code === 'STATUS_API_AUTH'){
          promptStatusApiLogin();
        }
        throw err;
      } finally {
        state.sharedStatusLoadingPromise = null;
      }
    }

    async function saveSharedStatus({ src, id, mode, status }){
      if (!isConfiguredStatusApi()){
        throw new Error(UI_TEXT.sharedApiInvalid);
      }

      let json;
      try{
        json = await fetchStatusApiJson(
          {},
          {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'save', src, id, mode, status })
          },
          UI_TEXT.sharedStatusSaveError
        );
      } catch (err){
        if (err?.code === 'STATUS_API_AUTH'){
          promptStatusApiLogin();
          throw err;
        }

        const isFetchFailure =
          err instanceof TypeError ||
          /failed to fetch|load failed|networkerror/i.test(String(err?.message || ''));

        if (!isFetchFailure) throw err;

        await saveSharedStatusViaNoCors({ action: 'save', src, id, mode, status });

        const verified = await verifySharedStatusSaved(src, id, mode, status);
        if (!verified){
          throw new Error(UI_TEXT.sharedStatusSaveError);
        }

        json = { ok: true };
      }

      if (!json?.ok) throw new Error(json?.message || UI_TEXT.sharedStatusSaveError);

      state.sharedStatusMap.set(statusKey(src, id, mode), status);
      state.sharedStatusFetchedAt = Date.now();
      saveSharedStatusCache();
    }

    async function syncSharedStatusesInBackground(force = false){
      if (!isConfiguredStatusApi()) return;

      const before = cloneSharedStatusMap(state.sharedStatusMap);

      try{
        await loadSharedStatuses(force);
      } catch {
        return;
      }

      if (!sharedStatusMapsEqual(before, state.sharedStatusMap)){
        rerenderCurrentView();
      }
    }

    function getRecvPendingBySource(src){
      return src === FACILITY.nature.key ? STATUS_TEXT.recvPendingNature : STATUS_TEXT.recvPendingHouse;
    }

    function getRecvDoneBySource(src){
      return src === FACILITY.nature.key ? STATUS_TEXT.recvDoneNature : STATUS_TEXT.recvDoneHouse;
    }

    function getRecv(src, id){
      const key = statusKey(src, id, 'recv');
      const value = state.sharedStatusMap.get(key);

      if (!value) return getRecvPendingBySource(src);
      if (src !== FACILITY.nature.key && value === STATUS_TEXT.legacyRecvHouse) return STATUS_TEXT.recvPendingHouse;
      if (src === FACILITY.nature.key && value === STATUS_TEXT.recvPendingHouse) return STATUS_TEXT.recvPendingNature;
      if (src === FACILITY.nature.key && value === STATUS_TEXT.recvDoneHouse) return STATUS_TEXT.recvDoneNature;
      return value;
    }

    function getRet(id){
      const key = statusKey(FACILITY.house.key, id, 'ret');
      const value = state.sharedStatusMap.get(key);

      if (!value) return STATUS_TEXT.retPending;
      if (value === STATUS_TEXT.legacyRet) return STATUS_TEXT.retPending;
      return value;
    }

    function isRetOn(item, iso){
      return normISO(pickRetDate(item)) === iso;
    }

    function itemId(src, item){
      return src === FACILITY.house.key
        ? String(item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-')
        : String(item?.natNo ?? '-');
    }

    function ensMergeKey(r){
      const ens = safeKey(r.ensNO ?? r.ensNo ?? r.ensno);
      if (ens) return `ENS:${ens}`;
      return `ALT:${safeKey(r.deadId)}|${safeKey(r.strDate)}|${safeKey(r.deadname ?? r.deadName ?? r.deceasedName)}`;
    }

    function mergeEnsRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const key = ensMergeKey(r);

        if (!map.has(key)){
          map.set(key, {
            ensNO: safeKey(r.ensNO ?? r.ensNo ?? r.ensno) || '-',
            strDate: r.strDate ?? '-',
            deadname: r.deadname ?? r.deadName ?? r.deceasedName ?? '-',
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = String(r.deadname ?? r.deadName ?? r.deceasedName ?? '-');

          if (dn && dn !== '-' && !String(cur.deadname).split(' / ').includes(dn)){
            cur.deadname = (cur.deadname && cur.deadname !== '-') ? `${cur.deadname} / ${dn}` : dn;
          }

          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;

          cur._raw.push(r);
        }
      }

      return order.map(k => map.get(k));
    }

    function mergeCoupleRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const natNo = safeKey(r.natNo);
        const key = `${natNo}`;

        const rowNames = Array.isArray(r?.deadName)
          ? r.deadName.map(x => String(x ?? '').trim()).filter(Boolean)
          : [String(r?.deadName ?? r?.deadname ?? '-').trim()].filter(Boolean);

        const rowDate = String(r.natDate ?? '-');

        if (!map.has(key)){
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: rowNames.join(' / ') || '-',
            natDate: rowDate,
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const existingNames = String(cur.deadName ?? '').split(' / ').map(x => x.trim()).filter(Boolean);

          for (const nm of rowNames){
            if (!existingNames.includes(nm)) existingNames.push(nm);
          }

          cur.deadName = existingNames.join(' / ') || '-';

          if (rowDate && rowDate !== '-' && !String(cur.natDate).split(', ').includes(rowDate)){
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${rowDate}` : rowDate;
          }

          cur._raw.push(r);
        }
      }

      return order.map(k => map.get(k));
    }

    function deceasedEntries(item){
      const raws = Array.isArray(item?._raw) ? item._raw : [item];
      const entries = [];

      for (const r of raws){
        const deadIds = Array.isArray(r?.deadId)
          ? r.deadId
          : (r?.deadId != null && String(r.deadId).trim() !== '' ? [r.deadId] : []);

        const deadNames = Array.isArray(r?.deadName)
          ? r.deadName
          : (r?.deadName != null && String(r.deadName).trim() !== '' ? [r.deadName] : []);

        if (deadIds.length){
          for (let i = 0; i < deadIds.length; i++){
            entries.push({
              deadId: String(deadIds[i] ?? '').trim(),
              deadName: String(deadNames[i] ?? '').trim()
            });
          }
          continue;
        }

        const singleDeadId = String(r?.deadId ?? '').trim();
        const singleDeadName = String(r?.deadName ?? r?.deadname ?? r?.deceasedName ?? '').trim();

        if (singleDeadId || singleDeadName){
          entries.push({ deadId: singleDeadId, deadName: singleDeadName });
        }
      }

      return entries;
    }

    function cremObj(deadId, cremMap){
      const did = String(deadId ?? '').trim();
      const rec = did ? cremMap.get(did) : null;

      if (!rec){
        return { type:'pay', chasu:0, start:'선결제', end:'선결제', text:'선결제' };
      }

      const chasuRaw = rec?.burnChasu ?? rec?.hwaBrazier?.burnChasu;
      const chasuNum = parseInt(pad2(chasuRaw), 10);
      const safeChasu = Number.isNaN(chasuNum) ? 0 : chasuNum;

      const st = cremStartOf(rec);
      const en = cremEndOf(rec);
      const chLabel = safeChasu > 0 ? `${pad2(chasuRaw)}회차` : '회차미정';

      if (!st){
        return {
          type:'recv',
          chasu:safeChasu,
          start:'화장접수',
          end:'',
          text:`${chLabel} · 화장접수`
        };
      }

      if (st && !en){
        return {
          type:'info',
          chasu:safeChasu,
          start:st,
          end:'',
          text:`${chLabel} · 화장시작 ${st} · 화장중`
        };
      }

      return {
        type:'info',
        chasu:safeChasu,
        start:st,
        end:en,
        text:`${chLabel} · 화장시작 ${st} · 화장종료 ${en}`
      };
    }

    function chasuKey(item, cremMap){
      const entries = deceasedEntries(item);
      if (!entries.length) return 0;

      const nums = entries.map(x => cremObj(x.deadId, cremMap).chasu).filter(n => Number.isFinite(n));
      const pos = nums.filter(n => n > 0);
      return pos.length ? Math.min(...pos) : 0;
    }

    function cremDetailLines(item, cremMap){
      if (!cremMap) return [];

      const entries = deceasedEntries(item);
      if (!entries.length) return ['선결제'];

      return entries.map(({ deadId }) => cremObj(deadId, cremMap).text);
    }

    function cremTimesForModal(item, cremMap){
      if (!cremMap) return null;

      const entries = deceasedEntries(item);
      if (!entries.length) return ['선결제'];

      return entries.map(({ deadId }) => {
        const did = String(deadId ?? '').trim();
        const rec = did ? cremMap.get(did) : null;
        if (!rec) return '선결제';
        return cremTimeRangeOf(rec);
      });
    }

    function nameKeySetFromDisplay(displayName){
      const parts = String(displayName ?? '').split('/').map(x => normNameKey(x));
      const set = new Set();
      for (const p of parts){ if (p) set.add(p); }
      return set;
    }

    function funeralBadgeLabelForItem(item, displayName, funeralMap){
      if (!funeralMap) return null;

      const entries = deceasedEntries(item);
      if (!entries.length) return null;

      let hasSelf = false;

      for (const entry of entries){
        const id = String(entry.deadId ?? '').trim();
        if (!id) continue;

        const rec = funeralMap.get(id);
        if (!rec) continue;

        if (String(rec.dcGubun ?? '').trim() === 'TCM1200099'){
          return TAG_LABEL.orphan;
        }

        hasSelf = true;
      }

      return hasSelf ? TAG_LABEL.self : null;
    }

    function calcCounts(src, data, iso){
      const dateKey = FACILITY[src].dateKey;

      if (src === FACILITY.house.key){
        const rows = (Array.isArray(data) ? data : []).filter(x => {
          const s = String(x?.[dateKey] ?? '');
          const r = normISO(pickRetDate(x));
          return (s === iso) || (r === iso);
        });

        const merged = mergeEnsRows(rows);
        let recv = 0;
        let ret = 0;

        for (const it of merged){
          const isR = isRetOn(it, iso);
          const isS = String(it.strDate ?? '') === iso;
          if (isR) ret++;
          else if (isS) recv++;
        }

        return { recv, ret };
      }

      const todays = (Array.isArray(data) ? data : []).filter(x => String(x?.[dateKey] ?? '') === iso);
      return { recv: mergeCoupleRows(todays).length, ret: 0 };
    }

    function sortStable(arr, iso, cremMap){
      const clone = arr.slice();
      clone.forEach((it, i) => { it._pos = (it._pos ?? i); });

      clone.sort((a, b) => {
        const isHouse = (state.currentSource === FACILITY.house.key);
        const retA = isHouse && isRetOn(a, iso);
        const retB = isHouse && isRetOn(b, iso);

        const aId = itemId(state.currentSource, a);
        const bId = itemId(state.currentSource, b);

        const aRetDone = retA ? (getRet(aId) === STATUS_TEXT.retDone) : false;
        const bRetDone = retB ? (getRet(bId) === STATUS_TEXT.retDone) : false;

        const grpA = retA ? (aRetDone ? 2 : 0) : 1;
        const grpB = retB ? (bRetDone ? 2 : 0) : 1;

        if (grpA !== grpB) return grpA - grpB;

        if (grpA === 1 && grpB === 1 && cremMap){
          const ca = chasuKey(a, cremMap);
          const cb = chasuKey(b, cremMap);
          if (ca !== cb) return ca - cb;
        }

        return (a._pos ?? 0) - (b._pos ?? 0);
      });

      return clone;
    }

    function badgeHTML(label){
      if (!label) return '';
      const cls = (label === TAG_LABEL.orphan) ? 'tag orphan' : 'tag self';
      return `<span class="${cls}">${esc(label)}</span>`;
    }

    function leftCls(src, mode, status){
      if (src === FACILITY.crem.key) return 'cremRecv';
      if (mode === 'ret') return (status === STATUS_TEXT.retDone) ? 'retDone' : 'ret';
      return (status === getRecvDoneBySource(src)) ? 'done' : 'recv';
    }

    function getStatusBadgeClass(mode, status){
      if (mode === 'ret') return status === STATUS_TEXT.retDone ? 'statusPill retDone' : 'statusPill ret';
      return status === getRecvDoneBySource(state.currentSource) ? 'statusPill done' : 'statusPill';
    }

    function getDisplayId(item){
      return state.currentSource === FACILITY.house.key
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');
    }

    function getDisplayName(item){
      let displayName = state.currentSource === FACILITY.house.key
        ? String(item.deadname ?? item.deadName ?? item.deceasedName ?? '-')
        : String(item.deadName ?? '-');

      if (state.currentSource === FACILITY.nature.key){
        displayName = normalizeCoupleName(displayName);
      }

      return displayName;
    }

    function getItemMode(item, selectedDate){
      return (state.currentSource === FACILITY.house.key && isRetOn(item, selectedDate)) ? 'ret' : 'recv';
    }

    function getItemStatus(item, selectedDate){
      const sid = itemId(state.currentSource, item);
      const mode = getItemMode(item, selectedDate);
      if (mode === 'ret') return getRet(sid);
      return getRecv(state.currentSource, sid);
    }

    function kv(k, v){
      return `
        <div class="kv">
          <div class="k">${esc(k)}</div>
          <div class="v">${esc(v)}</div>
        </div>
      `;
    }

    function kvHTML(k, html){
      return `
        <div class="kv">
          <div class="k">${esc(k)}</div>
          <div class="v">${html}</div>
        </div>
      `;
    }

    function kvLines(k, lines){
      const arr = (Array.isArray(lines) ? lines : []).map(esc).filter(Boolean);
      if (!arr.length) return '';
      const html = arr.map(line => `<span class="time-line">${line}</span>`).join('');
      return `
        <div class="kv">
          <div class="k">${esc(k)}</div>
          <div class="v">${html}</div>
        </div>
      `;
    }

    function cremLinesHTML(item, cremMap, mode){
      if (mode === 'ret' || !cremMap) return '';
      const lines = cremDetailLines(item, cremMap);
      if (!lines.length) return '';
      return `<div class="cremSubWrap">${lines.map(line => `<div class="cremSubLine" title="${esc(line)}">${esc(line)}</div>`).join('')}</div>`;
    }

    function cremGroupRowHTML(group, idx){
      const persons = (group.records || []).map(r => {
        const name = cremDeadNameOf(r);
        return {
          name,
          objt: cremObjtOf(r),
          timeRange: cremTimeRangeOf(r),
          disposal: cremDisposalOf(r),
          ...formatCremNameDisplay(name)
        };
      });
      const rowCls = cremGroupState(group);

      return `
        <li>
          <div class="row ${rowCls}">
            <div class="barL"></div>
            <div class="rowR">
              <button class="mainBtn" type="button" data-open="${idx}" aria-label="상세 보기">
                <div class="main">
                  <div class="no">${esc(group.chasuLabel)}</div>
                  <div class="cremWrap">
                    ${persons.map(p => `
                      <div class="cremLine">
                        <span class="cremPerson">
                          ${cremObjtBadgeHTML(p.objt)}
                          <span class="cremName ${p.short ? 'short' : ''} ${p.halfPad ? 'halfPad' : ''} ${p.twoChar ? 'twoChar' : ''}" title="${esc(p.name)}">${esc(p.text)}</span>
                        </span>
                        <span class="cremTimeWrap">
                          <span class="cremTime">${esc(p.timeRange)}</span><span class="cremGap" aria-hidden="true"></span><span class="cremDisp ${cremDisposalClass(p.disposal)}">${esc(p.disposal)}</span>
                        </span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </button>
            </div>
          </div>
        </li>
      `;
    }

    function rowHTML(item, idx, selected, cremMap, funeralMap){
      if (state.currentSource === FACILITY.crem.key){
        return cremGroupRowHTML(item, idx);
      }

      const mode = getItemMode(item, selected);
      const status = getItemStatus(item, selected);
      const displayId = getDisplayId(item);
      const displayName = getDisplayName(item);
      const badgeLabel = (mode === 'ret') ? null : funeralBadgeLabelForItem(item, displayName, funeralMap);
      const tag = badgeHTML(badgeLabel);
      const cremInfoHtml = cremLinesHTML(item, cremMap, mode);

      return `
        <li>
          <div class="row ${leftCls(state.currentSource, mode, status)}">
            <div class="barL"></div>
            <div class="rowR">
              <div class="rowTop">
                <button class="mainBtn" type="button" data-open="${idx}" aria-label="상세 보기">
                  <div class="main">
                    <div class="no">${esc(displayId)}</div>
                    <div class="nameLine">
                      <div class="nameWrap" title="${esc(displayName)}">
                        <span class="nameText">${esc(displayName)}</span>
                        ${tag}
                      </div>
                    </div>
                  </div>
                </button>
                <button class="${getStatusBadgeClass(mode, status)}" type="button" data-open="${idx}" aria-label="상태 상세 보기">
                  ${esc(status)}
                </button>
              </div>
              ${cremInfoHtml}
            </div>
          </div>
        </li>
      `;
    }

    function renderListShell(){
      dom.listArea.innerHTML = `
        <div class="list">
          <div class="list-head">
            <div class="hint">${esc(FACILITY[state.currentSource].label)} 접수목록</div>
          </div>
          <ul id="listUL"></ul>
        </div>
      `;
    }

    function computePageSize(){
      const w = Math.min(window.innerWidth || 0, window.screen?.width || 0) || 360;
      if (w <= 390) return APP_CONFIG.pageSizeSmall;
      if (w <= 430) return APP_CONFIG.pageSizeMedium;
      return APP_CONFIG.pageSizeLarge;
    }

    function resetInfinite(){
      state.renderedCount = 0;
      dom.infiniteArea.innerHTML = '';

      if (state.observer){
        state.observer.disconnect();
        state.observer = null;
      }
    }

    function updateHeadShown(shown, total){
      return;
    }

    function getDisplayTotalCount(){
      if (state.currentSource === FACILITY.crem.key){
        return state.currentDisplayData.reduce((sum, group) => {
          return sum + (Array.isArray(group?.records) ? group.records.length : 0);
        }, 0);
      }
      return state.currentDisplayData.length;
    }

    function setInfiniteUI({ mode, shown, total }){
      if (mode === 'empty'){
        dom.infiniteArea.innerHTML = '';
        return;
      }

      let msg = '';

      if (mode === 'loading'){
        msg = `<div class="infCard">불러오는 중…</div>`;
      } else if (mode === 'more'){
        msg = `<div class="infCard"><strong>${shown.toLocaleString()}</strong> / ${total.toLocaleString()}건 표시 중 · 아래로 스크롤하면 더 불러옵니다</div>`;
      } else if (mode === 'end'){
        msg = `<div class="infCard">전체 <strong>${total.toLocaleString()}</strong>건 표시 완료</div>`;
      }

      dom.infiniteArea.innerHTML = `
        <div class="inf">
          ${msg}
          <div id="sentinel"></div>
        </div>
      `;
    }

    function ensureObserver(){
      const sentinel = document.getElementById('sentinel');
      if (!sentinel) return;

      if (state.observer) state.observer.disconnect();

      state.observer = new IntersectionObserver((entries) => {
        const ent = entries[0];
        if (!ent || !ent.isIntersecting) return;
        renderNextPage();
      }, {
        root: null,
        rootMargin: '900px 0px',
        threshold: 0.01
      });

      state.observer.observe(sentinel);
    }

    function fitSingleLineText(root = document){
      const nodes = root.querySelectorAll('.js-fit-text');
      nodes.forEach(el => {
        el.style.transform = 'scaleX(1)';
        const maxScale = Number(el.dataset.maxScale || 1);
        const minScale = Number(el.dataset.minScale || 0.8);
        const available = el.clientWidth || el.parentElement?.clientWidth || 0;
        const needed = el.scrollWidth || 0;

        if (!available || !needed){
          el.style.transform = 'scaleX(1)';
          return;
        }

        if (needed <= available){
          el.style.transform = 'scaleX(1)';
          return;
        }

        const ratio = Math.max(minScale, Math.min(maxScale, available / needed));
        el.style.transform = `scaleX(${ratio})`;
      });
    }

    function renderNextPage(){
      const selected = dom.datePicker.value || state.today;
      const totalRows = state.currentDisplayData.length;
      const totalCount = getDisplayTotalCount();

      if (!totalRows) return;

      const cremMap = state.lastCremMapForRender;
      const funeralMap = state.lastFuneralMapForRender;
      const ul = document.getElementById('listUL');
      if (!ul) return;

      if (state.renderedCount >= totalRows){
        updateHeadShown(totalCount, totalCount);
        setInfiniteUI({ mode: 'end', shown: totalCount, total: totalCount });
        if (state.observer) state.observer.disconnect();
        fitSingleLineText(dom.listArea);
        return;
      }

      const from = state.renderedCount;
      const to = Math.min(state.renderedCount + state.pageSize, totalRows);

      let chunk = '';
      for (let i = from; i < to; i++){
        chunk += rowHTML(state.currentDisplayData[i], i, selected, cremMap, funeralMap);
      }

      ul.insertAdjacentHTML('beforeend', chunk);
      state.renderedCount = to;

      let shownCount = state.renderedCount;
      if (state.currentSource === FACILITY.crem.key){
        shownCount = state.currentDisplayData
          .slice(0, state.renderedCount)
          .reduce((sum, group) => sum + (Array.isArray(group?.records) ? group.records.length : 0), 0);
      }

      updateHeadShown(shownCount, totalCount);

      if (state.renderedCount < totalRows){
        setInfiniteUI({ mode: 'more', shown: shownCount, total: totalCount });
        ensureObserver();
      } else {
        setInfiniteUI({ mode: 'end', shown: totalCount, total: totalCount });
        if (state.observer) state.observer.disconnect();
      }

      requestAnimationFrame(() => fitSingleLineText(dom.listArea));
      updateFAB();
    }

    function rerenderCurrentView(){
      const selected = dom.datePicker.value || state.today;

      if (state.currentSource === FACILITY.crem.key){
        const groups = groupCremRows((state.cremRawCache || []).filter(r => cremDateOf(r) === selected));
        state.currentDisplayData = groups;
        resetInfinite();
        state.lastCremMapForRender = null;
        state.lastFuneralMapForRender = null;

        if (!groups.length){
          dom.listArea.innerHTML = `<div class="no-data">${UI_TEXT.noData}</div>`;
          updateFAB();
          return;
        }

        renderListShell();
        setInfiniteUI({ mode: 'loading', shown: 0, total: getDisplayTotalCount() });
        renderNextPage();
        updateHeaderMeta();
        return;
      }

      const cremMap = (selected === state.today) ? state.cremMapCache : null;
      let display = state.currentDisplayData.slice();
      display = sortStable(display, selected, cremMap);
      state.currentDisplayData = display;

      resetInfinite();
      state.lastCremMapForRender = cremMap;
      state.lastFuneralMapForRender = state.funeralMapCache;

      renderListShell();
      setInfiniteUI({ mode: 'loading', shown: 0, total: display.length });
      renderNextPage();
      updateHeaderMeta();
    }

    function buildModalNameHTML(displayName, badgeLabel){
      return `
        <span style="display:inline-flex;align-items:center;gap:3px;min-width:0;max-width:100%;width:fit-content;flex-wrap:wrap;">
          <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(displayName)}</span>
          ${badgeHTML(badgeLabel)}
        </span>
      `;
    }

    function buildCremModalFields(group){
      const persons = (group.records || []).map(r => ({
        name: cremDeadNameOf(r),
        objt: cremObjtOf(r),
        timeRange: cremTimeRangeOf(r),
        disposal: cremDisposalOf(r),
        stage: normalizeCremStage(r)
      }));

      return `
        ${kv('회차', group.chasuLabel)}
        ${persons.map((p, i) => `
          <div class="kv">
            <div class="k">고인 ${i + 1}</div>
            <div class="v">
              <span class="time-line"><strong>고인명</strong> ${cremObjtBadgeHTML(p.objt)}${esc(p.name)}</span>
              <span class="time-line"><strong>화장진행</strong> ${esc(p.stage)}</span>
              <span class="time-line"><strong>화장시간</strong> ${esc(p.timeRange)}</span>
              <span class="time-line"><strong>유골처리</strong> <span class="cremDisp ${cremDisposalClass(p.disposal)}">${esc(p.disposal)}</span></span>
            </div>
          </div>
        `).join('')}
      `;
    }

    function buildModalFields(item, selectedDate){
      const isRetModal = (state.currentSource === FACILITY.house.key && isRetOn(item, selectedDate));
      const showCrem = selectedDate === state.today;
      const cremMap = showCrem ? state.cremMapCache : null;

      const displayName = getDisplayName(item);
      const badgeLabel = isRetModal ? null : funeralBadgeLabelForItem(item, displayName, state.funeralMapCache);

      let html = '';

      if (state.currentSource === FACILITY.house.key){
        html += kv('안치일자', item.strDate ?? '-');
        html += kvHTML('고인명', buildModalNameHTML(displayName, badgeLabel));

        const rdISO = normISO(pickRetDate(item));
        const rdRaw = pickRetDate(item);
        if (rdISO) html += kv('반환일자', String(rdRaw ?? rdISO));
      } else {
        html += kv('안장일자', item.natDate ?? '-');
        html += kvHTML('고인명', buildModalNameHTML(displayName, badgeLabel));
      }

      if (!isRetModal){
        const cremLines = cremTimesForModal(item, cremMap);
        if (cremLines && cremLines.length){
          html += kvLines('화장시간', cremLines);
        }
      }

      return html;
    }

    function getModalStatusOptions(mode){
      if (mode === 'ret') return [STATUS_TEXT.retPending, STATUS_TEXT.retDone];
      if (state.currentSource === FACILITY.nature.key) return [STATUS_TEXT.recvPendingNature, STATUS_TEXT.recvDoneNature];
      return [STATUS_TEXT.recvPendingHouse, STATUS_TEXT.recvDoneHouse];
    }

    function openSheet(index){
      const item = state.currentDisplayData[index];
      if (!item) return;

      if (state.currentSource === FACILITY.crem.key){
        state.modal = {
          index,
          src: FACILITY.crem.key,
          id: item.burnChasu,
          mode: '',
          currentStatus: '',
          headerNo: item.chasuLabel,
          displayName: '',
          kind: 'crem'
        };

        dom.mTitleLine.textContent = `${FACILITY.crem.label} · ${item.chasuLabel}`;
        dom.mFields.innerHTML = buildCremModalFields(item);
        dom.statusEditorBox.style.display = 'none';
        dom.sheetSaveBtn.style.display = 'none';
        dom.overlay.classList.add('show');
        dom.overlay.setAttribute('aria-hidden', 'false');
        return;
      }

      const selected = dom.datePicker.value || state.today;
      const sid = itemId(state.currentSource, item);
      const mode = getItemMode(item, selected);
      const currentStatus = getItemStatus(item, selected);
      const headerNo = getDisplayId(item);
      const displayName = getDisplayName(item);

      state.modal = {
        index,
        src: mode === 'ret' ? FACILITY.house.key : state.currentSource,
        id: sid,
        mode,
        currentStatus,
        headerNo,
        displayName,
        kind: 'default'
      };

      dom.mTitleLine.textContent = `${FACILITY[state.currentSource].label} · ${headerNo}`;
      dom.mFields.innerHTML = buildModalFields(item, selected);

      const opts = getModalStatusOptions(mode);
      dom.modalStatusSelect.innerHTML = opts
        .map(v => `<option value="${esc(v)}">${esc(v)}</option>`)
        .join('');

      dom.modalStatusSelect.value = currentStatus;
      dom.modalCurrentStatusText.textContent = `현재 상태 ${currentStatus}`;
      dom.statusEditorBox.style.display = 'flex';
      dom.sheetSaveBtn.style.display = '';
      dom.sheetSaveBtn.disabled = false;

      dom.overlay.classList.add('show');
      dom.overlay.setAttribute('aria-hidden', 'false');
    }

    function closeSheet(){
      dom.overlay.classList.remove('show');
      dom.overlay.setAttribute('aria-hidden', 'true');

      state.modal = {
        index: -1,
        src: '',
        id: '',
        mode: '',
        currentStatus: '',
        headerNo: '',
        displayName: '',
        kind: 'default'
      };
    }

    function getSavingDescTarget(){
      if (state.modal.src === FACILITY.house.key || state.modal.src === FACILITY.nature.key){
        const name = String(state.modal.displayName || '').trim();
        if (name) return `고인 ${name}님`;
      }
      return state.modal.headerNo;
    }

    async function saveModalStatus(){
      if (state.modal.index < 0 || state.modal.kind === 'crem') return;

      const next = String(dom.modalStatusSelect.value || '').trim();
      const cur = String(state.modal.currentStatus || '').trim();

      if (!next) return;
      if (next === cur){
        toast(UI_TEXT.noChanges, 1400);
        return;
      }

      try{
        dom.sheetSaveBtn.disabled = true;
        showSaving('저장중', `${getSavingDescTarget()} 상태를 저장하고 있습니다.`);

        await saveSharedStatus({
          src: state.modal.src,
          id: state.modal.id,
          mode: state.modal.mode,
          status: next
        });

        state.modal.currentStatus = next;
        dom.modalCurrentStatusText.textContent = `현재 상태 ${next}`;
        toast(`${state.modal.headerNo} : ${next}`, 2200);

        rerenderCurrentView();
        closeSheet();
      } catch (err){
        toast(`저장 실패: ${err.message}`, 2400);
      } finally {
        hideSaving();
        dom.sheetSaveBtn.disabled = false;
      }
    }

    async function load(force = false, loadingMsg = UI_TEXT.loading){
      const myToken = ++state.currentLoadingToken;
      const isInitialLoad = !state.initialPaintDone;
      const shouldShowBlockingLoading = force || isInitialLoad || !hasAllCoreDataCached();
      if (shouldShowBlockingLoading){
        showLoading(loadingMsg);
      }

      const selected = dom.datePicker.value || state.today;
      state.currentSelectedDate = selected;
      const showCremTimesOnOtherTabs = (selected === state.today);
      const shouldSyncSharedStatuses =
        isConfiguredStatusApi() &&
        (!isInitialLoad && (force || !state.sharedStatusFetchedAt || (Date.now() - state.sharedStatusFetchedAt) >= APP_CONFIG.sharedStatusCacheMs));

      try{
        const allData = await ensureAllData(force);
        if (myToken !== state.currentLoadingToken) return;

        if (isInitialLoad){
          try{
            await loadSharedStatuses(true);
          } catch {}
          if (myToken !== state.currentLoadingToken) return;
        }

        if (state.currentSource === FACILITY.crem.key){
          const filteredRaw = (allData.crem.rows || []).filter(r => cremDateOf(r) === selected);
          const grouped = groupCremRows(filteredRaw);

          dom.countText.textContent = `접수 ${filteredRaw.length}건`;
          state.currentDisplayData = grouped;

          if (!grouped.length){
            dom.listArea.innerHTML = `<div class="no-data">${UI_TEXT.noData}</div>`;
            resetInfinite();
            return;
          }

          resetInfinite();
          state.lastCremMapForRender = null;
          state.lastFuneralMapForRender = null;

          renderListShell();
          setInfiniteUI({ mode: 'loading', shown: 0, total: getDisplayTotalCount() });
          renderNextPage();
          return;
        }

        const data = state.currentSource === FACILITY.house.key ? allData.house : allData.nature;
        const funeralMap = allData.funeral;
        const cremMap = showCremTimesOnOtherTabs ? allData.crem.map : null;

        const c = calcCounts(state.currentSource, data, selected);

        dom.countText.textContent = (state.currentSource === FACILITY.house.key)
          ? `안치 ${c.recv}건 · 반환 ${c.ret}건`
          : `안장 ${c.recv}건`;

        const dateKey = FACILITY[state.currentSource].dateKey;
        let filtered = [];

        if (state.currentSource === FACILITY.house.key){
          filtered = data.filter(x => {
            const s = String(x?.[dateKey] ?? '');
            const r = normISO(pickRetDate(x));
            return (s === selected) || (r === selected);
          });
          filtered = mergeEnsRows(filtered);
        } else {
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selected);
          filtered = mergeCoupleRows(filtered);
        }

        filtered.forEach((it, i) => { it._pos = i; });
        state.currentDisplayData = sortStable(filtered, selected, cremMap);

        if (showCremTimesOnOtherTabs && cremMap){
          if (!state.cremDoneAlertReady){
            primeCremDoneSeenFromMap(cremMap);
            state.cremDoneAlertReady = true;
          } else {
            const newDoneItems = collectNewCremDoneAlerts(state.currentDisplayData, cremMap);
            if (newDoneItems.length){
              showCremDoneAlert(newDoneItems);
            }
          }
        }

        if (!state.currentDisplayData.length){
          dom.listArea.innerHTML = `<div class="no-data">${UI_TEXT.noData}</div>`;
          resetInfinite();
          return;
        }

        resetInfinite();
        state.lastCremMapForRender = cremMap;
        state.lastFuneralMapForRender = funeralMap;

        renderListShell();
        setInfiniteUI({ mode: 'loading', shown: 0, total: state.currentDisplayData.length });
        renderNextPage();

      } catch (err){
        dom.listArea.innerHTML = `<div class="no-data">오류: ${esc(err.message)}</div>`;
        resetInfinite();
      } finally {
        if (myToken === state.currentLoadingToken){
          if (shouldShowBlockingLoading){
            hideLoading();
          }
          updateHeaderMeta();
          updateFAB();

          if (shouldSyncSharedStatuses){
            setTimeout(() => {
              syncSharedStatusesInBackground(force);
            }, 0);
          }

          if (!state.initialPaintDone){
            state.initialPaintDone = true;
          }
        }
      }
    }

    async function doRefresh(fromUI = true){
      if (state.isRefreshing) return;
      state.isRefreshing = true;

      try{
        state.dataCache.house = null;
        state.dataCache.nature = null;
        state.cremRawCache = null;
        state.cremMapCache = null;
        state.funeralMapCache = null;
        state.sharedStatusFetchedAt = 0;

        await load(true, UI_TEXT.loadingRefresh);
        updateHeaderMeta();

        if (fromUI) toast(UI_TEXT.refreshComplete, 1400);
      } finally {
        state.isRefreshing = false;
        updateFAB();
      }
    }

    function setSource(src){
      state.currentSource = src;
      localStorage.setItem(STORAGE_KEYS.source, src);

      dom.tabCrem.classList.toggle('active', src === FACILITY.crem.key);
      dom.tabHouse.classList.toggle('active', src === FACILITY.house.key);
      dom.tabNature.classList.toggle('active', src === FACILITY.nature.key);

      const msg =
        src === FACILITY.crem.key ? UI_TEXT.loadingCrem :
        src === FACILITY.house.key ? UI_TEXT.loadingHouse :
        UI_TEXT.loadingNature;

      load(false, msg);
    }

    function updateFAB(){
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const doc = document.documentElement;
      const hasScroll = (doc.scrollHeight - window.innerHeight) > 40;

      dom.fabRefresh.classList.add('show');
      dom.fabTop.classList.toggle('show', hasScroll && y > 220);
    }

    function onResize(){
      const next = computePageSize();
      if (next !== state.pageSize){
        state.pageSize = next;
      }
      requestAnimationFrame(() => fitSingleLineText(dom.listArea));
      updateFAB();
    }

    function bindPullToRefresh(){
      const trigger = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--ptrTrigger')) || 64;

      window.addEventListener('touchstart', (e) => {
        if (state.isRefreshing || dom.overlay.classList.contains('show') || dom.savingOverlay.classList.contains('show')) return;
        if (window.scrollY > 0) return;
        if (!e.touches || !e.touches.length) return;

        state.ptr.active = true;
        state.ptr.startY = e.touches[0].clientY;
        state.ptr.distance = 0;
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!state.ptr.active || state.isRefreshing || dom.overlay.classList.contains('show') || dom.savingOverlay.classList.contains('show')) return;
        if (!e.touches || !e.touches.length) return;
        if (window.scrollY > 0){
          state.ptr.active = false;
          setPTRVisual(0, 'hide');
          return;
        }

        const delta = e.touches[0].clientY - state.ptr.startY;
        if (delta <= 0){
          setPTRVisual(0, 'hide');
          return;
        }

        const eased = Math.min(delta * 0.58, 88);
        state.ptr.distance = eased;
        setPTRVisual(eased, eased >= trigger ? 'ready' : 'idle');

        if (delta > 8) e.preventDefault();
      }, { passive: false });

      async function releasePTR(){
        if (!state.ptr.active) return;

        const shouldRefresh = state.ptr.distance >= trigger && !state.isRefreshing;
        state.ptr.active = false;

        if (!shouldRefresh){
          state.ptr.distance = 0;
          setPTRVisual(0, 'hide');
          return;
        }

        state.ptr.refreshing = true;
        setPTRVisual(trigger, 'refreshing');

        try{
          await doRefresh(true);
        } finally {
          state.ptr.distance = 0;
          state.ptr.refreshing = false;
          setPTRVisual(0, 'hide');
        }
      }

      window.addEventListener('touchend', releasePTR, { passive: true });
      window.addEventListener('touchcancel', () => {
        state.ptr.active = false;
        state.ptr.distance = 0;
        if (!state.ptr.refreshing) setPTRVisual(0, 'hide');
      }, { passive: true });
    }

    function bindEvents(){
      dom.tabCrem.addEventListener('click', () => {
        if (state.currentSource === FACILITY.crem.key) return;
        setSource(FACILITY.crem.key);
      });

      dom.tabHouse.addEventListener('click', () => {
        if (state.currentSource === FACILITY.house.key) return;
        setSource(FACILITY.house.key);
      });

      dom.tabNature.addEventListener('click', () => {
        if (state.currentSource === FACILITY.nature.key) return;
        setSource(FACILITY.nature.key);
      });

      dom.datePicker.addEventListener('change', () => {
        load(false, UI_TEXT.loading);
      });

      dom.sheetCancelBtn.addEventListener('click', closeSheet);
      dom.sheetSaveBtn.addEventListener('click', saveModalStatus);

      dom.overlay.addEventListener('click', (e) => {
        if (e.target === dom.overlay) closeSheet();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && dom.overlay.classList.contains('show')){
          closeSheet();
        }
      });

      dom.listArea.addEventListener('click', (e) => {
        const openBtn = e.target.closest('[data-open]');
        if (openBtn){
          openSheet(parseInt(openBtn.getAttribute('data-open'), 10));
        }
      });

      dom.fabRefresh.addEventListener('click', async () => {
        await doRefresh(true);
      });

      dom.fabTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      window.addEventListener('scroll', updateFAB, { passive:true });
      window.addEventListener('resize', onResize, { passive:true });
      window.addEventListener('orientationchange', onResize, { passive:true });
      window.addEventListener('load', () => requestAnimationFrame(() => fitSingleLineText(dom.listArea)));

      bindPullToRefresh();
    }

    function init(){
      state.pageSize = computePageSize();
      loadCremDoneSeen();
      loadSharedStatusCache();

      const saved = localStorage.getItem(STORAGE_KEYS.source);
      const initialSource = (
        saved === FACILITY.crem.key ||
        saved === FACILITY.nature.key ||
        saved === FACILITY.house.key
      ) ? saved : FACILITY.house.key;

      state.currentSource = initialSource;
      state.currentSelectedDate = state.today;

      dom.datePicker.value = state.today;

      dom.tabCrem.classList.toggle('active', initialSource === FACILITY.crem.key);
      dom.tabHouse.classList.toggle('active', initialSource === FACILITY.house.key);
      dom.tabNature.classList.toggle('active', initialSource === FACILITY.nature.key);

      updateFAB();
      setHeaderLoading(UI_TEXT.loadingInitial);

      bindEvents();
      load(true, UI_TEXT.loadingInitial);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
