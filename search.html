<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고인 검색</title>

<style>

body{
    font-family: sans-serif;
}

.container{
    width:900px;
    margin:auto;
}

.search-box{
    margin:20px 0;
}

.result-table{
    width:100%;
    border-collapse:collapse;
}

.result-table th,
.result-table td{
    border:1px solid #ddd;
    padding:8px;
}

.result-table th{
    background:#f5f5f5;
}

.no-result{
    margin-top:20px;
    font-size:16px;
}

</style>
</head>


<body>

<div class="container">

<h2>고인 검색</h2>

<div class="search-box">

<input type="text" id="keyword" placeholder="고인 이름을 입력하세요">

<button id="btnSearch">검색</button>

</div>

<div id="resultDiv"></div>

</div>


<script>


const SOURCES={
    memorial:'./data/deceased_data.json',
    nature:'./data/nature_data.json'
}


function maskName(name){

    if(!name) return ''

    const len=name.length

    if(len===1) return name
    if(len===2) return name[0]+'○'
    if(len===3) return name[0]+'○'+name[2]

    return name[0]+'○'.repeat(len-2)+name[len-1]
}



async function loadJson(url){

    const res=await fetch(url)

    const data=await res.json()

    if(Array.isArray(data)) return data

    if(data.data) return data.data
    if(data.rows) return data.rows
    if(data.items) return data.items
    if(data.list) return data.list
    if(data.Sheet1) return data.Sheet1

    return []
}



function normalizeMemorial(row){

    return{

        name:row.deadName ?? '',
        location:row.ensNo ?? '',
        applicant:maskName(row.applName ?? ''),
        date:row.strDate ?? ''

    }
}


function normalizeNature(row){

    return{

        name:row.deadName ?? '',
        location:row.natNo ?? '',
        applicant:maskName(row.applName ?? ''),
        date:row.natDate ?? ''

    }
}



async function search(keyword){

    const results=[]

    const memorialData=await loadJson(SOURCES.memorial)
    const natureData=await loadJson(SOURCES.nature)

    memorialData.forEach(row=>{

        const name=row.deadName ?? ''

        if(name.includes(keyword)){

            results.push(normalizeMemorial(row))

        }

    })

    natureData.forEach(row=>{

        const name=row.deadName ?? ''

        if(name.includes(keyword)){

            results.push(normalizeNature(row))

        }

    })

    return results

}



function renderResults(results,keyword){

    const resultDiv=document.getElementById('resultDiv')

    resultDiv.innerHTML=''

    if(results.length===0){

        const div=document.createElement('div')

        div.className='no-result'

        div.textContent=`'${keyword}' 검색 결과가 없습니다.`

        resultDiv.appendChild(div)

        return
    }


    const table=document.createElement('table')

    table.className='result-table'


    const thead=document.createElement('thead')

    const headRow=document.createElement('tr')

    const headers=['고인명','위치','신청자','안치/안장일']


    headers.forEach(title=>{

        const th=document.createElement('th')

        th.textContent=title

        headRow.appendChild(th)

    })


    thead.appendChild(headRow)

    table.appendChild(thead)


    const tbody=document.createElement('tbody')


    results.forEach(rec=>{

        const tr=document.createElement('tr')


        const tdName=document.createElement('td')
        tdName.textContent=rec.name

        const tdLoc=document.createElement('td')
        tdLoc.textContent=rec.location

        const tdApp=document.createElement('td')
        tdApp.textContent=rec.applicant

        const tdDate=document.createElement('td')
        tdDate.textContent=rec.date


        tr.appendChild(tdName)
        tr.appendChild(tdLoc)
        tr.appendChild(tdApp)
        tr.appendChild(tdDate)

        tbody.appendChild(tr)

    })


    table.appendChild(tbody)

    resultDiv.appendChild(table)

}



async function runSearch(){

    const keywordInput=document.getElementById('keyword')

    const keyword=keywordInput.value.trim()

    if(!keyword){

        alert('검색어를 입력하세요')

        return
    }


    const results=await search(keyword)

    renderResults(results,keyword)

}



document.getElementById('btnSearch').addEventListener('click',runSearch)

document.getElementById('keyword').addEventListener('keydown',function(e){

    if(e.key==='Enter') runSearch()

})

</script>

</body>
</html>
