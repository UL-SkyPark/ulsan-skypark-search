<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌸 울산하늘공원 접수 현황</title>

  <style>
    :root{
      --bg-a:#f7f7ff;
      --bg-b:#f2fbf7;
      --bg-c:#fff6fb;

      --card: rgba(255,255,255,0.92);
      --text:#0f172a;
      --muted:#64748b;

      --st-recv-bg: rgba(249,168,212,.22);
      --st-recv-bd: rgba(249,168,212,.38);
      --st-recv-tx: rgba(131,24,67,.85);

      --st-done-bg: rgba(134,239,172,.26);
      --st-done-bd: rgba(134,239,172,.40);
      --st-done-tx: rgba(20,83,45,.86);

      --st-ret-bg: rgba(148,163,184,.18);
      --st-ret-bd: rgba(148,163,184,.28);
      --st-ret-tx: rgba(30,41,59,.78);

      --st-retdone-bg: rgba(165,180,252,.22);
      --st-retdone-bd: rgba(165,180,252,.40);
      --st-retdone-tx: rgba(30,41,59,.86);

      --shadow: 0 14px 40px rgba(15,23,42,0.10);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% 10%, rgba(165,180,252,.55), transparent 55%),
        radial-gradient(900px 520px at 85% 0%, rgba(249,168,212,.45), transparent 55%),
        radial-gradient(1000px 600px at 60% 100%, rgba(134,239,172,.38), transparent 60%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b), var(--bg-c));
      padding: 14px;
    }

    .app{
      max-width: 820px;
      margin: 0 auto;
      border-radius: 24px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .top{
      padding: 16px 16px 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
    }
    .title h1{
      margin:0;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      font-weight: 950;
    }
    .title .mini{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .bar{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .seg{
      display:flex;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex: 1 1 240px;
      min-width: 240px;
    }
    .seg button{
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 9px 10px;
      font-weight: 950;
      font-size: .95rem;
      cursor:pointer;
      background: transparent;
      color: rgba(15,23,42,0.72);
      transition: background .15s ease;
      min-height: 40px;
    }
    .seg button.active{
      background: linear-gradient(135deg, rgba(165,180,252,.95), rgba(147,197,253,.85));
      color: #0b1020;
      box-shadow: 0 8px 20px rgba(165,180,252,.25);
    }

    .date-row{
      display:flex;
      gap: 14px;
      align-items:stretch;
      flex: 1 1 420px;
      min-width: 320px;
    }

    .pill2{
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 18px;
      padding: 12px 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      min-height: 72px;
      flex: 1 1 200px;
    }
    .pill2 .k{
      color: var(--muted);
      font-size: .88rem;
      font-weight: 950;
      line-height: 1.05;
      white-space: nowrap;
    }
    .pill2 .v{
      font-weight: 950;
      font-size: .98rem;
      letter-spacing: -0.01em;
      line-height: 1.12;
      color: rgba(15,23,42,.86);
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #countText{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      gap: 12px;
    }

    .pill2 input[type="date"]{
      border: 0;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(148,163,184,0.20);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 950;
      color: var(--text);
      outline: none;
      font-size: .95rem;
      -webkit-appearance:none;
      width: 100%;
    }

    @media (max-width: 520px){
      .seg{ min-width: 0; flex: 1 1 100%; }
      .date-row{ flex: 1 1 100%; }
    }

    .content{
      padding: 12px 12px 14px;
      border-top: 1px solid rgba(148,163,184,0.14);
    }

    .list{
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(15,23,42,0.08);
    }

    .list-head{
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .list-head .hint{
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .list-head .right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 8px;
      margin-left:auto;
      flex-wrap: wrap;
    }
    .list-head .badge{
      font-size: .86rem;
      font-weight: 950;
      background: rgba(249,168,212,.16);
      border: 1px solid rgba(249,168,212,.25);
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
      color: rgba(15,23,42,.72);
    }

    /* ✅ 완료 숨기기 토글 */
    .toggle{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      user-select: none;
      cursor: pointer;
    }
    .toggle span{
      font-size: .86rem;
      font-weight: 950;
      color: rgba(15,23,42,.72);
      white-space: nowrap;
    }
    .switch{
      width: 44px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(148,163,184,0.18);
      position: relative;
      flex: 0 0 auto;
    }
    .switch::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.22);
      transition: left .14s ease;
    }
    .switch.on{
      background: rgba(134,239,172,.28);
      border-color: rgba(134,239,172,.38);
    }
    .switch.on::after{ left: 21px; }

    ul{ list-style:none; padding:0; margin:0; }

    .item{
      width:100%;
      border:0;
      background: transparent;
      text-align:left;
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      cursor:pointer;
      position: relative;
    }
    .item::before{
      content:"";
      position:absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }
    .item.recv::before{ background: rgba(249,168,212,.55); }
    .item.done::before{ background: rgba(134,239,172,.65); }
    .item.ret::before{ background: rgba(148,163,184,.55); }
    .item.retDone::before{ background: rgba(165,180,252,.70); }

    .item:active{ background: rgba(165,180,252,.08); }

    .main{
      min-width:0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 4px;
      padding-left: 6px;
    }
    .id{
      font-weight: 950;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: #0b1020;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .name{
      font-weight: 850;
      font-size: .95rem;
      color: rgba(15,23,42,0.78);
      word-break: keep-all;
      line-height: 1.25;
    }

    .badge-st{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 950;
      font-size: .82rem;
      border: 1px solid rgba(148,163,184,0.18);
    }
    .badge-recv{
      background: var(--st-recv-bg);
      border-color: var(--st-recv-bd);
      color: var(--st-recv-tx);
    }
    .badge-done{
      background: var(--st-done-bg);
      border-color: var(--st-done-bd);
      color: var(--st-done-tx);
    }
    .badge-ret{
      background: var(--st-ret-bg);
      border-color: var(--st-ret-bd);
      color: var(--st-ret-tx);
    }
    .badge-retDone{
      background: var(--st-retdone-bg);
      border-color: var(--st-retdone-bd);
      color: var(--st-retdone-tx);
    }

    .chev{
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(147,197,253,.18);
      border: 1px solid rgba(147,197,253,.24);
      display:grid;
      place-items:center;
      font-weight: 950;
      color: rgba(15,23,42,.55);
      flex: 0 0 auto;
    }

    .no-data{
      text-align:center;
      padding: 26px 14px;
      color: rgba(15,23,42,0.55);
      font-weight: 900;
    }

    /* =========================
       ✅ 모달: 가운데 띄우기
       ========================= */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.30);
      display:none;
      align-items:center;   /* ✅ 가운데 */
      justify-content:center;
      padding: 12px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .sheet{
      width: min(760px, 100%);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 22px;
      box-shadow: 0 28px 90px rgba(15,23,42,.20);
      overflow:hidden;
      backdrop-filter: blur(14px);
      transform: translateY(8px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }
    .overlay.show .sheet{ transform: translateY(0); opacity: 1; }

    /* =========================
       ✅ 모달 헤더: 한 줄, 왼쪽 정렬 + 우측 상단 토글 배치
       ========================= */
    .sheet-head{
      padding: 12px 14px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      background: rgba(255,255,255,0.78);
      border-bottom: 1px solid rgba(148,163,184,0.18);
    }

    .headLeft{
      min-width:0;
      flex: 1;
      display:flex;
      flex-direction:column;
      gap: 6px;
    }

    /* ✅ 1줄로 왼쪽 정렬 표시 */
    .headLine{
      margin:0;
      font-weight: 950;
      letter-spacing: -0.02em;
      font-size: 1.02rem;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content:flex-start;
    }

    /* ✅ 헤더 뒤쪽(아래) 정보 한줄 */
    .headMeta{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      color: rgba(15,23,42,.72);
      font-weight: 900;
      font-size: .9rem;
      line-height: 1.2;
      justify-content:flex-start;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.20);
      background: rgba(255,255,255,0.70);
      color: rgba(15,23,42,.76);
      font-weight: 950;
      font-size: .85rem;
      white-space: nowrap;
    }

    .headRight{
      flex: 0 0 auto;
      display:flex;
      flex-direction:column;
      gap: 8px;
      align-items:flex-end;
    }

    /* =========================
       ✅ 모달 우측 상단: 반출 토글만
       ========================= */
    .miniToggle{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .miniToggle span{
      font-size: .86rem;
      font-weight: 950;
      color: rgba(15,23,42,.72);
    }
    .miniSwitch{
      width: 44px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(148,163,184,0.18);
      position: relative;
      flex: 0 0 auto;
    }
    .miniSwitch::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.22);
      transition: left .14s ease;
    }
    .miniSwitch.on{
      background: rgba(165,180,252,.28);
      border-color: rgba(165,180,252,.38);
    }
    .miniSwitch.on::after{ left: 21px; }

    /* =========================
       ✅ 모달 본문: 접수/안치완료 토글만
       ========================= */
    .sheet-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 12px;
    }

    .stBlock{
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stBlock .label{
      font-size: .9rem;
      font-weight: 950;
      color: var(--muted);
      white-space: nowrap;
    }

    .stToggle{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.22);
      background: rgba(255,255,255,0.72);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .stToggle span{
      font-size: .86rem;
      font-weight: 950;
      color: rgba(15,23,42,.72);
    }
    .stSwitch{
      width: 44px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(148,163,184,0.18);
      position: relative;
      flex: 0 0 auto;
    }
    .stSwitch::after{
      content:"";
      position:absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(148,163,184,0.22);
      transition: left .14s ease;
    }
    .stSwitch.on{
      background: rgba(134,239,172,.28);
      border-color: rgba(134,239,172,.38);
    }
    .stSwitch.on::after{ left: 21px; }

    .kv{
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 10px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .kv .k{
      color: var(--muted);
      font-weight: 950;
      font-size: .88rem;
      flex: 0 0 auto;
      padding-top: 2px;
    }
    .kv .v{
      font-weight: 900;
      color: rgba(15,23,42,0.82);
      font-size: .95rem;
      text-align:right;
      word-break: keep-all;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }

    .sheet-actions{
      padding: 0 14px 14px;
      display:flex;
      gap: 10px;
    }
    .btnSmall{
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 10px 10px;
      font-weight: 950;
      cursor:pointer;
      min-height: 42px;
    }
    .ok{
      background: linear-gradient(135deg, rgba(134,239,172,.80), rgba(165,180,252,.80));
      border: 1px solid rgba(165,180,252,.22);
      color: rgba(15,23,42,.88);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.80);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 850;
      opacity: 0;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10000;
      max-width: 92%;
      text-align:center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="title">
        <h1>🌸 울산하늘공원 접수 현황</h1>
        <div class="mini" id="todayLabel">오늘: -</div>
      </div>

      <div class="bar">
        <div class="seg" role="tablist" aria-label="시설 선택">
          <button id="tabHouse" class="active" onclick="switchSource('house')">추모의집</button>
          <button id="tabNature" onclick="switchSource('nature')">자연장지</button>
        </div>

        <div class="date-row">
          <div class="pill2" id="datePill">
            <div class="k">날짜선택</div>
            <div class="v">
              <input type="date" id="datePicker" />
            </div>
          </div>

          <div class="pill2" id="countPill">
            <div class="k" id="countTitle">금일현황</div>
            <div class="v" id="countText">접수0건, 반출0건</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="listArea"></div>
    </div>
  </div>

  <!-- 모달 -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div class="headLeft">
          <p class="headLine" id="mTitleLine">-</p>
          <div class="headMeta" id="mMetaLine"></div>
        </div>

        <!-- ✅ 우측 상단: 반출 토글만 -->
        <div class="headRight">
          <div class="miniToggle" id="retToggle" role="switch" aria-checked="false">
            <div class="miniSwitch" id="retSwitch"></div>
            <span id="retToggleText">반출</span>
          </div>
        </div>
      </div>

      <div class="sheet-body">
        <!-- ✅ 접수/안치완료 토글만 -->
        <div class="stBlock">
          <div class="label">안치 상태</div>
          <div class="stToggle" id="recvToggle" role="switch" aria-checked="false">
            <div class="stSwitch" id="recvSwitch"></div>
            <span id="recvToggleText">접수</span>
          </div>
        </div>

        <div id="mFields"></div>
      </div>

      <div class="sheet-actions">
        <button class="btnSmall ok" onclick="closeSheet()">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">-</div>

  <script>
    function getLocalISODate(d = new Date()){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const STORAGE_KEYS = {
      source: "uic_source_selected",
      hideDone: "uic_hide_done"
    };

    const SOURCES = {
      house:  { label: "추모의집", url: "./data/deceased_data.json", dateKey: "strDate" },
      nature: { label: "자연장지", url: "./data/nature_data.json", dateKey: "natDate" }
    };

    /* 요일/표시 문자열 */
    function getKoreanDowChar(isoDate){
      if (!isoDate) return '';
      const [y,m,d] = isoDate.split('-').map(Number);
      if (!y || !m || !d) return '';
      const dt = new Date(y, m-1, d);
      const days = ['일','월','화','수','목','금','토'];
      return days[dt.getDay()];
    }
    function prettyDate(isoDate){
      if (!isoDate) return '-';
      const [y,m,d] = isoDate.split('-');
      const dow = getKoreanDowChar(isoDate);
      return `${y}.${m}.${d}(${dow})`;
    }

    /* retDate 정규화 */
    function normalizeToISODate(v){
      if (v == null) return '';
      const s = String(v).trim();
      if (!s) return '';

      const m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m1) {
        const y = m1[1];
        const m = String(m1[2]).padStart(2,'0');
        const d = String(m1[3]).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }

      const m2 = s.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
      if (m2) {
        const y = m2[1];
        const m = String(m2[2]).padStart(2,'0');
        const d = String(m2[3]).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }

      const m3 = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m3) return `${m3[1]}-${m3[2]}-${m3[3]}`;

      return '';
    }

    function pickRetDate(obj){
      return obj?.retDate ?? obj?.retdate ?? obj?.RETDATE ?? obj?.RetDate ?? '';
    }
    function isRetToday(obj, todayISO){
      return normalizeToISODate(pickRetDate(obj)) === todayISO;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function fetchJson(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
      return res.json();
    }

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* ensNO 포맷 */
    function formatEnsNo(val){
      if (val == null) return '-';
      const raw = String(val).trim();
      if (!raw) return '-';

      if (raw.includes('-')){
        const parts = raw.split('-').map(x => x.trim()).filter(Boolean);
        const roomPart = parts.find(p => /\d+\s*실/.test(p));
        const numPart = parts.find(p => /^\d{1,6}$/.test(p) || /^\d{5}$/.test(p));
        if (roomPart && numPart){
          const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
          const numDigits = numPart.replace(/\D/g,'').padStart(5,'0').slice(-5);
          return `${roomDigits}실 ${numDigits}`;
        }
        if (roomPart){
          const tailNum = parts.slice().reverse().find(p => p.replace(/\D/g,'').length >= 5);
          if (tailNum){
            const roomDigits = roomPart.replace(/\D/g,'').padStart(2,'0').slice(-2);
            const numDigits = tailNum.replace(/\D/g,'').slice(-5).padStart(5,'0');
            return `${roomDigits}실 ${numDigits}`;
          }
        }
      }

      const m1 = raw.match(/(\d{1,2})\s*실\s*(\d{1,5})/);
      if (m1){
        const room = String(m1[1]).padStart(2,'0');
        const num = String(m1[2]).padStart(5,'0');
        return `${room}실 ${num}`;
      }

      let digits = raw.replace(/\D/g,'');
      if (!digits) return raw;

      if (digits.length === 6) digits = digits.padStart(7,'0');
      if (digits.length === 5) return `00실 ${digits}`;
      if (digits.length >= 7){
        const room = digits.slice(0,2);
        const num = digits.slice(-5);
        return `${room}실 ${num}`;
      }

      return raw;
    }

    /* 추모의집: 동일 ensNO 묶기 + retDate 대표값 유지 */
    function mergeEnsRows(rows){
      const map = new Map();
      const order = [];

      for (const r of rows){
        const ens2 = (r.ensNO ?? r.ensNo ?? r.ensno ?? '').toString().trim();
        const key = ens2 || '__NO_ENS__';

        if (!map.has(key)){
          map.set(key, {
            ensNO: ens2 || '-',
            strDate: (r.strDate ?? '-'),
            deadname: (r.deadname ?? r.deadName ?? r.deceasedName ?? '-'),
            applname: (r.applname ?? r.applName ?? '-'),
            retDate: pickRetDate(r) || '',
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);

          const dn = (r.deadname ?? r.deadName ?? r.deceasedName ?? '-').toString();
          const an = (r.applname ?? r.applName ?? '-').toString();

          const curDn = (cur.deadname ?? '-').toString();
          const curAn = (cur.applname ?? '-').toString();

          if (dn && dn !== '-' && !curDn.split(' / ').includes(dn)){
            cur.deadname = (curDn && curDn !== '-') ? `${curDn} / ${dn}` : dn;
          }
          if (an && an !== '-' && !curAn.split(' / ').includes(an)){
            cur.applname = (curAn && curAn !== '-') ? `${curAn} / ${an}` : an;
          }

          const rd = pickRetDate(r);
          if (!cur.retDate && rd) cur.retDate = rd;

          cur._raw.push(r);
        }
      }

      return order.map(key => map.get(key));
    }

    /* 자연장지: 부부장 병합(원본 순서 유지) */
    function mergeCoupleRows(rows) {
      const map = new Map();
      const order = [];
      for (const r of rows) {
        const natNo = (r.natNo ?? '').toString();
        const applName = (r.applName ?? '').toString();
        const key = `${natNo}||${applName}`;
        if (!map.has(key)) {
          map.set(key, {
            natNo: r.natNo ?? '-',
            deadName: (r.deadName ?? r.deadname ?? '-').toString(),
            applName: r.applName ?? '-',
            natDate: (r.natDate ?? '-').toString(),
            _raw: [r]
          });
          order.push(key);
        } else {
          const cur = map.get(key);
          const dn = (r.deadName ?? r.deadname ?? '-').toString();
          if (dn && dn !== '-' && !cur.deadName.split(' / ').includes(dn)){
            cur.deadName = (cur.deadName && cur.deadName !== '-') ? `${cur.deadName} / ${dn}` : dn;
          }
          const dt = (r.natDate ?? '-').toString();
          if (dt && dt !== '-' && !cur.natDate.split(', ').includes(dt)){
            cur.natDate = (cur.natDate && cur.natDate !== '-') ? `${cur.natDate}, ${dt}` : dt;
          }
          cur._raw.push(r);
        }
      }
      return order.map(key => map.get(key));
    }

    /* ✅ 상태 저장: 2트랙
       - 안치: 접수 / 안치완료 (토글)
       - 반출: 반출 / 반출완료 (토글)
    */
    function itemStatusId(sourceKey, item){
      if (sourceKey === 'house'){
        const ens = (item?.ensNO ?? item?.ensNo ?? item?.ensno ?? '-');
        return String(ens ?? '-');
      }
      return String(item?.natNo ?? '-');
    }

    function recvKey(sourceKey, id){ return `recv_${sourceKey}_${id}`; }
    function retKey(sourceKey, id){ return `ret_${sourceKey}_${id}`; }

    function getRecvStatus(sourceKey, id){
      return localStorage.getItem(recvKey(sourceKey, id)) || '접수';
    }
    function setRecvStatus(sourceKey, id, val){
      localStorage.setItem(recvKey(sourceKey, id), val);
    }

    function getRetStatus(sourceKey, id){
      return localStorage.getItem(retKey(sourceKey, id)) || '반출';
    }
    function setRetStatus(sourceKey, id, val){
      localStorage.setItem(retKey(sourceKey, id), val);
    }

    /* ✅ 배지/색상 결정 */
    function catOfItem(sourceKey, item, recvStatus, retStatus){
      if (retStatus === '반출완료') return 'retDone';
      if (retStatus === '반출') return 'ret';

      if (sourceKey === 'house' && isRetToday(item, TODAY)) return 'ret';

      if (recvStatus === '안치완료' || recvStatus === '안장완료') return 'done';
      return 'recv';
    }

    function badgeHTML(cat){
      if (cat === 'retDone') return `<span class="badge-st badge-retDone">반출완료</span>`;
      if (cat === 'ret') return `<span class="badge-st badge-ret">반출</span>`;
      if (cat === 'done') return `<span class="badge-st badge-done">안치완료</span>`;
      return `<span class="badge-st badge-recv">접수</span>`;
    }
    function leftCls(cat){
      if (cat === 'retDone') return 'retDone';
      if (cat === 'ret') return 'ret';
      if (cat === 'done') return 'done';
      return 'recv';
    }

    function kvRow(k, v){
      return `
        <div class="kv">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `;
    }

    /* 금일현황(기존 방식 유지) */
    function calcTodayCounts(sourceKey, rawData, todayISO){
      const source = SOURCES[sourceKey];
      const dateKey = source.dateKey;

      if (sourceKey === 'house'){
        const rows = (Array.isArray(rawData) ? rawData : []).filter(x => {
          const str = String(x?.[dateKey] ?? '');
          const ret = normalizeToISODate(pickRetDate(x));
          return (str === todayISO) || (ret === todayISO);
        });

        const merged = mergeEnsRows(rows);

        let recv = 0;
        let ret = 0;
        for (const it of merged){
          if (isRetToday(it, todayISO)) ret++;
          else if (String(it.strDate ?? '') === todayISO) recv++;
        }
        return { recv, ret };
      }

      const todays = (Array.isArray(rawData) ? rawData : []).filter(x => String(x?.[dateKey] ?? '') === todayISO);
      const mergedN = mergeCoupleRows(todays);
      return { recv: mergedN.length, ret: 0 };
    }

    /* 완료 숨기기 토글 */
    function isHideDoneOn(){
      return localStorage.getItem(STORAGE_KEYS.hideDone) === '1';
    }
    function setHideDone(on){
      localStorage.setItem(STORAGE_KEYS.hideDone, on ? '1' : '0');
    }
    function toggleHideDone(){
      setHideDone(!isHideDoneOn());
      load();
    }

    // DOM
    const datePicker = document.getElementById('datePicker');
    const todayLabel = document.getElementById('todayLabel');
    const listArea = document.getElementById('listArea');

    const tabHouse = document.getElementById('tabHouse');
    const tabNature = document.getElementById('tabNature');

    const countTitle = document.getElementById('countTitle');
    const countText = document.getElementById('countText');

    const overlay = document.getElementById('overlay');

    // 모달 헤더/메타
    const mTitleLine = document.getElementById('mTitleLine');
    const mMetaLine = document.getElementById('mMetaLine');

    // 모달 토글(안치)
    const recvToggle = document.getElementById('recvToggle');
    const recvSwitch = document.getElementById('recvSwitch');
    const recvToggleText = document.getElementById('recvToggleText');

    // 모달 토글(반출 - 우측 상단)
    const retToggle = document.getElementById('retToggle');
    const retSwitch = document.getElementById('retSwitch');
    const retToggleText = document.getElementById('retToggleText');

    const mFields = document.getElementById('mFields');

    let currentSource = 'house';
    let currentDisplayData = [];
    let currentModalItem = null;

    const TODAY = getLocalISODate(new Date());
    todayLabel.textContent = `오늘: ${TODAY}`;
    datePicker.value = TODAY;

    function syncDateLabel(){
      const v = datePicker.value || TODAY;
      datePicker.title = prettyDate(v);
    }
    datePicker.addEventListener('change', () => { syncDateLabel(); load(); });

    function switchSource(sourceKey){
      currentSource = sourceKey;
      localStorage.setItem(STORAGE_KEYS.source, sourceKey);

      tabHouse.classList.toggle('active', sourceKey === 'house');
      tabNature.classList.toggle('active', sourceKey === 'nature');
      load();
    }

    function renderListHead(shownCount, totalCount){
      const on = isHideDoneOn();
      const switchCls = on ? 'switch on' : 'switch';
      const txt = on ? '완료 숨김' : '완료 표시';

      return `
        <div class="list-head">
          <div class="hint">접수현황</div>
          <div class="right">
            <div class="toggle" onclick="toggleHideDone()">
              <div class="${switchCls}" role="switch" aria-checked="${on ? 'true' : 'false'}"></div>
              <span>${escapeHtml(txt)}</span>
            </div>
            <div class="badge">${shownCount.toLocaleString()} / ${totalCount.toLocaleString()}</div>
          </div>
        </div>
      `;
    }

    function setToggleUI(which, on){
      if (which === 'recv'){
        recvSwitch.classList.toggle('on', !!on);
        recvToggle.setAttribute('aria-checked', on ? 'true' : 'false');
        recvToggleText.textContent = on ? '안치완료' : '접수';
        return;
      }
      if (which === 'ret'){
        retSwitch.classList.toggle('on', !!on);
        retToggle.setAttribute('aria-checked', on ? 'true' : 'false');
        retToggleText.textContent = on ? '반출완료' : '반출';
        return;
      }
    }

    function refreshModal(){
      const item = currentModalItem;
      if (!item) return;

      const sourceLabel = SOURCES[currentSource].label;
      const sid = itemStatusId(currentSource, item);

      const recv = getRecvStatus(currentSource, sid); // 접수/안치완료
      const ret = getRetStatus(currentSource, sid);   // 반출/반출완료

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      const cat = catOfItem(currentSource, item, recv, ret);

      // 헤더 1줄: 시설 · 번호 + 배지
      mTitleLine.innerHTML = `${escapeHtml(sourceLabel)} · ${escapeHtml(headerNo)} ${badgeHTML(cat)}`;

      // 헤더 뒤쪽 한 줄(왼쪽 정렬): 고인 / 신청자(있으면)
      const dead = (currentSource === 'house')
        ? String(item.deadname ?? item.deadName ?? item.deceasedName ?? '-')
        : String(item.deadName ?? '-');

      const appl = (currentSource === 'house')
        ? String(item.applname ?? item.applName ?? '-')
        : String(item.applName ?? '-');

      mMetaLine.innerHTML = `
        <div class="chip">고인: ${escapeHtml(dead)}</div>
        <div class="chip">신청자: ${escapeHtml(appl)}</div>
      `;

      // 토글 UI
      setToggleUI('recv', recv === '안치완료');
      setToggleUI('ret', ret === '반출완료');
    }

    function applyRecvToggle(){
      const item = currentModalItem;
      if (!item) return;
      const sid = itemStatusId(currentSource, item);

      const cur = getRecvStatus(currentSource, sid);
      const next = (cur === '안치완료') ? '접수' : '안치완료';
      setRecvStatus(currentSource, sid, next);

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      showToast(`✅ ${headerNo} : ${next}`);
      refreshModal();
      load();
    }

    function applyRetToggle(){
      const item = currentModalItem;
      if (!item) return;
      const sid = itemStatusId(currentSource, item);

      const cur = getRetStatus(currentSource, sid);
      const next = (cur === '반출완료') ? '반출' : '반출완료';
      setRetStatus(currentSource, sid, next);

      const headerNo = (currentSource === 'house')
        ? formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-')
        : String(item.natNo ?? '-');

      showToast(`✅ ${headerNo} : ${next}`);
      refreshModal();
      load();
    }

    function buildFields(item){
      let fieldsHTML = '';
      if (currentSource === 'house'){
        fieldsHTML += kvRow('안치일자', item.strDate ?? '-');
        fieldsHTML += kvRow('봉안번호', formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-'));
        fieldsHTML += kvRow('고인명', item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
        fieldsHTML += kvRow('신청자', item.applname ?? item.applName ?? '-');

        const rdISO = normalizeToISODate(pickRetDate(item));
        const rdRaw = pickRetDate(item);
        if (rdISO){
          fieldsHTML += kvRow('반출일자', String(rdRaw ?? rdISO));  <!-- ✅ 변경 -->
        }
      } else {
        fieldsHTML += kvRow('안치일자', item.natDate ?? '-');
        fieldsHTML += kvRow('안장번호', item.natNo ?? '-');
        fieldsHTML += kvRow('고인명', item.deadName ?? '-');
        fieldsHTML += kvRow('신청자', item.applName ?? '-');
      }
      return fieldsHTML;
    }

    async function load(){
      const source = SOURCES[currentSource];
      const selectedDate = datePicker.value || TODAY;

      try{
        syncDateLabel();

        const raw = await fetchJson(source.url);
        const data = Array.isArray(raw) ? raw : [];

        // 금일현황
        const c = calcTodayCounts(currentSource, data, TODAY);
        countTitle.innerHTML = `금일현황`;
        if (currentSource === 'house'){
          countText.innerHTML = `접수${c.recv}건, 반출${c.ret}건`;
        } else {
          countText.innerHTML = `접수${c.recv}건, 반출0건`;
        }

        // 날짜 필터
        const dateKey = source.dateKey;
        let filtered = [];

        if (currentSource === 'house'){
          const sel = selectedDate;
          const isTodayView = (sel === TODAY);

          filtered = data.filter(x => {
            const str = String(x?.[dateKey] ?? '');
            const ret = normalizeToISODate(pickRetDate(x));

            if (str === sel) return true;
            if (isTodayView && ret === TODAY) return true;
            return false;
          });
        } else {
          filtered = data.filter(x => String(x?.[dateKey] ?? '') === selectedDate);
        }

        // 병합
        let displayData = filtered;
        if (currentSource === 'house') displayData = mergeEnsRows(filtered);
        if (currentSource === 'nature') displayData = mergeCoupleRows(filtered);

        // 완료 숨기기(안치완료/반출완료)
        const hideDone = isHideDoneOn();
        if (hideDone){
          displayData = displayData.filter(item => {
            const sid = itemStatusId(currentSource, item);
            const recv = getRecvStatus(currentSource, sid);
            const ret = getRetStatus(currentSource, sid);
            const cat = catOfItem(currentSource, item, recv, ret);
            return !(cat === 'done' || cat === 'retDone');
          });
        }

        currentDisplayData = displayData;

        if (displayData.length === 0){
          listArea.innerHTML = `<div class="no-data">표시할 데이터가 없습니다.</div>`;
          return;
        }

        const limit = 80;
        const shown = displayData.slice(0, limit);

        let html = `<div class="list">`;
        html += renderListHead(Math.min(limit, displayData.length), displayData.length);
        html += `<ul>`;

        shown.forEach((item, idx) => {
          let displayId = '-';
          let displayName = '-';
          const sid = itemStatusId(currentSource, item);

          const recv = getRecvStatus(currentSource, sid);
          const ret = getRetStatus(currentSource, sid);
          const cat = catOfItem(currentSource, item, recv, ret);

          if (currentSource === 'house'){
            displayId = formatEnsNo(item.ensNO ?? item.ensNo ?? item.ensno ?? '-');
            displayName = (item.deadname ?? item.deadName ?? item.deceasedName ?? '-');
          } else {
            displayId = String(item.natNo ?? '-');
            displayName = String(item.deadName ?? '-');
          }

          html += `
            <li>
              <button class="item ${leftCls(cat)}" onclick="openSheet(${idx})">
                <div class="main">
                  <div class="id">
                    ${escapeHtml(displayId)}
                    ${badgeHTML(cat)}
                  </div>
                  <div class="name">${escapeHtml(displayName)}</div>
                </div>
                <div class="chev">›</div>
              </button>
            </li>
          `;
        });

        html += `</ul></div>`;
        listArea.innerHTML = html;

        if (displayData.length > limit){
          listArea.insertAdjacentHTML('beforeend', `<div class="no-data" style="padding:10px 0 0;">(상위 ${limit}건만 표시 중)</div>`);
        }

      }catch(err){
        listArea.innerHTML = `<div class="no-data">❌ 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    function openSheet(index){
      const item = currentDisplayData[index];
      if (!item) return;

      currentModalItem = item;

      // 필드 채우기
      mFields.innerHTML = buildFields(item);

      // 모달 헤더/토글 갱신
      refreshModal();

      // 토글 이벤트
      recvToggle.onclick = applyRecvToggle;
      retToggle.onclick = applyRetToggle;

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
    }

    function closeSheet(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
      currentModalItem = null;
    }

    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet(); });

    window.addEventListener('load', () => {
      const saved = localStorage.getItem(STORAGE_KEYS.source);
      const initial = (saved === 'nature' || saved === 'house') ? saved : 'house';
      currentSource = initial;

      tabHouse.classList.toggle('active', initial === 'house');
      tabNature.classList.toggle('active', initial === 'nature');

      if (localStorage.getItem(STORAGE_KEYS.hideDone) == null){
        setHideDone(false);
      }

      datePicker.value = getLocalISODate(new Date());
      syncDateLabel();
      load();
    });
  </script>
</body>
</html>
